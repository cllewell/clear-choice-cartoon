ccurate information and a realistic plan — whether you want to stay vape-free or stop using nicotine.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Open sans, sans-serif;font-size:1.0625em\">This course was designed for people in schools, justice programs, and families. Whoever sent you here, the content is the same and the respect is the same.</span></p>", "textType": "RichText"}, "id": "403d6833-09af-4283-8b94-672fa89323d6"}, {"component": "IMAGE", "config": {"src": "/resources/CC Intro Dangers and Risks of Vaping - 5afd0b23.jpeg", "alt": "Image of students sitting in class learning about the dangers of vaping and nicotine risks. The teacher is standing at the board in front of the students pointing out the risks.", "variant": "square", "blockId": 640680, "caption": {"text": ""}, "mode": "scale"}, "id": "f11e936c-aeb1-4345-9b73-858814ddc0f2"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "90836ede-b76e-4195-b632-898447f9b738"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Intro Welcome US-Andrew-20260625-237c - 4ca0b21e.mp3", "transcript": " "}, "id": "fadb1af2-9fbc-4c0d-a2fb-cb28b269f9ad"}], "parentHash": "a5c88d16-03d6-4d65-bd18-a0eb0eb71908", "order": 2, "layoutType": null, "alignContent": null, "learningobject_id": 27307}, {"id": 640681, "hashId": "3394087c-1e46-4608-9774-766588844ef1", "learningObjectId": 27307, "title": "What you will Learn", "synopsis": "Course Outline of 6 Chapters", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640681, "content": "<h2 class=\"font-style--h2\"><strong style=\"font-family:Open sans, sans-serif;color:rgb(34, 34, 34);font-size:1.0625em\">What You Will Learn</strong></h2>", " dc4"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">The word 'vaping' has been used so casually for so long that many people — including many who vape — don't have a precise sense of what they are actually doing.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">That gap matters. Understanding what is in the device and what happens when it is used is the foundation for every other conversation in this course.</span></p>", "blockId": 640417, "textType": "RichText"}, "id": "0e77127b-e3c9-4940-96a4-fb8836519ce6"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 01 What is Vaping - 0cf4b3e1.jpeg", "alt": "Image of a teenaged boy with a backpack hanging on his shoulder. He is standing in the middle of a school hallway with a thought bubble over his head that says, What is Vaping. The hallway is lined with lockers and students at their lockers on the right side and a bulletin board and posters on the left side.", "variant": "square", "blockId": 640417, "caption": {"text": ""}, "mode": "scale"}, "id": "5bcf1b7c-d8e6-4420-b60b-848800309f4f"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "c5fdd50c-14d7-491f-8370-de9a587ab76f"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 01 Introduction-88613182-5b99 - 1a0ef268.mp3", "transcript": " "}, "id": "fe8d3818-6fbf-42af-bdae-15cb5681b44f"}], "parentHash": "b621fc87-1cb6-498e-a02a-2b7cc59f330c", "order": 1, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27298}, {"id": 640418, "hashId": "6879e130-59fc-4112-bea3-77bd99f7d39e", "learningObjectId": 27298, "title": "What an e-cigarette Does", "synopsis": "Describes E-Cigarettes and how they work on the brain", "templateBlock": false, "sectionId": null, "block": "VIDEO-RIGHT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640418, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">What an E-Cigarette Does</strong></h1>", "textType": "HEADING"}, "id": "a2c3e3a6-4caf-4823-97cf-674ae71572e0"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">An e-cigarette — also called a vape, vape pen, e-cig, mod, pod device, or disposable — is a battery-powered device that heats a liquid until it becomes a fine aerosol, which the user inhales.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">The liquid inside typically contains propylene glycol, vegetable glycerin, flavorings, and — in the vast majority of devices — nicotine.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">The word 'vapor' sounds harmless. Aerosol is the accurate term: a suspension of tiny liquid and solid particles in air that behaves differently in the lungs than a gas would. </span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Click the play button on the video to see how the lungs are affected.</span></p>", "blockId": 640418, "textType": "RichText"}, "id": "ceabde7f-1adc-48fa-a440-6938b377ed45"}, {"component": "VIDEO", "config": {"src": "/resources/CC Chapter 02 Aerosol Vapor-3a5c93ca-bb3 - 4dccecb6.mp4", "trackUrl": "/resources/2019-11-26T00-19-23.925Z-siren.vtt", "posterUrl": "", "blockId": 640418}, "id": "f56695d4-b035-4f8b-a75e-ee5cbb68c7e8"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "d882bd33-7be0-4a0a-862d-5df224e5be44"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 01 What an e-Cigarette Does - 5e308a6c.mp3", "transcript": " "}, "id": "1cf99cd1-866a-4a28-a0b8-4d8c33c47ad8"}], "parentHash": "b621fc87-1cb6-498e-a02a-2b7cc59f330c", "order": 2, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27298}, {"id": 640419, "hashId": "80e0bd41-b7d8-41b4-a35c-cf74d9944d85", "learningObjectId": 27298, "title": "Device Types", "synopsis": "3 types of vaping devices shown and described.", "templateBlock": false, "sectionId": null, "block": "INFOGRAPHIC-TEXT-LEFT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640419, "content": "<h2 class=\"font-style--h2\"><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Three Main Types of Vaping Devices:</span></h2>", "textType": "HEADING"}, "id": "78032a38-9b46-4385-a890-83b93653d28b"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">• Disposable — single-use, pre-filled, pre-charged. Most common among youth (55.6% of users, FDA 2024).</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">• Pod/Cartridge system — reusable battery + replaceable pod. One JUUL pod ≈ nicotine in 1 pack of cigarettes.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">• Refillable tank/mod — larger device, user-chosen liquid. More common among longer-term adult users.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Newer devices are designed to look like pens, highlighters, or lip balm.</span></p>", "blockId": 640419, "textType": "RichText"}, "id": "0ef41222-e329-4d2f-8186-bbd5adda015e"}, {"component": "INFOGRAPHIC", "config": {"image": {"src": "/resources/Types of Vaping Devices-057b8041-2830-4b - 80affebd.png", "alt": "Image of 3 types of vaping devices shown in silhouette. The devices shown are a disposal vape, a pod system and a refillable tank.", "variant": "square", "mode": "scale", "caption": {"text": ""}, "disableModeConfig": true, "disableZoom": true}, "icon": {"src": "assets/magnify_glass.png", "alt": "AltText"}, "buttons": [{"x": "20.9%", "y": "46.8%", "content": {"heading": {"text": "", "content": "<h2 class=\"font-style--h2\"><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">Disposable — single-use, pre-filled, pre-charged</span></h2>", "textType": "RichText"}, "richText": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\"> Disposable — single-use, pre-filled, pre-charged. Most common among youth (55.6% of users, FDA 2024).</span></p>", "textType": "RichText"}, "image": {"src": "/resources/Disposable Vape Device-fa781dcb-b459-410 - d21c8317.jpg", "alt": "Image of a disposable - single use, pre-filled, pre-charged  vape shown in silhouette.", "variant": "square", "caption": {"text": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "layout": "LAYOUT_LEFT", "mediaType": "IMAGE", "modalSize": "md"}, "isActive": false, "id": "11bd15d3-577e-4273-8e08-dc4bd696f559", "isModalOpen": false, "labelText": "learn more about disposable vapes"}, {"x": "49.3%", "y": "19.5%", "content": {"heading": {"text": "", "content": "<h2 class=\"font-style--h2\"><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">Pod/Cartridge system — reusable battery + replaceable pod</span></h2>", "textType": "RichText"}, "richText": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Pod/Cartridge system — reusable battery + replaceable pod. One JUUL pod ≈ nicotine in 1 pack of cigarettes.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/Pod Vaping System-b251b994-9842-45b0-854 - e4e20508.jpg", "alt": "Image of a pod/cartridge system vaping device shown in silhouette. ", "variant": "square", "caption": {"text": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "layout": "LAYOUT_RIGHT", "mediaType": "IMAGE", "modalSize": "md"}, "isActive": false, "id": "5f901e64-bd39-4249-8ec2-946fe07a83e6", "isModalOpen": false, "labelText": "Learn more about pod systems"}, {"x": "80%", "y": "50%", "content": {"heading": {"text": "", "content": "<h2 class=\"font-style--h2\"><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\"> Refillable tank/mod — larger device, user-chosen liquid</span></h2>", "textType": "RichText"}, "richText": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Refillable tank/mod — larger device, user-chosen liquid. More common among longer-term adult users.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/Refillable Vaping Tank-a48a31d3-814f-42a - 782d6466.jpg", "alt": "Image of a refillable tank/mod vaping device shown in silhouette.", "variant": "square", "caption": {"text": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "layout": "LAYOUT_LEFT", "mediaType": "IMAGE", "modalSize": "md"}, "isActive": false, "id": "5041d1b0-4dee-4449-932a-b22902df201f", "isModalOpen": false, "labelText": "Learn more about refillable tanks"}], "blockId": 640419}, "id": "54acd440-2d34-4204-89d6-f544d26cfdf0"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "3eaf3b4b-71ef-4cc7-84ba-7096de0bd0db"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 01 Three Main Types of - 0575bfb1.mp3", "transcript": " "}, "id": "ddb76f21-8763-416e-adfb-67a74efa3722"}], "parentHash": "b621fc87-1cb6-498e-a02a-2b7cc59f330c", "order": 3, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27298}, {"id": 640420, "hashId": "a5151e18-296a-4cdf-8efd-1dce66e5ed9b", "learningObjectId": 27298, "title": "What is in Aerosol", "synopsis": "A list and description of what aerosol contains", "templateBlock": false, "sectionId": null, "block": "TEXT-CENTERED__ONE-ROW-TWO-THIRD", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640420, "content": "<h1 class=\"font-style--h1\"><span style=\"font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\">🤔WHAT IS IN AEROSOL?</span></h1>", "textType": "HEADING"}, "id": "c7021dc9-68b0-45d8-867c-2cd8a1a5ea87"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">E-cigarette aerosol can contain:</span></p><p class=\"ql-align-justify\"><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">• Nicotine</span></p><p class=\"ql-align-justify\"><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">• Propylene glycol and glycerin breakdown products</span></p><p class=\"ql-align-justify\"><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">• Flavoring chemicals (including diacetyl, acetaldehyde, acrolein)</span></p><p class=\"ql-align-justify\"><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">• Heavy metals — nickel and lead from the heating coil</span></p><p class=\"ql-align-justify\"><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">• Fine and ultrafine particles</span></p><p class=\"ql-align-justify\"><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">• Volatile organic compounds</span></p><p class=\"ql-align-justify\"><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">• In some products: formaldehyde</span></p><p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">It is not water vapor. It is not harmless mist. CDC states explicitly that e-cigarette aerosol can contain harmful and potentially harmful substances.</span></p>", "blockId": 640420, "textType": "RichText"}, "id": "807bbe30-edbc-4082-a4eb-215cfea6bbff"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "71f80441-885a-405c-bba3-f9ab62151acf"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 01 What is in Aerosol-5e2e1a6 - f04e9221.mp3", "transcript": " "}, "id": "facf3726-07c1-420e-9466-45676e1088e3"}], "parentHash": "b621fc87-1cb6-498e-a02a-2b7cc59f330c", "order": 4, "layoutType": "ONE-ROW-TWO-THIRD", "alignContent": null, "learningobject_id": 27298}, {"id": 640421, "hashId": "b810c293-83d0-4e01-965c-18f3e028b4b7", "learningObjectId": 27298, "title": "The Nicotine Question", "synopsis": "Explains that e-cigarettes contains 99% nicotine", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640421, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">The Nicotine Question</strong></h1>", "textType": "HEADING"}, "id": "e56c97ff-82a8-4fc4-9fe4-9ee8aeb5a8e7"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Most e-cigarettes contain nicotine. CDC estimates more than </span><strong style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">99% </strong><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">of e-cigarettes sold in convenience stores contain nicotine — yet surveys show many young users do not know their device contains it.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">In one study, nearly two-thirds of users of a popular high-nicotine device were unaware the product always contained nicotine.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Why? Flavoring. A device that tastes like mango doesn't taste the way most people imagine a drug tasting. The nicotine is there — the flavor masks it.</span></p>", "blockId": 640421, "textType": "RichText"}, "id": "2ed3cf69-36a4-4ece-8595-c1466b9c7ef5"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 01 Pie Chart E-Cigarettes - 447470d1.png", "alt": "Image of a pie chart showing 99% on top of a convenience store with the caption at the bottom of the image that says, percentage of e-cigarettes sold in convenience stores that contain nicotine.", "variant": "square", "blockId": 640421, "caption": {"text": ""}, "mode": "scale"}, "id": "7692ff9a-c6b5-4037-9a3a-23e65181c71e"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "92244001-b577-41c4-8673-d711c767c38d"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 01 The Nicotine - bbc02b48.mp3", "transcript": " "}, "id": "f2ee64da-f6af-4bdc-9361-f16ff71b11b3"}], "parentHash": "b621fc87-1cb6-498e-a02a-2b7cc59f330c", "order": 5, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27298}, {"id": 640422, "hashId": "490b41df-ddf7-4d5f-8f7b-e11b8b0ead23", "learningObjectId": 27298, "title": "Key Facts", "synopsis": "Key facts provided about e-cigarettes", "templateBlock": false, "sectionId": null, "block": "TEXT-CENTERED__ONE-ROW-TWO-THIRD", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640422, "content": "<h1 class=\"font-style--h1\"><span style=\"font-size:1.0625em;color:rgba(0, 0, 0, 0.918)\">🔑Key Facts</span></h1>", "textType": "HEADING"}, "id": "db9006f3-14b0-4c24-82ad-b4667cff8c14"}, {"component": "RICH-TEXT", "config": {"content": "<p class=\"font-style--paragraph\"><span style=\"font-size:1.1875em;font-family:Open sans, sans-serif;color:rgba(0, 0, 0, 0.918)\">• Most e-cigarettes sold in U.S. stores contain nicotine.</span></p><p class=\"font-style--paragraph\"><span style=\"font-size:1.1875em;font-family:Open sans, sans-serif;color:rgba(0, 0, 0, 0.918)\">• One popular pod device delivers as much nicotine as an entire pack of cigarettes.</span></p><p class=\"font-style--paragraph\"><span style=\"font-size:1.1875em;font-family:Open sans, sans-serif;color:rgba(0, 0, 0, 0.918)\">• 87.6% of youth e-cigarette users use flavored products (FDA 2024 NYTS).</span></p><p class=\"font-style--paragraph\"><span style=\"font-size:1.1875em;font-family:Open sans, sans-serif;color:rgba(0, 0, 0, 0.918)\">• 55.6% of current youth e-cigarette users use disposable devices.</span></p><p class=\"font-style--paragraph\"><span style=\"font-size:1.1875em;font-family:Open sans, sans-serif;color:rgba(0, 0, 0, 0.918)\">• E-cigarette aerosol can contain heavy metals, VOCs, and fine particles.</span></p><p class=\"font-style--paragraph\"><span style=\"font-size:1.1875em;font-family:Open sans, sans-serif;color:rgba(0, 0, 0, 0.918)\">• No e-cigarette has been approved by FDA as a smoking-cessation medicine.</span></p>", "blockId": 640422, "textType": "RichText"}, "id": "6f2d390e-1e12-461e-9357-0bf345a05924"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "0806852f-ef80-4058-80cf-a4577203d204"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 01 Key Facts-5fbec39a-becf-4f - 114bf17d.mp3", "transcript": " "}, "id": "50a99374-4941-4fe4-a236-ff0fc2340206"}], "parentHash": "b621fc87-1cb6-498e-a02a-2b7cc59f330c", "order": 6, "layoutType": "ONE-ROW-TWO-THIRD", "alignContent": "Center", "learningobject_id": 27298}, {"id": 640423, "hashId": "43047a1c-4728-4714-9d99-53c85ea084a4", "learningObjectId": 27298, "title": "Just Flavored Air - Why That's Wrong", "synopsis": "Explains why aerosol is not just flavored air", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640423, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">'Just Flavored Air' — Why That's Wrong</strong></h1>", "textType": "HEADING"}, "id": "c9aad109-f50a-442d-bfc4-2ccbee446472"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">This phrase misrepresents the chemistry of aerosol in two ways.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">First: aerosol particles — unlike gases — are captured in the lungs. They are not breathed in and out without depositing anything.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Second: flavoring chemicals alone can include diacetyl (linked to serious lung disease), acetaldehyde, acrolein, and benzaldehyde. None of these are 'just air' by any chemist's definition.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Some products are sold as 'nicotine-free.' Research has found many still contain detectable nicotine, especially unregulated imported products.</span></p>", "blockId": 640423, "textType": "RichText"}, "id": "e16634c4-efb8-4306-82b2-11de636eec54"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 01 Is Vaping Just Flavored - d65e3b20.jpeg", "alt": "Image of a teenaged boy sitting at a desk with books and a notebook on it. He has a thought cloud over his head that says, Is Vaping Aerosol Just flavored Air? The is an unmade bed behind him and posters on the wall.", "variant": "square", "blockId": 640423, "caption": {"text": ""}, "mode": "scale"}, "id": "ff4377ee-13b3-429b-a478-bd77948f4052"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "5b8501c2-c2f6-4803-beb7-16dada4f40a8"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 01 Just Flavored Air - Why - 24f7f527.mp3", "transcript": " "}, "id": "d04294a0-3951-4a50-803e-a77e84ced499"}], "parentHash": "b621fc87-1cb6-498e-a02a-2b7cc59f330c", "order": 7, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27298}, {"id": 640424, "hashId": "d81528ce-44af-436b-9f09-afeaaa796d5e", "learningObjectId": 27298, "title": "Knowledge Check 1", "synopsis": "Multiple Choice question about aerosol", "templateBlock": false, "sectionId": null, "block": "MULTIPLE-CHOICE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 631437, "content": "<h3 class=\"font-style--h3\">Knowledge Check 1</h3>", "textType": "HEADING"}, "id": "284dbe7b-1073-4c13-9425-9b3227976fd2"}, {"component": "RICH-TEXT", "config": {"content": "<p><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Which statement about e-cigarette aerosol is most accurate?</strong></p>", "blockId": 631437, "textType": "RichText"}, "id": "fc0672df-f506-4050-b50d-8de247c17c93"}, {"component": "MULTIPLE-CHOICE", "config": {"randomize": false, "select": 4, "allowMultiple": false, "question": {"text": "", "content": "<p><strong style=\"font-size:1.1875em\">Choose the correct answer:</strong></p>", "textType": "RichText"}, "multipleChoiceType": "default", "answerType": "TEXT", "answers": [{"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": false, "selected": false, "index": 0, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "dd75efa9-b6b1-4e8a-bab5-e5b0811a0cd6", "content": "<p><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">A. Aerosol is primarily water vapor and is exhaled without depositing anything in the lungs.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": true, "selected": false, "index": 1, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "983c6dfe-57b5-47ab-86fc-c50fefa112f1", "content": "<p><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">B. Aerosol can contain nicotine, fine particles, heavy metals, and harmful chemical compounds.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": false, "selected": false, "index": 2, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "f8065e41-1abd-431f-a1e9-9bdea6496a5a", "content": "<p><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">C. Only tobacco-flavored products contain harmful aerosol components.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "correct": false, "id": "ed4678c6-e248-4b43-bb03-98f5503d8f74", "index": 3, "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">D. Aerosol is only a concern for daily users.</span></p>", "textType": "RichText"}], "blockId": 631437}, "id": "9a0bede3-cab9-4075-b714-f3b700571386"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Correct.</h1>", "textType": "RichText"}, "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">Right. CDC states that aerosol is not harmless and can contain harmful and potentially harmful substances.</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect.", "content": "<h1 class=\"font-style--h1\"><span style=\"font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">Not quite. </span></h1>", "textType": "RichText"}, "content": "<p><span style=\"font-size:1.0625em;color:rgb(255, 255, 255);font-family:Calibri, sans-serif\">Go back & review the aerosol information, then continue.</span></p>", "textType": "RichText"}, "blockId": 631437}, "id": "43b1308f-37af-4182-8ee8-7af3ee97a2f1"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "6383e566-949c-4ad7-a056-fa4b0f1ba6a7"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 1 Knowledge Check - 6870fea8.mp3", "transcript": " "}, "id": "0bee2bc1-c9b8-497a-97f2-ca31de08668d"}], "parentHash": "b621fc87-1cb6-498e-a02a-2b7cc59f330c", "order": 8, "layoutType": null, "alignContent": null, "learningobject_id": 27298}, {"id": 640425, "hashId": "81b6c486-3dbd-4622-bdad-d09ec1a2b07a", "learningObjectId": 27298, "title": "Reflection", "synopsis": "Chapter one reflection questions", "templateBlock": false, "sectionId": null, "block": "TEXT-ENTRY-TEXT-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 631439, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Reflection — Chapter 1</strong></h1>", "textType": "HEADING"}, "id": "73fcab43-b803-457f-a144-d552a87453f5"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Take a moment to answer these questions. </span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">1. Before reading this chapter, how much did you know about what was actually in a vape? Has anything here surprised you?</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">2. Why do you think many young people believe vaping is just flavored water vapor?</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">3. If a friend said 'it's just air with flavor in it,' what would you say back now?</span></p>", "blockId": 631439, "textType": "RichText"}, "id": "fa80d422-4442-467e-9f5b-f602beb8b7a5"}, {"component": "TEXT-ENTRY", "config": {"question": {"text": "", "content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Type your answers in the box below. Your answers are saved to your account and are not graded.</span></p>", "textType": "RichText"}, "placeholder": {"text": "Enter your response here"}, "blockId": 631439}, "id": "bfd3aa0a-9cd1-4232-9650-9d565e382e22"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Thanks.</h1>", "textType": "RichText"}, "content": "<p><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">Your answers are saved to your account and are not graded.</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect."}, "content": {"text": "Incorrect."}}, "blockId": 631439}, "id": "ec51ab1f-593d-43ba-bb8b-dc68d9b0fc9b"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "a2418990-70ae-4fff-b399-b6e0cdc506ba"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 01 Reflection US-Andrew-20260 - 7d5a7c06.mp3", "transcript": " "}, "id": "2ea6a0cd-3717-4e8a-a772-6149452b9c1e"}], "parentHash": "b621fc87-1cb6-498e-a02a-2b7cc59f330c", "order": 9, "layoutType": null, "alignContent": null, "learningobject_id": 27298}, {"id": 640426, "hashId": "3b37ed34-7e7b-43b1-bd3d-f38202425079", "learningObjectId": 27298, "title": "Chapter 1 Summary", "synopsis": "End of Chapter 1", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 631613, "content": "<h1 class=\"font-style--h1\">Nice Work!</h1><p class=\"font-style--h1\">Chapter 1...done!</p>", "textType": "HEADING"}, "id": "1993a015-d826-4b35-9aa2-f403c27e76e9"}, {"component": "RICH-TEXT", "config": {"content": "<p><strong style=\"font-size:1.3125em\">Next up...Chapter 2 - </strong><strong style=\"font-size:1.1875em\">Your Brain on Nicotine.</strong></p>", "blockId": 631613, "textType": "RichText"}, "id": "d988bb5d-8f9a-4828-96ac-2a2a823b6cfd"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 1 Travel road to chapter 2 - b746ff2f.gif", "alt": "Animated image traveling the course roadmap to the chapter 2 sign.", "variant": "square", "blockId": 631613, "caption": {"text": ""}, "mode": "scale"}, "id": "d79aff9c-9d71-4379-b7fe-f66044637d65"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "9093898e-d5bf-46a8-8e22-48fcc7fa04b2"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 01 Nice Work Chapter 1 Done - e26bd245.mp3", "transcript": " "}, "id": "c3825d2a-0c52-4b30-835d-bf5833e5a39f"}], "parentHash": "b621fc87-1cb6-498e-a02a-2b7cc59f330c", "order": 10, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27298}, {"id": 640118, "hashId": "3bdfa453-775a-4a84-bd2a-b78355fe8e39", "learningObjectId": 27285, "title": "Chapter 2: Your Brain on Nicotine", "synopsis": null, "templateBlock": true, "sectionId": null, "block": null, "blockType": "SECTION-BLOCK", "components": null, "parentHash": "ff628d4b-4648-4d68-bfd5-66031dc71902", "order": 3, "layoutType": null, "alignContent": null, "learningobject_id": 27285}, {"id": 640119, "hashId": "e17b7eb5-e533-4df0-9070-b789de50c887", "learningObjectId": 27285, "title": "Chapter 2 Introduction", "synopsis": "Introduction to Chapter 2 - Your Brain on Nicotine.", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640119, "content": "<h1 class=\"font-style--h1\">Chapter 2 - Your Brain on Nicotine</h1>", "textType": "HEADING"}, "id": "c84800ca-e6ac-4491-8f7d-3c5aa38e5f28"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Of all the facts in this course, the relationship between nicotine and the developing brain most directly explains why vaping risks are different for young people than for adults. It's also the fact that the tobacco industry has the strongest interest in keeping quiet.</span></p>", "blockId": 640119, "textType": "RichText"}, "id": "8311e2e2-2ad2-49d5-bd86-d3a7e748d117"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 02 Rotating Brain - 937177de.gif", "alt": "Animated image of rotating brain.", "variant": "square", "blockId": 640119, "caption": {"text": ""}, "mode": "fill"}, "id": "62e697e8-e02b-4528-a1ea-37d52c0aad5a"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "3ff30f66-3516-46da-a560-9ba57baa1a47"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 Introduction - 2be93ecb.mp3", "transcript": " "}, "id": "5ed762f6-b405-41d9-91d8-d637c8dcbc5b"}], "parentHash": "3bdfa453-775a-4a84-bd2a-b78355fe8e39", "order": 1, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27285}, {"id": 640120, "hashId": "962a52f6-08db-4014-9cbd-630981b79e40", "learningObjectId": 27285, "title": "The Developing Brain", "synopsis": "Explains the developing brain", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL-FULL-SCREEN", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640120, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">The Developing Brain</strong></h1>", "textType": "HEADING"}, "id": "6568a813-dd51-42a1-8dbf-b74a73766dec"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">The human brain does not finish developing at 16, or 18, or 21. Neuroscience research consistently shows that brain development — particularly in regions responsible for decision-making, impulse control, emotional regulation, and reward processing — continues until approximately age 25.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">That extended developmental window is one of humanity's greatest advantages. It also creates vulnerability: a brain still building its architecture can be shaped — and disrupted — by powerful chemical inputs in ways a fully matured brain cannot.</span></p>", "blockId": 640120, "textType": "RichText"}, "id": "f81ba87a-9f41-459e-a6f2-3e07351702d6"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 02 Timeline of Brain - 2ef25147.jpeg", "alt": "Infographic of the timeline of brain development. shows the stages of development and the ages when the development takes place.", "variant": "square", "blockId": 640120, "caption": {"text": ""}, "mode": "fit"}, "id": "a4f711dd-99ba-40f8-89db-24dd19d01489"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "4501cfcb-85ce-49a3-8ef1-062777186f26"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 The Developing Brain - d58749c9.mp3", "transcript": " "}, "id": "be12d3df-06f1-468b-92ea-3e89ab89f084"}], "parentHash": "3bdfa453-775a-4a84-bd2a-b78355fe8e39", "order": 2, "layoutType": "ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL-FULL-SCREEN", "alignContent": null, "learningobject_id": 27285}, {"id": 640121, "hashId": "4ec536c2-b092-4096-809f-cae9c04272f3", "learningObjectId": 27285, "title": "Key Facts ", "synopsis": "Lists and describes facts about the brain and the effects of nicotine", "templateBlock": false, "sectionId": null, "block": "TEXT-CENTERED__ONE-ROW-TWO-THIRD", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640121, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918);font-size:1.0625em\"> 🧠Key Facts — Brain</strong></h1>", "textType": "HEADING"}, "id": "876f53ec-ffaf-4de1-9b33-491cf570875b"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\">• Brain development, including the prefrontal cortex (judgment, impulse control), continues until ~age 25.</span></p><p><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\">• Nicotine can interfere with brain development affecting attention, learning, mood, and impulse control (CDC).</span></p><p><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\">• Youth can show signs of nicotine addiction even before daily use begins.</span></p><p><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\">• Teen brains become dependent on nicotine more quickly than adult brains.</span></p><p><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\">• Adolescent nicotine exposure increases susceptibility to other addictions later in life (NIDA).</span></p>", "blockId": 640121, "textType": "RichText"}, "id": "bc5fdb40-0c25-466d-a471-ddcfa3b05e0d"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "43b78852-636b-4aec-95c4-8befd158a5ac"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 Key Facts Brain - a29c5f6f.mp3", "transcript": " "}, "id": "ef7a872a-4e4e-40d9-9e76-5f3deef96c05"}], "parentHash": "3bdfa453-775a-4a84-bd2a-b78355fe8e39", "order": 3, "layoutType": "ONE-ROW-TWO-THIRD", "alignContent": "Center", "learningobject_id": 27285}, {"id": 640122, "hashId": "106aac94-30d0-4d0e-922b-515f03ea9efd", "learningObjectId": 27285, "title": "How Nicotine Works ", "synopsis": "Explains how nicotine works", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640122, "content": "<h1 class=\"font-style--h1\">How Nicotine Works</h1>", "textType": "HEADING"}, "id": "1e39fef1-58b8-4ffc-bccc-e7c0dcdca5d0"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">When nicotine enters the bloodstream — within 10 seconds of a puff — it travels to the brain and binds to nicotinic acetylcholine receptors, triggering a release of dopamine in the brain's reward circuit.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Dopamine is the neurotransmitter most closely associated with pleasure, reward, and motivation. What makes nicotine especially effective at hijacking this system is the speed and reliability with which it delivers the signal. Each puff is a near-instant reward.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">For a brain still developing and particularly sensitive to rewarding stimuli, this is not a minor disruption.</span></p>", "blockId": 640122, "textType": "RichText"}, "id": "70adbdde-488f-4edf-b7d9-82526a7d1463"}, {"component": "IMAGE", "config": {"src": "/resources/Convert to GIF project - June 25, 2026 - 6de650bf.gif", "alt": "Repeating animated  image that show the brain loop reward of how nicotine works on the brain receptor and releases dopamine.", "variant": "square", "blockId": 640122, "caption": {"text": ""}, "mode": "scale"}, "id": "7919f749-2f69-48cf-ae26-51a7fa2af61c"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "2346e856-83c7-4ea5-af0d-e38469f932e9"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 How Nicotine Works - 58a734f6.mp3", "transcript": " "}, "id": "33ac49fd-2e47-402d-b1ae-567f8b714fa5"}], "parentHash": "3bdfa453-775a-4a84-bd2a-b78355fe8e39", "order": 4, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27285}, {"id": 640123, "hashId": "02f69360-d70b-4979-a2ba-ec87a166f5a3", "learningObjectId": 27285, "title": "Tolerance Dependence Withdrawal", "synopsis": "Explains nicotine tolerance, dependence and withdrawal", "templateBlock": false, "sectionId": null, "block": "HOT-SPOT-IMAGE-TEXT-BUTTON-CENTERED", "blockType": "CONTENT-BLOCK", "components": [{"component": "HOT-SPOT-IMAGE-TEXT-BUTTON", "config": {"buttons": [{"heading": {"text": "", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">Tolerance</span></p>", "textType": "RichText"}, "image": {"src": "/resources/CC Chapter 02 Tolerance Butto-1bf5e22c-a - 72f6ee71.png", "alt": "Image showing brain receptors to depict nicotine tolerance.", "variant": "square", "disableZoom": true, "mode": "fill"}, "content": {"heading": {"text": "", "content": "<h1 class=\"font-style--h1\"><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Tolerance</span></h1>", "textType": "RichText"}, "richText": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Tolerance: With repeated exposure, the brain reduces its own receptor sensitivity. The same amount of nicotine that once produced a strong effect now produces a weaker one — more is needed to feel normal. </span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Click the play button on the video to learn more.</span></p>", "textType": "RichText"}, "image": {"src": "", "alt": "", "variant": "square", "caption": {"text": ""}}, "video": {"src": "/resources/Brain Tolerance Video-a3964aab-6c31-44b5 - 1dfd2451.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/CC Chapter 02 Tolerance-US-Andrew-202606 - 94f3864a.mp3", "transcript": {"content": ""}}, "layout": "LAYOUT_LEFT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "mediaType": "VIDEO", "modalSize": "md"}, "isActive": false, "id": "d8b1ac28-a731-4da4-90aa-c388d3505e90", "isModalOpen": false}, {"heading": {"text": "", "content": "<p><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Dependence</span></p>", "textType": "RichText"}, "image": {"src": "/resources/CC Chapter 02 Dependence Butto-d4a3ac08- - 541bc0ff.png", "alt": "Image depicting nicotine dependence in the brain.", "variant": "square", "disableZoom": true, "mode": "fill"}, "content": {"heading": {"text": "", "content": "<h1 class=\"font-style--h1\"><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Dependence</span></h1>", "textType": "RichText"}, "richText": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Dependence: The brain begins treating nicotine as a required input. When levels drop during a long class, a drive, or sleep — the under-stimulated reward circuit generates a craving. </span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Click the play button on the video to learn more.</span></p>", "textType": "RichText"}, "image": {"src": "", "alt": "", "variant": "square", "caption": {"text": ""}}, "video": {"src": "/resources/CC Chapter 02 Nicotine Dependence - 6865a579.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "layout": "LAYOUT_RIGHT", "mediaType": "VIDEO", "modalSize": "md"}, "isActive": false, "id": "9070dd21-1bce-47e6-8ee6-38ad3609cd17", "isModalOpen": false}, {"heading": {"text": "", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">Withdrawal</span></p>", "textType": "RichText"}, "image": {"src": "/resources/CC Chapter 02 Withdrawal Butto-a8f180e7- - 79e9b12d.png", "alt": "Image of a brain with an angry face depicting withdrawal symtoms from nicotine.", "variant": "square", "disableZoom": true, "mode": "fit"}, "content": {"heading": {"text": "", "content": "<h1 class=\"font-style--h1\"><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">Withdrawal</span></h1>", "textType": "RichText"}, "richText": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Withdrawal: When use stops — irritability, anxiety, difficulty concentrating, low mood, restlessness, sleep disturbance, increased appetite. These are expected biological responses, not character flaws.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\"> Click the play button on the video to learn more.</span></p>", "textType": "RichText"}, "image": {"src": "", "alt": "", "variant": "square", "caption": {"text": ""}}, "video": {"src": "/resources/CC Chapter 02 Withdrawal Video-25830f9e- - ed75bf43.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "layout": "LAYOUT_RIGHT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "mediaType": "VIDEO", "modalSize": "md"}, "isActive": false, "id": "840bfeeb-eadc-40a7-aa52-35e1c2496781", "isModalOpen": false}], "blockId": 640123}, "id": "d3f8e201-23fd-4354-b896-033e0c5e1c41"}, {"component": "HEADING", "config": {"text": "", "blockId": 640123, "content": "<h1 class=\"font-style--h1 ql-align-center\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Tolerance, Dependence, Withdrawal</strong></h1>", "textType": "HEADING"}, "id": "655ef275-063f-4db6-9879-4df18a77112c"}, {"component": "RICH-TEXT", "config": {"content": "<p class=\"ql-align-center\"><strong style=\"font-size:1.1875em\">Click each of the boxes below to learn about nicotine tolerance, dependence, and withdrawal.</strong></p>", "blockId": 640123, "textType": "RichText"}, "id": "ecfe35fb-6440-47ad-9af9-c2749b05e367"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "36aeae90-788d-416b-8f31-a7a94be7d04b"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 Nicotine Tolerance - 54d68976.mp3", "transcript": " "}, "id": "3c7966f7-d7c0-4643-94b5-2cc6edaa0332"}], "parentHash": "3bdfa453-775a-4a84-bd2a-b78355fe8e39", "order": 5, "layoutType": null, "alignContent": null, "learningobject_id": 27285}, {"id": 640124, "hashId": "914f4ef0-4cc3-459a-98b5-6946d9fb68d9", "learningObjectId": 27285, "title": "Craving is not a command", "synopsis": "Explains nicotine cravings", "templateBlock": false, "sectionId": null, "block": "TEXT-CENTERED__ONE-ROW-TWO-THIRD", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640124, "content": "<h1 class=\"font-style--h1\"><span style=\"font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">⚠️</span><span style=\"font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918);font-size:1.0625em\">IMPORTANT DISTINCTION﻿</span></h1>", "textType": "HEADING"}, "id": "c31a5508-04a1-4582-ad19-459c10911f9a"}, {"component": "RICH-TEXT", "config": {"content": "<p class=\"font-style--paragraph\"><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\">A craving is not a command. It is a neurological signal that has been learned — and can be unlearned with time and the right support.</span></p><p class=\"font-style--paragraph\"><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\">Every craving that passes without being acted on weakens the conditioned association slightly. Chapter 6 builds on this fact with a practical quit plan.</span></p>", "blockId": 640124, "textType": "RichText"}, "id": "0e2198d2-27f8-4de6-99d6-0b677b82a82d"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "593f7b33-fce2-4e8d-ad44-7a89bd7feb51"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 Craving Not A Command - 82e28479.mp3", "transcript": " "}, "id": "fb72af2e-40dc-4318-accb-667508239ddd"}], "parentHash": "3bdfa453-775a-4a84-bd2a-b78355fe8e39", "order": 6, "layoutType": "ONE-ROW-TWO-THIRD", "alignContent": null, "learningobject_id": 27285}, {"id": 640125, "hashId": "d66eb716-c18c-40db-b992-be839be2fb9e", "learningObjectId": 27285, "title": "The Dependence Loop", "synopsis": "Explains the nicotine dependence loop", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640125, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">The Dependence Loop</strong></h1>", "textType": "HEADING"}, "id": "95a2939d-8655-4110-9fdf-3417e9251b91"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Understanding the full cycle explains how 'I only do it sometimes' becomes 'I vape first thing in the morning.'</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">1. CUE — A familiar trigger activates an expectation of nicotine.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">2. USE — The person vapes. Nicotine reaches the brain in seconds.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">3. BRIEF RELIEF — Dopamine is released. Stress or restlessness lifts.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">4. EXPECTATION DEEPENS — Brain updates: when this cue appears, nicotine follows.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">5. CRAVING IN ABSENCE — When the cue appears and nicotine doesn't follow, withdrawal signals emerge.</span></p>", "blockId": 640125, "textType": "RichText"}, "id": "f4525c60-980d-462d-9205-1e8c70b0b847"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 02 Vaping Addiction - bb555bb4.png", "alt": "Infographic image of the vaping addiction brain loop diagram.  It starts on the upper right side with number 1. cue. Number 2. Use is underneath Cue. Number 3. Brief Relief is underneath Use.  Number 4. Expection Deepens is on the bottom left side and number 5. Craving in Absence is on the upper left side.", "variant": "square", "blockId": 640125, "caption": {"text": ""}, "mode": "fit"}, "id": "a72e5e71-663e-428c-a9f3-b0c6a1cb5f56"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "7d8a8964-6cc8-4028-a82b-db6a4f362945"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 Dependence Loop - f2be4c4c.mp3", "transcript": " "}, "id": "05b4b505-25b6-4602-a714-4266b163a291"}], "parentHash": "3bdfa453-775a-4a84-bd2a-b78355fe8e39", "order": 7, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27285}, {"id": 640126, "hashId": "25eeb3c6-1696-4344-b388-2921e226676b", "learningObjectId": 27285, "title": "Build The Reward Loop", "synopsis": "Put the 5 nicotine dependence steps in the loop in order", "templateBlock": false, "sectionId": null, "block": "REARRANGE-TEXT-CENTERED", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640126, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Build the Reward Loop</strong></h1>", "textType": "HEADING"}, "id": "c871ee7b-f713-4269-8885-b694fee3001e"}, {"component": "TEXT", "config": {"text": "", "blockId": 640126, "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Put the five steps of the nicotine dependence loop in the correct order. [Drag to order]</span></p>", "textType": "RichText"}, "id": "a121977a-8a0a-4d4d-8421-542bf745b7cc"}, {"component": "REARRANGE-DND", "config": {"question": "", "randomize": true, "answers": [{"id": "661a4a12-bc59-45cb-9fbf-cf616cec26c9", "text": "", "correctOrder": 0, "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.0625em\">Cue</span></p>", "textType": "RichText"}, {"id": "answer-4", "text": "", "correctOrder": 1, "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.0625em\">Use nicotine</span></p>", "textType": "RichText"}, {"id": "8cf93f5f-9b21-4294-9ac6-d7889fc06162", "text": "", "correctOrder": 2, "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.0625em\">Brief relief / reward</span></p>", "textType": "RichText"}, {"id": "1c404006-6044-4562-90ed-036e36432702", "text": "", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">Brain expects nicotine again</span></p>", "textType": "RichText", "correctOrder": 3}, {"id": "82f66287-4cb5-4c3b-834c-38a994af7096", "text": "", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.0625em\">Craving when nicotine is missing</span></p>", "textType": "RichText", "correctOrder": 4}], "blockId": 640126}, "id": "db24b330-f7c1-4c9b-969c-9e96d169826b"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Correct.</h1>", "textType": "RichText"}, "content": "<p><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">Exactly. This loop is why dependence builds faster than most people expect.</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect.", "content": "<h1 class=\"font-style--h1\">Incorrect.</h1>", "textType": "RichText"}, "content": "<p><span style=\"color:rgb(255, 255, 255);font-family:Calibri, sans-serif;font-size:1.3125em\">Not quite — try again. Tip: the cue always comes first, the craving comes last.</span></p>", "textType": "RichText"}, "blockId": 640126}, "id": "1387fc33-b35a-41c4-957c-56946f211462"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "be9064d7-eea9-4927-bb38-e991ab03b036"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 Build the Reward Loop - 00570ce7.mp3", "transcript": " "}, "id": "f1b4d58a-3ec0-4830-af14-02070b229783"}], "parentHash": "3bdfa453-775a-4a84-bd2a-b78355fe8e39", "order": 8, "layoutType": "ONE-ROW-HALF", "alignContent": null, "learningobject_id": 27285}, {"id": 640127, "hashId": "90dfb22a-ff08-45d2-a245-e6fa817fd747", "learningObjectId": 27285, "title": "Why Vapes Create Dependence Faster", "synopsis": "Explains why vapes create dependence faster", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640127, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Why Vapes Create Dependence Faster</strong></h1>", "textType": "HEADING"}, "id": "f6764742-7ff3-4915-97d9-602b03490b45"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Not all nicotine delivery systems are equally likely to cause dependence. Speed and concentration of delivery are key variables.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Modern pod devices — especially those using nicotine salt formulations — deliver nicotine to the brain very rapidly and at very high concentrations. Nicotine salts use benzoic acid to lower pH, reducing harshness and allowing concentrations many times higher than a cigarette without the feedback that would otherwise signal high intake.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">A device that tastes like fruit juice can be delivering a highly addictive dose of nicotine — without any of the sensory signals that would normally warn the user.</span></p>", "blockId": 640127, "textType": "RichText"}, "id": "adce7d2d-c515-43bd-b486-afef6b854672"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 02 Vape Flavors-17d4ef7c-d20e - 951e046d.png", "alt": "Image of 2 bottles of benzoic acid with a strawberry, orange slice and an apple around them.", "variant": "square", "blockId": 640127, "caption": {"text": ""}}, "id": "f199fa41-4540-4263-9fd8-c04dfcd68d8a"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "b911f846-5d6f-4a10-980c-2cf834feca76"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 Why Vapes Creates - 40cdd69c.mp3", "transcript": " "}, "id": "27fdf4e3-d602-4460-95c0-8b2021700b3c"}], "parentHash": "3bdfa453-775a-4a84-bd2a-b78355fe8e39", "order": 9, "layoutType": "ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "alignContent": null, "learningobject_id": 27285}, {"id": 640128, "hashId": "09d7bf3a-9c2c-462e-9302-c682a4891e32", "learningObjectId": 27285, "title": "Multi split", "synopsis": null, "templateBlock": false, "sectionId": null, "block": "MENU-BUTTON-ONE-COL", "blockType": "MULTI-SPLIT-BRANCH-MENU", "components": [{"component": "HEADING", "conf
