es 12 - 14", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640130, "content": "<h1 class=\"font-style--h1\"><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">AGES 12–14 PATH:</span></h1>", "textType": "HEADING"}, "id": "6f23edde-303c-459b-8b1d-cdea05ee4509"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Jordan starts vaping at a friend's house — watermelon flavor, feels calming. Two weeks later, Jordan is irritable at school during long classes. One week after that, the first thought on a Saturday morning is about vaping. It's only been three weeks.</span></p>", "blockId": 640130, "textType": "RichText"}, "id": "44cfe1bf-c909-4c71-aced-c3e4e58132cf"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 02 Moody Teenage - 47b8f114.jpeg", "alt": "Spit image of a teenaged boy. On the left side of the image he is leaning against his locker looking angry. On the right side of the image he is sitting on his bed with a book open in his lap and his hand under his chin. He looks like he's thinking.", "variant": "square", "blockId": 640130, "caption": {"text": ""}}, "id": "93bdaba9-8e7a-42a1-9960-a06a1fc70bd5"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "504df13a-fb19-4cd1-bcc1-ad75358af675"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 Ages 12-14 Path Scenario - 8c58460e.mp3", "transcript": " "}, "id": "14eac7f3-84d6-41b9-8eaf-089d85dc321b"}], "parentHash": "b5dcf12e-7319-4784-87f7-652f2ce1799d", "order": 1, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27285}, {"id": 640131, "hashId": "2ac73ef1-f270-4f78-ab96-9a5081a673e9", "learningObjectId": 27285, "title": "[ Ages 15–17 ]", "synopsis": null, "templateBlock": false, "sectionId": null, "block": null, "blockType": "BRANCH-SECTION-BLOCK", "components": null, "parentHash": "09d7bf3a-9c2c-462e-9302-c682a4891e32", "order": 2, "layoutType": null, "alignContent": null, "learningobject_id": 27285}, {"id": 640132, "hashId": "41570639-22ab-4ba2-a701-581109107899", "learningObjectId": 27285, "title": "Ages 15 - 17 Path", "synopsis": "Scenario for ages 15 - 17", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT__ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640132, "content": "<h1 class=\"font-style--h1\"><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">AGES 15–17 PATH:</span></h1>", "textType": "HEADING"}, "id": "2afe3ad7-2dc2-443d-88ef-f225dc882067"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Alex vapes to manage stress before exams. Over one semester, the calming effect feels weaker. Skipping a day produces anxiety that feels like exam stress. Alex hasn't connected these observations to dependence yet.</span></p>", "blockId": 640132, "textType": "RichText"}, "id": "06a5dbe5-0763-476e-8512-954df85c31ca"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter_02 Teen Calmly - 08ccbc2e.jpeg", "alt": "Split image before and after scene of an older male teenager. In the before scene, he is doing his school work stress free after vaping. In the after  scene he is appears stressed while studying after skipping a day of vaping.", "variant": "square", "blockId": 640132, "caption": {"text": ""}, "mode": "scale"}, "id": "f8fd115b-9266-4611-b42f-1bf59c6eca1c"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "fd3f0d09-1b46-4b32-9003-e7f9b2cb8edc"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 Teen Calmly Studying - 035a0e7b.mp3", "transcript": " "}, "id": "b9cad542-ffdc-45b6-b621-bdab8816320a"}], "parentHash": "2ac73ef1-f270-4f78-ab96-9a5081a673e9", "order": 1, "layoutType": "ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "alignContent": null, "learningobject_id": 27285}, {"id": 640133, "hashId": "ca89dc7b-1dbd-44c2-81c9-aef15585f994", "learningObjectId": 27285, "title": "[ Ages 18–25 ]", "synopsis": null, "templateBlock": false, "sectionId": null, "block": null, "blockType": "BRANCH-SECTION-BLOCK", "components": null, "parentHash": "09d7bf3a-9c2c-462e-9302-c682a4891e32", "order": 3, "layoutType": null, "alignContent": null, "learningobject_id": 27285}, {"id": 640134, "hashId": "553a3532-3bb7-4ddb-b823-3c7b4d8b43b0", "learningObjectId": 27285, "title": "Ages 18 - 25 Path", "synopsis": "Scenario for ages 18 - 25", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640134, "content": "<h1 class=\"font-style--h1\"><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">AGES 18–25 PATH:</span></h1>", "textType": "HEADING"}, "id": "ff86f77e-40c4-4239-88dd-6b21b87a93b0"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Sam has used a pod device for 18 months and tried to quit twice — stopping for 2–3 days before returning during a stressful week at work. Sam called both attempts 'failures of willpower.' Understanding the withdrawal timeline changes that framework entirely.</span></p>", "blockId": 640134, "textType": "RichText"}, "id": "63410dd2-4755-457c-8508-7f0e3ff65bcb"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 02 Teen Relaxed - 5946710c.jpeg", "alt": "Split screen image of a young man. The before scene shows him trying to cope after stopping vaping for 2 to 3 days. The after scene show him discouraged after failing to quit.", "variant": "square", "blockId": 640134, "caption": {"text": ""}}, "id": "697c7d27-1050-47ca-b2c3-d132a0d76139"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "a6d9d9a3-cceb-4a19-a10b-474178b62867"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 Teen Relaxed Then - bb293b1a.mp3", "transcript": " "}, "id": "7757719f-c9c5-4f49-b4d1-9da3cf0efb94"}], "parentHash": "ca89dc7b-1dbd-44c2-81c9-aef15585f994", "order": 1, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27285}, {"id": 640135, "hashId": "c3f18d6c-cef2-495f-a30c-d02da4c776b7", "learningObjectId": 27285, "title": "Knowledge Check 2", "synopsis": "Multiple Choice Question", "templateBlock": false, "sectionId": null, "block": "MULTIPLE-CHOICE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640135, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Knowledge Check 2</strong></h1>", "textType": "HEADING"}, "id": "a8461ad3-1b82-4047-9532-6a5bab67866b"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Which statement most accurately describes why nicotine is particularly risky for people under 25?</span></p>", "blockId": 640135, "textType": "RichText"}, "id": "2cf7f00c-3d43-44a5-907c-cc9692619b81"}, {"component": "MULTIPLE-CHOICE", "config": {"randomize": false, "select": 4, "allowMultiple": false, "question": {"text": "", "content": "<p><strong style=\"font-size:1.1875em\">Choose the correct answer.</strong></p>", "textType": "RichText"}, "multipleChoiceType": "default", "answerType": "TEXT", "answers": [{"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": false, "selected": false, "index": 0, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "9dc9796e-bea4-4f2f-b20c-9ed823a6d5d5", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">A. Young people use vapes more heavily than older users, so the dose is higher.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": true, "selected": false, "index": 1, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "c191ef24-a24e-4a51-9cc7-7318c59d2282", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">B. Nicotine can disrupt brain development in regions controlling attention, mood, impulse control, and reward — and that development continues until approximately age 25.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": false, "selected": false, "index": 2, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "7a87c813-1f05-456e-8c9a-1972b68728cd", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">C. The risk is primarily about lung damage, not brain development.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "correct": false, "id": "af5e645b-81b0-4697-aa67-4ac32c5f8ab4", "index": 3, "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">D. Young people are more at risk only if they also use other substances.</span></p>", "textType": "RichText"}], "blockId": 640135}, "id": "71c0cfaa-cd1e-4f5d-a161-d4a888929b3f"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Correct.</h1>", "textType": "RichText"}, "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">Right. The extended brain development window is central to why nicotine risk is different for young people.</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect.", "content": "<h1 class=\"font-style--h1\">Incorrect.</h1>", "textType": "RichText"}, "content": "<p><span style=\"color:rgb(255, 255, 255);font-family:Calibri, sans-serif\">Review the brain development section above before continuing.</span></p>", "textType": "RichText"}, "blockId": 640135}, "id": "7d435256-c88f-44e6-93bf-3e7f09ae2c0f"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "8aaa454b-72bf-4319-b497-a519bbcecccb"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 Knowledge Check 2 - 41358034.mp3", "transcript": " "}, "id": "c4f8ecea-7f9b-46fe-be9a-a240db2e12f9"}], "parentHash": "3bdfa453-775a-4a84-bd2a-b78355fe8e39", "order": 11, "layoutType": null, "alignContent": null, "learningobject_id": 27285}, {"id": 640136, "hashId": "f92ab6ec-d158-434b-bda7-7ca6c9723cd3", "learningObjectId": 27285, "title": "Reflection - Chapter 2", "synopsis": "Chapter 2 reflection questions", "templateBlock": false, "sectionId": null, "block": "TEXT-ENTRY-TEXT-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640136, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Reflection — Chapter 2</strong></h1>", "textType": "HEADING"}, "id": "b2dfabd4-dd7d-4062-aa86-4a410feea365"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">1. What surprised you most about how quickly nicotine dependence can develop?</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">2. Think about the dependence loop. Are there cues in your daily life you can identify — places, emotions, or routines — that are commonly associated with vaping in your environment?</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">3. Knowing that cravings are neurological signals rather than permanent states, how does that change the way you think about quitting or staying vape-free?</span></p>", "blockId": 640136, "textType": "RichText"}, "id": "0d8cfef3-d294-4e15-920b-2bee98222b13"}, {"component": "TEXT-ENTRY", "config": {"question": {"text": "", "content": "<p><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Type your responses below. This is not scored. It will be saved to your account.</strong></p>", "textType": "RichText"}, "placeholder": {"text": "Enter your response here"}, "blockId": 640136}, "id": "927af881-4a6b-48c7-a9f9-3c02793920de"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Thanks.</h1>", "textType": "RichText"}, "content": "<p><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">Your answers are saved to your account and are not graded.</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect."}, "content": {"text": "Incorrect."}}, "blockId": 640136}, "id": "8002fdd3-0a42-4c19-b621-3f0ed574f0b6"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "7564333b-1d69-4e64-9d7a-608122131995"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 Reflection US-Andrew-20260 - 2aba0b40.mp3", "transcript": " "}, "id": "d5a241bd-00a4-4249-b5a6-6882247bfa41"}], "parentHash": "3bdfa453-775a-4a84-bd2a-b78355fe8e39", "order": 12, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27285}, {"id": 640137, "hashId": "669125ba-6f70-4981-bf1b-01d015d4f355", "learningObjectId": 27285, "title": "Chapter 2 Summary", "synopsis": "End of Chapter 2", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "id": "9f2acc25-19a4-436b-9c11-b358a36ba252", "config": {"text": "Summary", "blockId": 631630, "content": "<h1 class=\"font-style--h1\">Good Job!</h1><p class=\"font-style--h1\">Chapter 2...Done.</p>", "textType": "HEADING"}}, {"component": "RICH-TEXT", "id": "c82b49b0-d190-4224-9e90-1616920ff43f", "config": {"content": "<p><strong style=\"font-size:1.1875em\">Next...</strong><strong style=\"font-size:1.1875em;color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif\">CHAPTER 3 — WHAT VAPING DOES TO YOUR BODY</strong></p>", "blockId": 631630, "textType": "RichText"}}, {"component": "IMAGE", "config": {"src": "/resources/CC Travel road to chapter 3(1)-e6436ad6- - fb5e3151.gif", "alt": "Animated image of traveling the course roadmap to the chapter 3 sign.", "variant": "landscape", "caption": "", "mode": "scale", "blockId": 631630}, "id": "f31c6686-fa46-4ce1-8cd8-a424b6e669f1"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "67abcab9-c68e-452e-afbe-56a40afe08e2"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 02 Done US-Andrew-20260625-5e - fd0487b8.mp3", "transcript": " "}, "id": "81f1cb51-2809-47d5-a56f-c5eb72201abc"}], "parentHash": "3bdfa453-775a-4a84-bd2a-b78355fe8e39", "order": 13, "layoutType": "ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "alignContent": null, "learningobject_id": 27285}, {"id": 640428, "hashId": "33ec4ec2-bbaf-49f3-b493-4ce4386cdc39", "learningObjectId": 27299, "title": "Chapter 3: What Vaping Does to Your Body", "synopsis": null, "templateBlock": true, "sectionId": null, "block": null, "blockType": "SECTION-BLOCK", "components": null, "parentHash": "ff628d4b-4648-4d68-bfd5-66031dc71902", "order": 4, "layoutType": null, "alignContent": null, "learningobject_id": 27299}, {"id": 640429, "hashId": "7a944aac-b6d7-4579-9104-045515c18294", "learningObjectId": 27299, "title": "Chapter 3 Introduction ", "synopsis": "Introduction to Chapter 3 - What Vaping Does to Your Body", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640429, "content": "<h2 class=\"font-style--h2\">Chapter 3 - What Vaping Does to Your Body</h2>", "textType": "HEADING"}, "id": "f084bcf8-47b0-4a08-b990-b48b34810d2c"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">This chapter widens the lens from the brain to the full body — and the people around the person who vapes. Some health effects of e-cigarette use are well established. Others are still under investigation. Both categories are presented honestly — because a course that exaggerates invites the correct response of dismissal.</span></p>", "blockId": 640429, "textType": "RichText"}, "id": "b5f4e19e-4098-4447-ac1c-766d57933113"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 03 What Vaping Does to - 61795fdf.jpeg", "alt": "mage showing the brain and organs inside a woman's body. She is surrounded by young adults talking to each other on the right and a young woman jogging on the left.", "variant": "square", "blockId": 640429, "caption": {"text": ""}, "mode": "scale"}, "id": "5f0d2937-181e-49fd-a0f4-74cfdf670d13"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "c4469d5d-1213-4ceb-a7ec-9e24bc79df78"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 03 What Vaping Does to Your - 7170a4c9.mp3", "transcript": " "}, "id": "2be78103-cf08-4154-944c-95186aa68bbe"}], "parentHash": "33ec4ec2-bbaf-49f3-b493-4ce4386cdc39", "order": 1, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27299}, {"id": 640430, "hashId": "912178e2-8e75-4d1d-8aba-3d0eb6b87858", "learningObjectId": 27299, "title": "Immediate and Near-Term Effects", "synopsis": "Explains the effects of vaping on your body", "templateBlock": false, "sectionId": null, "block": "FLIP-CARD-TEXT-LEFT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640430, "content": "<h2 class=\"font-style--h2\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Immediate and Near-Term Effects</strong></h2>", "textType": "HEADING", "textLevel": "block-heading block-heading--root"}, "id": "806e5eb0-18ca-4b48-9420-29aa948e1cf3"}, {"component": "RICH-TEXT", "config": {"content": "<p><strong style=\"font-size:1.1875em\">Click on each box to learn more about:</strong></p><ol><li data-list=\"bullet\"><span></span><strong style=\"font-size:1.1875em\">Respiratory Irritation</strong></li><li data-list=\"bullet\"><span></span><strong style=\"font-size:1.1875em\">Cardiovascular Effects</strong></li><li data-list=\"bullet\"><span></span><strong style=\"font-size:1.1875em\">Attention Disruption</strong></li><li data-list=\"bullet\"><span></span><strong style=\"font-size:1.1875em\">Mood Effects</strong></li></ol>", "blockId": 640430, "textType": "RichText", "textLevel": "block-text"}, "id": "354060ba-e130-4054-aae1-97cb590274c6"}, {"component": "FLIP-CARD", "config": {"cards": [{"front": {"subHeading": {"text": "", "content": "<h3 class=\"font-style--h3\"><span style=\"font-size:1em;color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Respiratory Irritation</span></h3>", "textType": "SUB-HEADING"}, "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">— coughing, wheezing, throat irritation. Research links youth vaping to bronchitic symptoms, shortness of breath, and asthma exacerbation.</span></p>", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square", "caption": {"text": "", "content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "mediaType": "TEXT", "textType": "RichText"}, "back": {"subHeading": {"text": "", "content": ""}, "content": "", "image": {"src": "/resources/CC Chapter 03 Respiratory Irritation - a0abd055.jpeg", "alt": "Image of a young woman coughing and holding a box of tissues to depict dealing with respiratory irritation from vaping. The capton over her head reads, Respiratory Irritation.", "variant": "square", "caption": {"text": "", "content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "mediaType": "IMAGE"}, "complete": false, "flipped": false, "id": "70f01b9b-2dcc-431e-a968-7a89eb1594ea"}, {"front": {"subHeading": {"text": "", "content": "<h3 class=\"font-style--h3\"><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Cardiovascular Effects</span></h3>", "textType": "SUB-HEADING"}, "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">— nicotine raises heart rate and blood pressure within minutes. Meta-analyses find associations with increased cardiovascular events.</span></p>", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square", "caption": {"text": "", "content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "mediaType": "TEXT", "textType": "RichText"}, "back": {"subHeading": {"text": "", "content": ""}, "content": "", "image": {"src": "/resources/CC Chapter 03 Cardiovascular Effects - 9bbd4810.jpeg", "alt": "Image of a young woman with one of her hands to her head and the other one over her heart to depict dealing with cardivascular effects from vaping. The caption over her head reads, Cardiovascular Effects.", "variant": "square", "caption": {"text": "", "content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "mediaType": "IMAGE"}, "complete": false, "flipped": false, "id": "3ddcd86a-50af-487a-a201-a7311a1a5132"}, {"front": {"subHeading": {"text": "", "content": "<h3 class=\"font-style--h3\"><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Attention Disruption </span></h3>", "textType": "SUB-HEADING"}, "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">— periods of difficulty concentrating between uses. Many users perceive this as evidence vaping helps them focus; it is actually temporary relief from withdrawal.</span></p>", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square", "caption": {"text": "", "content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "mediaType": "TEXT", "textType": "RichText"}, "back": {"subHeading": {"text": "", "content": ""}, "content": "", "image": {"src": "/resources/CC Chapter 03 Attention Disruption - 5ff99697.jpeg", "alt": "Image of a young woman looking dazed and confused with words circling her head to depict attention disruption from vaping. The caption over her head reads, Attention Disruption.", "variant": "square", "caption": {"text": "", "content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "mediaType": "IMAGE"}, "complete": false, "flipped": false, "id": "60bf05a7-62aa-47f1-87bc-17eeb116f64b"}, {"front": {"subHeading": {"text": "", "content": "<h3 class=\"font-style--h3\"><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Mood effects </span></h3>", "textType": "SUB-HEADING"}, "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">— nicotine temporarily elevates mood via dopamine, but subsequent drops cause irritability, low mood, and anxiety that compound with dependence.</span></p>", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square", "caption": {"text": "", "content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "mediaType": "TEXT", "textType": "RichText"}, "back": {"subHeading": {"text": "", "content": ""}, "content": "", "image": {"src": "/resources/CC Chapter 03 Mood Effects - f0300b34.jpeg", "alt": "Image of  a woman looking sad. A cloud of thoughts surround her head that depict mood effects from vaping like despair, helplessness, overwhelmed and deep sadness. The caption above her says, Mood Effects.", "variant": "square", "caption": {"text": "", "content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "mediaType": "IMAGE"}, "complete": false, "flipped": false, "id": "227970ba-55a5-48cd-bf58-067ee75aa4ba"}], "blockId": 640430, "alignment": "center", "size": "md"}, "id": "c1527d4f-696e-4a87-8844-03f39354be40"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "96c2b25f-78ca-4e13-8241-430b7f07555b"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 03 Immediate and Long Term - 51e9c1bf.mp3", "transcript": " "}, "id": "35f35665-85ee-419a-9c98-6322d9729619"}], "parentHash": "33ec4ec2-bbaf-49f3-b493-4ce4386cdc39", "order": 2, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27299}, {"id": 640431, "hashId": "55e5687e-325d-4eba-a1c2-5057696c927f", "learningObjectId": 27299, "title": "Lung Health ", "synopsis": "What research shows about lung health and using eCigarettes", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640431, "content": "<h2 class=\"font-style--h2\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Lung Health — What the Research Shows</strong></h2>", "textType": "HEADING"}, "id": "cd926f6a-b3ed-446c-9205-571e0999304e"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">• Youth and young adults who vape have higher rates of chronic cough, bronchitis symptoms, and shortness of breath than non-vapers.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">• E-cigarette aerosol causes airway inflammation and may impair mucociliary clearance — the mechanism the lungs use to sweep out particles and pathogens.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">• In 2019, EVALI (e-cigarette or vaping product use-associated lung injury) resulted in thousands of hospitalizations and dozens of deaths. Primary culprit: vitamin E acetate in illicit THC cartridges — demonstrating that inhaled aerosol can cause sudden, life-threatening lung damage.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">• Long-term cancer risk is not yet fully characterized — not because risks are low, but because e-cigarettes have only existed at population scale for ~15 years.</span></p>", "blockId": 640431, "textType": "RichText"}, "id": "0517f899-cb0e-4436-8776-54bca01a90e4"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 03 Lung Health What - c40d673c.jpeg", "alt": "Infographic of a teenaged boy bending over coughing to depict how e-cigarette or vaping product use effect the lungs. The infographic shows  an icon of a hospital and the number of hospital cases, an icon of a tombstone and the number of deaths reported and an icon of a chain link and the link to vaping and e-cigs.", "variant": "square", "blockId": 640431, "caption": {"text": ""}}, "id": "1ae9fe18-2dd4-4dd7-a6bf-43ee1be5777e"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "a0fda198-e338-4da9-8e23-2814a5f7e20b"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 03 Lung Health What - 5d3ff875.mp3", "transcript": " "}, "id": "8d8bcb0d-c70c-4ed5-ade2-ec7f3f912ca3"}], "parentHash": "33ec4ec2-bbaf-49f3-b493-4ce4386cdc39", "order": 3, "layoutType": "ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "alignContent": null, "learningobject_id": 27299}, {"id": 640432, "hashId": "b7ab3d73-3f22-4043-9da2-880f49aa034f", "learningObjectId": 27299, "title": "Secondhand Aerosol", "synopsis": "What secondhand aersol does ", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640432, "content": "<h2 class=\"font-style--h2\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Secondhand Aerosol</strong></h2>", "textType": "HEADING"}, "id": "2a021384-f75d-40d7-b54d-a35e0ed3d061"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">When a person vapes in a shared space, the aerosol they exhale disperses into the surrounding air. People nearby breathe it in.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Secondhand e-cigarette aerosol contains nicotine, fine particles, and the same compounds present in the primary exhaled stream.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">• Research has detected elevated nicotine on surfaces in rooms where people have vaped.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">• Studies find elevated cotinine (nicotine metabolite) in nonsmokers exposed to secondhand aerosol.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">• Vaping in a closed car, shared bedroom, or home with small children creates meaningful exposure for others — without their consent.</span></p>", "blockId": 640432, "textType": "RichText"}, "id": "5466614d-8199-4d77-9d42-5dce910a1741"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 03 Girl in Backseat with - a363912a.gif", "alt": "Animated image of a girl in back seat of a car rolling down the window trying to let the smoke out.", "variant": "square", "blockId": 640432, "caption": {"text": ""}, "mode": "scale"}, "id": "14094df1-6539-4f1a-a355-17b51ad84881"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "e701a3e0-3071-4b5e-b108-b955f8e45250"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 03 Secondhand Aerosol - bceab643.mp3", "transcript": " "}, "id": "153ed062-ccea-408f-9524-bbfab59891c6"}], "parentHash": "33ec4ec2-bbaf-49f3-b493-4ce4386cdc39", "order": 4, "layoutType": "ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "alignContent": null, "learningobject_id": 27299}, {"id": 640433, "hashId": "b88ff7c2-cac4-4f4e-9947-f1e4532a04e5", "learningObjectId": 27299, "title": "18-25 Note", "synopsis": "Explains how vaping harms others without their permission", "templateBlock": false, "sectionId": null, "block": "TEXT-CENTERED", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640433, "content": "<h1 class=\"ql-align-center font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\">📝Ages 18–25 Note</strong></h1>", "textType": "HEADING"}, "id": "b863ab84-cd00-4857-be6a-0e2997876b39"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">If you vape and share housing, a vehicle, or a workspace with others who have chosen not to use nicotine, they are being exposed to aerosol without their consent when you vape in shared spaces. This is worth considering regardless of any legal question about your right to vape in a given location.</span></p>", "blockId": 640433, "textType": "RichText"}, "id": "9451b13f-2c79-422b-8bba-57fd803d2fda"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "70322b74-3c25-49be-98a6-346d660cc94c"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 03 18-25 Note US-Andrew-20260 - 903d4d09.mp3", "transcript": " "}, "id": "850b6c46-620d-4e40-94c2-ef7556a4728b"}], "parentHash": "33ec4ec2-bbaf-49f3-b493-4ce4386cdc39", "order": 5, "layoutType": null, "alignContent": null, "learningobject_id": 27299}, {"id": 640434, "hashId": "a875eec4-89eb-42a4-84f3-d1bf49d3881c", "learningObjectId": 27299, "title": "Nicotine Poisoning", "synopsis": "Explains the danger of liquid nicotine around children", "templateBlock": false, "sectionId": null, "block": "VIDEO-ONLY__ONE-ROW-TWO-THIRD", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640434, "content": "<h1 class=\"ql-align-center font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Nicotine Poisoning</strong></h1>", "textType": "HEADING"}, "id": "1b164a74-99a7-4b04-a924-f36055958700"}, {"component": "RICH-TEXT", "config": {"content": "<p class=\"ql-align-center\"><strong style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Exposure?</strong><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\"> </span><strong style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Call Poison Help: 1-800-222-1222.</strong><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">﻿</span></p>", "blockId": 640434, "textType": "RichText"}, "id": "9d988d61-e30b-4dc9-9140-4d8a7e32c331"}, {"component": "VIDEO", "config": {"src": "/resources/CC Chapter 03 Nicotine Poisoning-19dde38 - bf10acee.mp4", "trackUrl": "/resources/2019-11-26T00-19-23.925Z-siren.vtt", "posterUrl": "", "blockId": 640434, "showTranscriptButton": false, "transcript": {"content": "<p><br /></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Liquid nicotine — the e-liquid inside pods, cartridges, and refillable tanks — is toxic if swallowed, absorbed through skin, or splashed in the eyes. It is especially dangerous for young children, whose smaller body mass means even a small exposure can cause serious illness or death.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">If e-liquid is accessible in a home where small children are present, proper storage in child-resistant containers out of reach is essential.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Exposure? Call Poison Help: 1-800-222-1222.</span></p>", "textType": "RichText"}}, "id": "bb81cd6a-c034-48e3-9b15-e44de8f7dee5"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "0c37a9fc-179b-4ed7-a927-13287718ee4c"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "", "transcript": " "}, "id": "0025fd7d-913b-4590-9196-114915257043"}], "parentHash": "33ec4ec2-bbaf-49f3-b493-4ce4386cdc39", "order": 6, "layoutType": "ONE-ROW-TWO-THIRD", "alignContent": null, "learningobject_id": 27299}, {"id": 640435, "hashId": "79b8a507-6f8e-4ef4-b132-787ebe22ea93", "learningObjectId": 27299, "title": "E-Cigarette Explosion and Injury Risks", "synopsis": "Explains the explosion and injury risk of e-cigarettes", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640435, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Battery and Device Injury</strong></h1>", "textType": "HEADING"}, "id": "c1e45901-dbef-4413-b20b-71dc7aef2d38"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">E-cigarettes are battery-powered, and a real proportion have malfunctioned in ways that caused serious physical harm. Thermal runaway — the battery rapidly overheating — has resulted in fires and explosions injuring users and bystanders.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Published case reports document burns, tooth damage, jaw fractures, and eye injuries. Devices with damaged batteries or stored near flammable materials carry elevated risk.</span></p>", "blockId": 640435, "textType": "RichText"}, "id": "56413dc4-8b73-4bae-a512-14f59f424dcf"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 03 e-Cigarette Explosion - 08df685d.jpeg", "alt": "Infographic showing a warning about how e-cigarettes can explode and cause serious injury. ", "variant": "square", "blockId": 640435, "caption": {"text": ""}}, "id": "682808e3-a36f-4877-b968-f4ca542d9bce"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "a13b5772-04f5-43da-815a-2d19aeb3e357"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 03 Battery and Device - 4e9d96b8.mp3", "transcript": " "}, "id": "06273542-d557-4266-a5e2-653b533f56f5"}], "parentHash": "33ec4ec2-bbaf-49f3-b493-4ce4386cdc39", "order": 7, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27299}, {"id": 640436, "hashId": "878cd098-032c-41cb-9d22-93f2a60580cd", "learningObjectId": 27299, "title": "Special Situations", "synopsis": "Information provided on nicotine and preganacy, asthma and respiratory conditions, dual use and athletics", "templateBlock": false, "sectionId": null, "block": "ACCORDION-CENTERED__ONE-ROW-HALF", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640436, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Special Situations</strong></h1>", "textType": "HEADING"}, "id": "e7f24b6b-346d-4ff7-b5ce-466f8c679ffa"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em\">Click each of the tabs below to find out more information.</span></p>", "blockId": 640436, "textType": "RichText"}, "id": "c7a13d4d-2801-4969-83d1-27b482c9917b"}, {"component": "ACCORDION", "config": {"accordionType": "TEXT", "frames": [{"order": 0, "heading": {"text": "", "content": "<p><strong style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Pregnancy</strong></p>", "textType": "RichText"}, "text": {"content": "<p><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Nicotine is harmful to fetal development at any stage. Reduces blood flow to fetus, impairs lung development, increases risk of premature birth and low birth weight. E-cigarettes should not be used during pregnancy (CDC).</span></p>", "textType": "RichText"}, "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "show": false, "done": false, "id": "f3ba0741-3b27-4a6b-a408-5a4af3105223"}, {"order": 1, "heading": {"text": "", "content": "<p><strong style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Asthma / respiratory conditions</strong></p>", "textType": "RichText"}, "text": {"content": "<p><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Aerosol inhalation can trigger asthma attacks and worsen underlying airway inflammation.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "show": false, "done": false, "id": "d8a4c1c1-be71-46cd-b875-ec5e1826647f"}, {"order": 0, "heading": {"text": "", "content": "<p><strong style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Dual use</strong></p>", "textType": "RichText"}, "text": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">Using e-cigarettes and smoking cigarettes simultaneously. Research finds dual use does not reduce harm compared to smoking alone and may increase total toxin exposure.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "placeholder image", "variant": "square"}, "id": "266dc2db-370f-4310-bed1-b07852329f98", "show": false}, {"order": 0, "heading": {"text": "", "content": "<p><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.3125em\">Athletics</strong></p>", "textType": "RichText"}, "text": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\"> Reduced lung capacity, airway inflammation, and cardiovascular stress from nicotine directly impair physical performance and recovery.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "placeholder image", "variant": "square"}, "id": "739d46b2-be63-4738-b37e-63c9fbc17df4", "show": false}], "blockId": 640436}, "id": "989b493c-d168-4003-979a-8f95082dbfeb"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "layout": "FULL_PAGE", "isActive": true, "color": "#FFFFFF", "opacity": 100}, "id": "cfa648ce-2e0c-4aa3-ad83-bd589465c286"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 03 Special Situations - 9c685807.mp3", "transcript": " "}, "id": "fe46f561-d1cd-4644-9482-215a8f825ff1"}], "parentHash": "33ec4ec2-bbaf-49f3-b493-4ce4386cdc39", "order": 8, "layoutType": "ONE-ROW-HALF", "alignContent": null, "learningobject_id": 27299}, {"id": 640437, "hashId": "976df3c5-6750-4dde-a59e-8d85bf93c6b7", "learningObjectId": 27299, "title": "Key Facts", "synopsis": "Key facts from chapter 3", "templateBlock": false, "sectionId": null, "block": "TEXT-CENTERED__ONE-ROW-TWO-THIRD", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640437, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.0625em\">🔑Key Facts</strong><strong style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif\"> </strong></h1>", "textType": "HEADING"}, "id": "6566fea4-e4bc-46c8-bfe0-8de26c0ccf3b"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">• Youth vapers have higher rates of cough, wheezing, and bronchitis than non-vapers.</span></p><p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">• Secondhand aerosol contains nicotine and fine particles that affect bystanders.</span></p><p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">• E-liquid is toxic if swallowed — especially dangerous for young children.</span></p><p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">• Nicotine is harmful to fetal development and should not be used during pregnancy.</span></p><p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">• Dual use — smoking and vaping simultaneously — does not protect health.</span></p><p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">• Battery malfunction in some devices has caused fires and serious injuries.</span></p>", "blockId": 640437, "textType": "RichText"}, "id": "97e31667-3ec8-48cd-9704-52c41f7e9e5e"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "bea5d15e-6f46-4093-ab67-81a1e38c51ff"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 03 Key Facts US-Andrew-202607 - 26b1f04a.mp3", "transcript": " "}, "id": "d176feab-9e26-4233-9e5e-4ad40ade08e8"}], "parentHash": "33ec4ec2-bbaf-49f3-b493-4ce4386cdc39", "order": 9, "layoutType": "ONE-ROW-TWO-THIRD", "alignContent": null, "learningobject_id": 27299}, {"id": 640438, "hashId": "4281285e-00a0-49e1-8ff0-975bba6ee88e", "learningObjectId": 27299, "title": "Knowledge Check - 3", "synopsis": "Multiple choice question", "templateBlock": false, "sectionId": null, "block": "MULTIPLE-CHOICE-RIGHT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640438, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Knowledge Check 3</strong></h1>", "textType": "HEADING"}, "id": "7de886cd-2890-4555-9638-e127cd1a5cfc"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Select ALL statements that are accurate about e-cigarette aerosol and exposure.</span></p>", "blockId": 640438, "textType": "RichText"}, "id": "5c415eea-9daa-4137-b39a-cc182a339aef"}, {"component": "MULTIPLE-CHOICE", "config": {"randomize": false, "select": 4, "allowMultiple": false, "question": {"text": "", "content": "<p><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.0625em\">Choose the correct answers.</strong></p>", "textType": "RichText"}, "multipleChoiceType": "default", "answerType": "TEXT", "answers": [{"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": true, "selected": false, "index": 0, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "48e091a4-eec4-4e34-a648-694a872dd8d4", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.0625em\">A. E-cigarette aerosol can affect people nearby who are not vaping.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": true, "selected": false, "index": 1, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "3d86ae62-f690-4bc9-8b1b-8fae0a82383f", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.0625em\">B. E-liquid exposure can cause nicotine poisoning, especially in young children.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": false, "selected": false, "index": 2, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "e591385d-a708-4a9a-af5a-d99a9a19ab21", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.0625em\">C. Battery fires are impossible in well-maintained devices.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "correct": false, "id": "2e741330-600b-4bd0-b480-1d81816c4e15", "index": 3, "content": "<p><span style=\"font-size:1.0625em;color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">D. Dual use reduces health risk compared to smoking alone.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "correct": true, "id": "03d38dbd-5b94-435c-b758-84c9db67c5a4", "index": 4, "content": "<p><span style=\"font-size:1.0625em;color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">E. Aerosol is not harmless — it can contain harmful and potentially harmful substances.</span></p>", "textType": "RichText"}], "blockId": 640438}, "id": "2f29baac-bfba-43bf-8976-626aea3e61ec"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Correct.</h1>", "textType": "RichText"}, "content": "<p><strong style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(46, 125, 50)\"> </strong><strong style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">Correct: A, B, E</strong></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">→ C is incorrect: battery fires have been documented.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">→ D is incorrect: dual use does not reduce risk.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">'Well done. Aerosol affects bystanders, e-liquid is toxic, and aerosol is not harmless.'</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect.", "content": "<h1 class=\"font-style--h1\">Incorrect.</h1>", "textType": "RichText"}, "content": "<p><span style=\"color:rgb(255, 255, 255);font-family:Calibri, sans-serif;font-size:1.1875em\"> 'Review the health harms and exposure sections above.'</span></p>", "textType": "RichText"}, "blockId": 640438}, "id": "2d847b0c-aa87-4d46-995c-8ffdbd69e782"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "e2497b57-1121-4534-acbb-7077c8fd0319"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 03 Knowledge Check - cfd0443b.mp3", "transcript": " "}, "id": "71abbc5b-1efc-4a82-89b2-f5ece4a44211"}], "parentHash": "33ec4ec2-bbaf-49f3-b493-4ce4386cdc39", "order": 10, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27299}, {"id": 640439, "hashId": "15f78e14-dc85-440e-a98d-e8c975dc1dd0", "learningObjectId": 27299, "title": "Reflection", "synopsis": "Chapter 3 Reflection", "templateBlock": false, "sectionId": null, "block": "TEXT-ENTRY-TEXT-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640439, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Reflection — Chapter 3</strong></h1>", "textType": "HEADING"}, "id": "99ecf028-44c1-4746-8d52-90f7bba847a1"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">1. Which health effect described in this chapter was most surprising to you? Why?</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">2. How does the secondhand aerosol question change the way you think about vaping in shared spaces?</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">3. If a friend said 'I'll quit before it actually hurts me,' how would you respond based on what you've read here?</span></p>", "blockId": 640439, "textType": "RichText"}, "id": "aa9b1c2c-055e-4391-9332-33e6ac1eee41"}, {"component": "TEXT-ENTRY", "config": {"question": {"text": "", "content": "<p><strong style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Type your responses below. This is not scored. It will be saved to your account.</strong></p>", "textType": "RichText"}, "placeholder": {"text": "Enter your response here"}, "blockId": 640439}, "id": "35d8fa1e-0745-43ee-8e1b-1b2d91bf87b3"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Thanks.</h1>", "textType": "RichText"}, "content": "<p><span style=\"color:rgb(255, 255, 255);font-family:Calibri, sans-serif;font-size:1.0625em\">Your answers are saved to your account and are not graded.</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect."}, "content": {"text": "Incorrect."}}, "blockId": 640439}, "id": "4be5fd23-6231-4bee-8608-3b43fd1cf7f1"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "be3f64cd-d0fe-4ccf-8e37-c75a27697d65"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 03 Reflection US-Andrew-20260 - fb070cab.mp3", "transcript": " "}, "id": "ffa65579-0c86-41ae-b454-6658cba971d6"}], "parentHash": "33ec4ec2-bbaf-49f3-b493-4ce4386cdc39", "order": 11, "layoutType": null, "alignContent": null, "learningobject_id": 27299}, {"id": 640440, "hashId": "21cd42f9-e2db-467c-94e1-807a95074d2d", "learningObjectId": 27299, "title": "Chapter 3 Summary", "synopsis": "End of Chapter 3", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "id": "9f2acc25-19a4-436b-9c11-b358a36ba252", "config": {"text": "Summary", "blockId": 633648, "content": "<h1 class=\"font-style--h1\">Great Job!</h1><p class=\"font-style--h1\">Chapter 3 Done.</p>", "textType": "HEADING"}}, {"component": "RICH-TEXT", "id": "c82b49b0-d190-4224-9e90-1616920ff43f", "config": {"content": "<p><strong style=\"font-size:1.1875em\">Up Next...Chapter 4 - Marketing, Flavors, and Social Pressure</strong></p>", "blockId": 633648, "textType": "RichText"}}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 3 Travel Path to Chapter 4 - 00a5b79c.gif", "alt": "Animated image showing traveling the course roadmap to the next chapter: Chapter 4 Marketing, Flavors, and Social Pressure.", "variant": "landscape", "caption": "", "mode": "scale", "blockId": 633648}, "id": "f31c6686-fa46-4ce1-8cd8-a424b6e669f1"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "67abcab9-c68e-452e-afbe-56a40afe08e2"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 03 Done US-Andrew-2026070-b1c - ff83ff08.mp3", "transcript": " "}, "id": "81f1cb51-2809-47d5-a56f-c5eb72201abc"}], "parentHash": "33ec4ec2-bbaf-49f3-b493-4ce4386cdc39", "order": 12, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27299}, {"id": 640444, "hashId": "02eefa08-c5f8-4560-8c1e-0a2bbbdd4cf1", "learningObjectId": 27300, "title": "Chapter 4: The Pull — Marketing, Flavors, and Social Pressure", "synopsis": null, "templateBlock": true, "sectionId": null, "block": null, "blockType": "SECTION-BLOCK", "components": null, "parentHash": "ff628d4b-4648-4d68-bfd5-66031dc71902", "order": 5, "layoutType": null, "alignContent": null, "learningobject_id": 27300}, {"id": 640445, "hashId": "a021730a-62a9-4645-840d-7027748b2e43", "learningObjectId": 27300, "title": "Chapter 4 Introduction", "synopsis": "Introduction to Chapter 4 - The Pull; Marketing, Flavors, and Social Pressure.", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640445, "content": "<h2 class=\"font-style--h2\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Chapter 4 - The Pull: Marketing, Flavors, and Social Pressure</strong></h2>", "textType": "HEADING", "textLevel": "block-heading block-heading--root"}, "id": "07f5da32-3bd6-4f62-a686-87658103abbd"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">Understanding why nicotine is harmful is only part of the picture. Understanding why people use it anyway — and why the barrier to starting has been systematically lowered for young people — is equally important.</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">The tobacco and e-cigarette industry has spent decades and billions of dollars studying human psychology. This chapter covers what they learned and how they used it.</span></p>", "blockId": 640445, "textType": "RichText", "textLevel": "block-text"}, "id": "50642ea5-80f4-46c1-9f4e-ae6071da2a2b"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 04 Teen Influences Cartoon-f1f6cda1-61d8-44f1-89a0-1e9c96adb8a0.jpeg", "alt": "Image of a teenaged boy standing looking at a phone above him to the right is an image of a cell phone with social media icons surrounding it. ", "variant": "square", "blockId": 640445, "caption": {"text": ""}, "mode": "scale", "isBlockImage": true}, "id": "0026c017-fbbd-4253-9663-b7ff5d381e39"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "0d1e3752-d259-4588-91d7-5ef84f8c3ff2"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 04 Marketing Flavors and Social Pressure Andrew-39fd4a17-68c7-41ef-aad8-52fe91a46dd1.mp3", "transcript": " "}, "id": "6629ffde-3dd1-491a-bd02-19bb863f56e6"}], "parentHash": "02eefa08-c5f8-4560-8c1e-0a2bbbdd4cf1", "order": 1, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27300}, {"id": 640446, "hashId": "c795eb9e-de8d-4708-a697-bfc0d474c04e", "learningObjectId": 27300, "title": "Flavors: Appeal is not Safety", "synopsis": "Explains why e-cigarette flavors are not safe", "templateBlock": false, "sectionId": null, "block": "FEATURE-TEXT-IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640446, "content": "<h2 class=\"ql-align-center font-style--h2\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Flavors: Appeal Is Not Safety</strong></h2>", "textType": "HEADING", "textLevel": "block-heading block-heading--root"}, "id": "84cae3e1-7213-4646-83b1-270f03e47346"}, {"component": "FEATURE-TEXT", "config": {"text": "", "blockId": 640446, "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Flavored e-cigarette products are not an accidental feature of the market. They are a deliberate strategy. Internal industry documents obtained through litigation reveal sustained attention to flavor as a mechanism for attracting new users who would not tolerate the harshness of tobacco.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">87.6% of current youth e-cigarette users used flavored products (FDA 2024 NYTS). When jurisdictions have banned flavored e-cigarette sales, youth vaping in those areas has declined.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">The central lesson: the name of a flavor tells you nothing about the safety of a product. Flavor is a marketing tool. Not a safety signal.</span></p>", "textType": "RichText"}, "id": "2208c889-366e-4ebe-a76a-859fc330f910"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 04 Cloud of Flavors-d1267442-b887-40c0-8e3e-beffe4e4002b.png", "alt": "Image of a word cloud with different fruit flavored words in it.", "variant": "square", "blockId": 640446, "caption": {"text": ""}, "mode": "scale", "isBlockImage": true}, "id": "47440351-7551-49d4-8d4a-5186c538e755"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "e6a99db9-5c86-4f31-83e8-670deaa83182"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 04 Flavors Appeal is Not Safety Andrew-079d78d6-4862-4315-aa08-ce0be957e7aa.mp3", "transcript": " "}, "id": "022facd0-4643-48b5-851b-2b3b691b1718"}], "parentHash": "02eefa08-c5f8-4560-8c1e-0a2bbbdd4cf1", "order": 2, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27300}, {"id": 640447, "hashId": "25d48ef0-08a9-4bbd-b2c9-ba89c2b46f3c", "learningObjectId": 27300, "title": "The Candy Packaging Problem", "synopsis": "Warning against candy packaging of e-liquids", "templateBlock": false, "sectionId": null, "block": "TEXT-CENTERED__ONE-ROW-TWO-THIRD", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640447, "content": "<h2 class=\"font-style--h2\"><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.0625em\">🍭THE CANDY PACKAGING PROBLEM</span></h2>", "textType": "HEADING", "textLevel": "block-heading block-heading--root"}, "id": "366952a1-1012-4ad7-a869-cca4ef483669"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">Federal regulators have taken enforcement action against companies that packaged e-liquids to look exactly like children's juice boxes, candy wrappers, and cookie packaging. These were not mistakes. They were deliberate design decisions to make a nicotine product look familiar and non-threatening to young buyers.</span></p><p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">The FTC and FDA both took action against these companies, but the underlying strategy — make nicotine products look harmless and appealing — did not end.</span></p>", "blockId": 640447, "textType": "RichText", "textLevel": "block-text"}, "id": "28c54216-fe63-4061-8c24-7daede0ee0b6"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "0cf93601-de95-4c0b-a510-2e3965a003e1"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 04 The Candy Packaging Problem Andrew-1c88a24f-4388-4881-89a0-22d702072707.mp3", "transcript": " "}, "id": "b6345093-9d0d-4989-a56a-df1621abc786"}], "parentHash": "02eefa08-c5f8-4560-8c1e-0a2bbbdd4cf1", "order": 3, "layoutType": "ONE-ROW-TWO-THIRD", "alignContent": null, "learningobject_id": 27300}, {"id": 640448, "hashId": "08581f53-28f0-46c3-8191-3a947a0fb4ab", "learningObjectId": 27300, "title": "How Marketing Creates Illusion of Normalcy                              Normacy", "synopsis": "Explains how marketing glamorizes vaping to young people", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640448, "content": "<h2 class=\"font-style--h2\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">How Marketing Creates the Illusion of Normalcy</strong></h2>", "textType": "HEADING", "textLevel": "block-heading block-heading--root"}, "id": "2f593fe8-3174-4178-9a71-24ac0a2d78a8"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">E-cigarette companies and the influencers they funded — sometimes transparently, sometimes not — populated social media platforms frequented by young people with content featuring attractive young adults using vapes in appealing settings: parties, concerts, outdoor adventures, creative spaces.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Products were presented as accessories to a desirable lifestyle, with no mention of nicotine, addiction, or health effects.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">In 2021, more than 75% of U.S. middle and high school students reported seeing tobacco or e-cigarette marketing in the past 30 days. That exposure is independently associated with increased likelihood of trying e-cigarettes.</span></p>", "blockId": 640448, "textType": "RichText", "textLevel": "block-text"}, "id": "a81a213f-adfd-425b-8c3b-c4e8ef78dd0b"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 04 Teens Vaping Illustration Cartoon-ced6aac4-1aa1-472e-95b9-b9e20b93ef7f.jpeg", "alt": "4 grid image of illustrations of teens holding vape devices. In the top left 4 teens are sitting around a campfire. In the top right  3 teens are standing together with a social event going on in the background. The bottom left shows 2 teen girs sitting in front of the mountains with the sun going down. The bottom right shows a teenaged boy sitting on the sofa in a living room.", "variant": "square", "blockId": 640448, "caption": {"text": ""}, "isBlockImage": true}, "id": "4527d33a-fad0-428e-b36c-44f54267135e"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "be00082f-2d57-4858-a293-985a6c6764a1"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 04 How Marketing Creates Illusion Andrew-fe398ef4-8434-40ec-89b3-149566f86ba3.mp3", "transcript": " "}, "id": "98f926f8-074f-4df4-bee6-ffc86b363602"}], "parentHash": "02eefa08-c5f8-4560-8c1e-0a2bbbdd4cf1", "order": 4, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27300}, {"id": 640449, "hashId": "6e6d66dd-1447-4e07-b00f-95ff3bae3683", "learningObjectId": 27300, "title": "The Peer Dimension", "synopsis": "Explains how to say no to peer pressure", "templateBlock": false, "sectionId": null, "block": "HOT-SPOT-TEXT-BUTTON-IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HOT-SPOT-TEXT-BUTTON", "config": {"buttons": [{"heading": {"text": "", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">1. Accurate norms </span></p>", "textType": "RichText"}, "content": {"heading": {"text": "", "content": "<h1 class=\"font-style--h1\"><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Accurate norms </span></h1>", "textType": "RichText"}, "richText": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\"> Most young people do NOT vape. 94% of U.S. students do not currently vape. The 'everyone does it' belief is factually wrong.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/CC Chapter 04 94 Percent of Teens Don't Vape Cartoon-2598dd34-b233-4ad2-aab8-86f41b63ddc6.jpeg", "alt": "Image of 4 teens positively displaying that 94% of  young people do not vape.", "variant": "square", "caption": {"text": ""}, "position": "Top", "mode": "fill"}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "layout": "LAYOUT_LEFT", "mediaType": "IMAGE", "modalSize": "md"}, "isActive": false, "id": "60bf53ca-211d-4949-b656-fd6acbf30e90", "isModalOpen": false}, {"heading": {"text": "", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">2. A pre-decided position </span></p>", "textType": "RichText"}, "content": {"heading": {"text": "", "content": "<h1 class=\"font-style--h1\"><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">A pre-decided position </span></h1>", "textType": "RichText"}, "richText": {"content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\"> People who've thought through their answer in advance hold it better under social pressure than those deciding in the moment.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/CC Chapter 04 Decision Infographic Cartoon-4c8a6998-ab39-4ef2-b294-27a8f11dae59.jpeg", "alt": "Infographic showing two teens, one boy and one girl with the message that thinking ahead makes you stronger under pressure.", "variant": "square", "caption": {"text": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "layout": "LAYOUT_LEFT", "mediaType": "IMAGE", "modalSize": "md"}, "isActive": false, "id": "22f0702e-3cac-493d-ad36-f3a3fe866fcb", "isModalOpen": false}, {"heading": {"text": "", "content": "<p><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">3. A comfortable way to decline </span></p>", "textType": "RichText"}, "content": {"heading": {"text": "", "content": "<h1 class=\"font-style--h1\"><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\"> A comfortable way to decline </span></h1>", "textType": "RichText"}, "richText": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">— not an invitation to debate, just a phrase that ends the offer.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/CC Chapter 04 Say No to Peer Pressure Cartoon-d1f25948-2a54-4d29-8f5d-4e0f9d017cb9.jpeg", "alt": "Four grid image with a teen in each grid showing assertive ways to say no to vaping.", "variant": "square", "caption": {"text": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "layout": "LAYOUT_LEFT", "mediaType": "IMAGE", "modalSize": "md"}, "isActive": false, "id": "9845d2bb-f704-40e4-8148-f7636e0d05b3", "isModalOpen": false}], "blockId": 640449}, "id": "982e76ac-9f51-4939-96b6-c5f37c673409"}, {"component": "HEADING", "config": {"text": "", "blockId": 640449, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">The Peer Dimension</strong></h1>", "textType": "HEADING", "textLevel": "block-heading block-heading--root"}, "id": "750167a1-5a89-4cac-8b79-42c57faecc64"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Peer pressure rarely arrives as an explicit command. It's a social calculation: what does it cost me to decline, and what do I gain by accepting? Three things reliably reduce its power, click each one below to learn more.</span></p>", "blockId": 640449, "textType": "RichText", "textLevel": "block-text"}, "id": "672a873c-c56a-48f5-8133-a697044e1e9f"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 04 Assertive Ways to Say No Cartoon-f7bc36f0-c230-4742-814f-16e81be03674.jpeg", "alt": "Image of 4 teens showing assertive ways to say no to vaping. ", "variant": "square", "blockId": 640449, "caption": {"text": ""}, "isBlockImage": true}, "id": "7d3def84-f8f5-4b57-b486-e6b4d44aa8e6"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "8d8cafeb-019b-486a-9269-b06fdd49f56a"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 04 The Peer Dimension Andrew-4057db94-59f2-41b3-838b-fa08fea833f5.mp3", "transcript": " "}, "id": "836bf1d0-6aed-4674-9d1c-d2942202003b"}], "parentHash": "02eefa08-c5f8-4560-8c1e-0a2bbbdd4cf1", "order": 5, "layoutType": null, "alignContent": null, "learningobject_id": 27300}, {"id": 640450, "hashId": "607c1d47-7f95-44db-bdf1-801cf9bb9280", "learningObjectId": 27300, "title": "Refusal Skills Toolkit", "synopsis": "Gives 5 ways to refuse", "templateBlock": false, "sectionId": null, "block": "ACCORDION-CENTERED__ONE-ROW-HALF", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640450, "content": "<h2 class=\"font-style--h2\"><strong style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Refusal Skills Toolkit</strong></h2>", "textType": "HEADING", "textLevel": "block-heading block-heading--root"}, "id": "7da292e2-30e7-43a4-b359-494ba2584960"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Five approaches — choose what fits you.</span></p>", "blockId": 640450, "textType": "RichText", "textLevel": "block-text"}, "id": "52dc4f55-b43f-42da-bf8d-6252014f3931"}, {"component": "ACCORDION", "config": {"accordionType": "TEXT", "frames": [{"order": 0, "heading": {"text": "", "content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\"> DIRECT</span></p>", "textType": "RichText"}, "text": {"content": "<p><span style=\"font-size:1.1875em;color:rgb(34, 34, 34);font-family:Calibri, sans-serif\"> 'No thanks, I'm good.' Brief, confident, not an invitation to negotiate.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "show": false, "done": false, "id": "a689a4d3-68b1-4e54-963b-fadef1e34e99"}, {"order": 1, "heading": {"text": "", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\"> </span><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">REASON-BASED</span></p>", "textType": "RichText"}, "text": {"content": "<p><span style=\"font-size:1.1875em;color:rgb(34, 34, 34);font-family:Calibri, sans-serif\"> 'I don't want to mess up my lungs' / 'I'm training right now' / 'I promised myself I wouldn't.'</span></p>", "textType": "RichText"}, "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "show": false, "done": false, "id": "89206d9f-7569-44df-8ee0-0c90ae1ae7e1"}, {"order": 0, "heading": {"text": "", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\"> </span><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">HUMOR + REDIRECT</span></p>", "textType": "RichText"}, "text": {"content": "<p><span style=\"fo
