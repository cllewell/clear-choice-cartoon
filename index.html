square"}, "correctDropAreaId": "99a57014-83ba-4a42-a301-c0e501f373a1", "index": "b", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">2. 'If it tastes sweet, it's safer.'</span></p>", "textType": "RichText"}, {"id": "e8f327f9-e6f3-44fc-b726-dd2fc3a56614", "text": "", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">3. 'Everyone is doing it.'</span></p>", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "textType": "RichText", "correctDropAreaId": "99a57014-83ba-4a42-a301-c0e501f373a1", "index": "c"}, {"id": "f106a736-aec0-4da6-88ad-5cc070cde3af", "text": "", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">4. 'Aerosol can affect people nearby.'</span></p>", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "textType": "RichText", "correctDropAreaId": "3d2a37c8-2442-421a-a618-7e0ba8aefe26", "index": "d"}, {"id": "0de74989-7fb6-4dba-ad04-1e653a945409", "text": "", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">5. 'Quitting is just a matter of willpower.'</span></p>", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "textType": "RichText", "correctDropAreaId": "99a57014-83ba-4a42-a301-c0e501f373a1", "index": "e"}], "dropAreas": [{"id": "99a57014-83ba-4a42-a301-c0e501f373a1", "text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square", "hasZoom": true}, "index": 0, "content": "<p><strong style=\"font-size:1.1875em\">Myth</strong></p>", "textType": "RichText"}, {"id": "3d2a37c8-2442-421a-a618-7e0ba8aefe26", "text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square", "hasZoom": true}, "index": 1, "content": "<p><strong style=\"font-size:1.1875em\">Fact</strong></p>", "textType": "RichText"}], "blockId": 640451}, "id": "7a436401-ef34-40f0-aaf2-f193390a7615"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Correct.</h1>", "textType": "RichText"}, "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">→ Item 1 feedback: Nicotine can create a cycle where 'focus' is mostly relief from withdrawal.</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">→ Item 2 feedback: Sweet flavor indicates appeal, not safety.</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">→ Item 3 feedback: 94% of U.S. students do not currently vape.</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">→ Item 4 feedback: Correct — secondhand aerosol contains nicotine and particles.</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">→ Item 5 feedback: Dependence is biological. A plan and support improve outcomes significantly.</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect.", "content": "<h1 class=\"font-style--h1\">Incorrect.</h1>", "textType": "RichText"}, "content": "<p>Incorrect.</p>", "textType": "RichText"}, "blockId": 640451}, "id": "a975700d-8abb-4d39-80bc-421ccab05abd"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "660e91 ent": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.1875em\">'Direct refusal is one of the most effective approaches. You don't owe anyone an explanation.'</span></p>", "blockId": 640456, "textType": "RichText"}, "id": "34883df7-5f43-4645-a35e-0d0250dff4a8"}, {"component": "VIDEO", "config": {"src": "/resources/CC Chapter 04 Direct Refusal Outcome B-efd7590f-1675-497b-9b22-14dd4b514c62.mp4", "trackUrl": "/resources/2019-11-26T00-19-23.925Z-siren.vtt", "posterUrl": "", "blockId": 640456}, "id": "99c5216c-451e-4427-858f-0798eb3cdc5e"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "b350e5b1-5379-4314-8bb1-90936b9f4ea7"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "", "transcript": " "}, "id": "7e8b4586-1351-434f-87aa-10de0de4e62e"}], "parentHash": "0f1e7014-e33b-4ac8-9d6b-f4423f0dc449", "order": 1, "layoutType": "ONE-ROW-TWO-THIRD", "alignContent": null, "learningobject_id": 27300}, {"id": 640457, "hashId": "3ce940ce-1114-46a2-a908-f842d691785f", "learningObjectId": 27300, "title": "Branch Title", "synopsis": null, "templateBlock": false, "sectionId": null, "block": null, "blockType": "BRANCH-SECTION-BLOCK", "components": null, "parentHash": "60924884-3c07-40fc-88a5-93c2afb4fff1", "order": 3, "layoutType": null, "alignContent": null, "learningobject_id": 27300}, {"id": 640458, "hashId": "cd82f5d7-3f7d-4aeb-9b9e-1700efffb194", "learningObjectId": 27300, "title": "C Outcome", "synopsis": "Vaping without inhaling", "templateBlock": false, "sectionId": null, "block": "VIDEO-ONLY__ONE-ROW-TWO-THIRD", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640458, "content": "<h1 class=\"font-style--h1\"><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif\">→ C outcome:</span></h1>", "textType": "HEADING"}, "id": "2f749de6-da89-43ab-879c-c1ae0d971837"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.1875em\"> 'Even without inhaling, accepting the device keeps the social script going. It also rarely ends there.'</span></p>", "blockId": 640458, "textType": "RichText"}, "id": "751b052b-aaf6-4f8a-8fe0-7a50d0e57ae1"}, {"component": "VIDEO", "config": {"src": "/resources/CC Chapter 04 Even Wtihout Inhaling Outcome C-317491fc-c856-44a6-9165-3b6e746f3514.mp4", "trackUrl": "/resources/2019-11-26T00-19-23.925Z-siren.vtt", "posterUrl": "", "blockId": 640458}, "id": "9cd63e2e-dcd8-4249-bac4-8b46d302f38f"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "103b4aed-ac9d-496b-9f06-d78c56b00f91"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "", "transcript": " "}, "id": "a3e8a2e6-fb58-460f-876d-096c701a0039"}], "parentHash": "3ce940ce-1114-46a2-a908-f842d691785f", "order": 1, "layoutType": "ONE-ROW-TWO-THIRD", "alignContent": null, "learningobject_id": 27300}, {"id": 640459, "hashId": "154e7680-b3f4-4cdf-a3a1-0ff2ef92abdd", "learningObjectId": 27300, "title": "Branch Title", "synopsis": null, "templateBlock": false, "sectionId": null, "block": null, "blockType": "BRANCH-SECTION-BLOCK", "components": null, "parentHash": "60924884-3c07-40fc-88a5-93c2afb4fff1", "order": 4, "layoutType": null, "alignContent": null, "learningobject_id": 27300}, {"id": 640460, "hashId": "9eba1f8f-a17c-4ce4-a1f5-161cb41dafb3", "learningObjectId": 27300, "title": "D Outcome", "synopsis": "Humor and redirect", "templateBlock": false, "sectionId": null, "block": "VIDEO-ONLY__ONE-ROW-TWO-THIRD", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640460, "content": "<h1 class=\"font-style--h1\"><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif\">→ D outcome:</span></h1>", "textType": "HEADING"}, "id": "f2f2d4be-1848-4d35-a0e0-180bf0a1861d"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.1875em\"> 'Humor and redirect is a solid tool — it lightens the moment and moves things forward without confrontation.'</span></p>", "blockId": 640460, "textType": "RichText"}, "id": "31459252-b84c-4c5b-8197-203b209f8177"}, {"component": "VIDEO", "config": {"src": "/resources/CC Chapter 04 Make a Joke Outcome D-bc5456db-1e44-4e00-82d3-6a3058dc636b.mp4", "trackUrl": "/resources/2019-11-26T00-19-23.925Z-siren.vtt", "posterUrl": "", "blockId": 640460}, "id": "1252dea7-f1b9-4da7-a3bc-6ed1b37bb511"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "9602cb7c-6584-40e6-b970-a49c29022912"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "", "transcript": " "}, "id": "bacb531a-8541-450c-8eda-5c534ea7773f"}], "parentHash": "154e7680-b3f4-4cdf-a3a1-0ff2ef92abdd", "order": 1, "layoutType": "ONE-ROW-TWO-THIRD", "alignContent": null, "learningobject_id": 27300}, {"id": 640461, "hashId": "5a972551-d7cf-456e-9dc4-27f901506bcf", "learningObjectId": 27300, "title": "What Stress Relief Means", "synopsis": "Explains that nicotine does not produce a lasting calming effect", "templateBlock": false, "sectionId": null, "block": "FEATURE-TEXT-IMAGE-RIGHT__ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640461, "content": "<h2 class=\"font-style--h2\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">What Stress Relief Really Means</strong></h2>", "textType": "HEADING", "textLevel": "block-heading block-heading--root"}, "id": "66888af5-4808-4cf6-be81-9fd1247c8026"}, {"component": "FEATURE-TEXT", "config": {"text": "", "blockId": 640461, "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Nicotine does produce a real, short-term calming effect in some people. This is a documented pharmacological reality — and the reason so many users say they vape to manage stress.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Here's what's actually happening: as dependence develops, the brain produces low-level anxiety whenever nicotine levels drop. The 'relief' of each use is partly relief from that withdrawal-generated anxiety — not a genuine reduction in external stress.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Regular nicotine users tend to have higher baseline anxiety than non-users, not lower. The relief of each use compared to the preceding withdrawal creates the illusion of benefit.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Healthy alternatives: aerobic exercise, diaphragmatic breathing, social connection with supportive people. None of these create a withdrawal cycle.</span></p>", "textType": "RichText"}, "id": "f3021182-ad69-4bf1-9330-ac5c7bd00184"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 04 Teens Doing Aerobic Exercise Cartoon-78b7ac05-639b-48b6-9099-eb7939009208.jpeg", "alt": "Image showing teens jogging and exercising as healthy alternatives to vaping.", "variant": "square", "blockId": 640461, "caption": {"text": ""}, "isBlockImage": true}, "id": "0dc5008e-93e0-4d3f-9ddf-6e5bdcc89686"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "29a90492-5b15-474e-8e18-8d2259bd7b01"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 04 What Stress Relief Really Means Andrew-3071db46-9916-4c12-917a-98742c5b643e.mp3", "transcript": " "}, "id": "1bc06f89-b9e4-4fae-aa86-92a4cf4a7698"}], "parentHash": "02eefa08-c5f8-4560-8c1e-0a2bbbdd4cf1", "order": 9, "layoutType": "ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "alignContent": null, "learningobject_id": 27300}, {"id": 640462, "hashId": "d482e623-802c-4cd0-a793-f3d9cb4ddcc8", "learningObjectId": 27300, "title": "Knowledge Check 4", "synopsis": "Multiple-Choice Question", "templateBlock": false, "sectionId": null, "block": "MULTIPLE-CHOICE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640462, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Knowledge Check 4</strong></h1>", "textType": "HEADING", "textLevel": "block-heading block-heading--root"}, "id": "db04a44c-c95c-45ce-8a0a-1f2979472766"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Which statement most accurately describes why many people believe vaping helps with stress?</span></p>", "blockId": 640462, "textType": "RichText", "textLevel": "block-text"}, "id": "4d33a9e4-6cb1-4fde-8631-65646c4f80d9"}, {"component": "MULTIPLE-CHOICE", "config": {"randomize": false, "select": 4, "allowMultiple": false, "question": {"text": "", "content": "<p><strong style=\"font-size:1.1875em;color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Choose the correct answer.</strong></p>", "textType": "RichText"}, "multipleChoiceType": "default", "answerType": "TEXT", "answers": [{"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": false, "selected": false, "index": 0, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "d6e46eca-a8eb-446a-aac8-ab18284d37b6", "content": "<p><span style=\"font-size:1.0625em;color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">A. Nicotine genuinely and permanently reduces cortisol and stress hormones.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": true, "selected": false, "index": 1, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "b64fb260-a6bb-404d-b488-9ed299378925", "content": "<p><span style=\"font-size:1.0625em;color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">B. The calming effect of nicotine is real but partly caused by relief from withdrawal, creating a cycle that increases baseline anxiety over time.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": false, "selected": false, "index": 2, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "a7499642-ea51-4096-9491-1031caf8ea7e", "content": "<p><span style=\"font-size:1.0625em;color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">C. Vaping reduces stress only in people who already have anxiety disorders.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "correct": false, "id": "9054a83e-a3ea-4e1c-9e44-e0deba16f8a4", "index": 3, "content": "<p><span style=\"font-size:1.0625em;color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">D. The stress-relief effect is entirely psychological and has no physiological basis.</span></p>", "textType": "RichText"}], "blockId": 640462}, "id": "66e8a10a-27e2-4123-8777-d1e06793ad65"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Correct.</h1>", "textType": "RichText"}, "content": "<p><span style=\"color:rgb(255, 255, 255);font-family:Calibri, sans-serif;font-size:1.0625em\"> Exactly. Nicotine's apparent stress relief is partly a withdrawal-relief cycle — not a net reduction in stress.</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect.", "content": "<h1 class=\"font-style--h1\">Incorrect.</h1>", "textType": "RichText"}, "content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\"> Review the stress-relief section.</span></p>", "textType": "RichText"}, "blockId": 640462}, "id": "3ae33988-58bc-45df-b1e0-786ae5e59119"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "77576547-1e6a-4026-bb8f-82d082c3df10"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 04 Knowledge Check 4 Andrew-eafe97a9-57cb-4577-9101-a565045321c8.mp3", "transcript": " "}, "id": "e7ad1f41-5f8e-4e92-a711-357b159e9933"}], "parentHash": "02eefa08-c5f8-4560-8c1e-0a2bbbdd4cf1", "order": 10, "layoutType": null, "alignContent": null, "learningobject_id": 27300}, {"id": 640463, "hashId": "f5105274-109e-4df2-bbb1-e0e9f7593abf", "learningObjectId": 27300, "title": "Reflection — Chapter 4", "synopsis": "Chapter 4 Reflection", "templateBlock": false, "sectionId": null, "block": "TEXT-ENTRY-TEXT-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640463, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Reflection — Chapter 4</strong></h1>", "textType": "HEADING", "textLevel": "block-heading block-heading--root"}, "id": "fd9c6487-55d8-41e3-acdf-cfefd918ef7f"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">1. Can you identify specific ways that marketing has shaped how vaping is perceived in your social environment — on social media, in stores, in conversations?</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">2. Which refusal approach from the toolkit feels most natural to you? Why?</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">3. If the 'stress relief' effect of nicotine is partly produced by withdrawal, how does that change the logic of using it to manage stress?</span></p>", "blockId": 640463, "textType": "RichText", "textLevel": "block-text"}, "id": "4138cffc-3e1a-4648-8469-fee5c656b8eb"}, {"component": "TEXT-ENTRY", "config": {"question": {"text": "", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Type your responses below. This is not scored. It will be saved to your account.</span></p>", "textType": "RichText"}, "placeholder": {"text": "Enter your response here"}, "blockId": 640463}, "id": "5245d7e4-89f4-4c7e-a931-c4a5e0504cea"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Thanks.</h1>", "textType": "RichText"}, "content": "<p><span style=\"color:rgb(255, 255, 255);font-family:Calibri, sans-serif;font-size:1.0625em\">Your answers are saved to your account and are not graded.</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect."}, "content": {"text": "Incorrect."}}, "blockId": 640463}, "id": "2162f28f-567e-4019-b654-759d92f3a0d3"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "21c5586d-e052-4783-857f-b4c74efc269b"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 04 Reflection Chapter 4 Andrew-53d14654-7f66-45b0-8e21-91afffdf9f07.mp3", "transcript": " "}, "id": "28216170-1340-4fc7-91e7-0e58baa779e6"}], "parentHash": "02eefa08-c5f8-4560-8c1e-0a2bbbdd4cf1", "order": 11, "layoutType": null, "alignContent": null, "learningobject_id": 27300}, {"id": 640464, "hashId": "f9279975-9f77-41a3-a899-b1dca179aa0e", "learningObjectId": 27300, "title": "Chapter 4 Summary", "synopsis": "End of Chapter 4.", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "id": "9f2acc25-19a4-436b-9c11-b358a36ba252", "config": {"text": "Summary", "blockId": 640464, "content": "<h1 class=\"font-style--h1\">Good Work!</h1><p class=\"font-style--h1\">Chapter 4 done.</p>", "textType": "HEADING", "textLevel": "block-heading block-heading--root"}}, {"component": "RICH-TEXT", "id": "c82b49b0-d190-4224-9e90-1616920ff43f", "config": {"content": "<p><strong style=\"font-size:1.1875em\">Next...Chapter 5 - Real World Consequences</strong></p>", "blockId": 640464, "textType": "RichText", "textLevel": "block-text"}}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 4 Travel Path to Chapter 5 (1)-6dae9e64-6984-49e0-8b49-321600f935be.gif", "alt": "Animated image  showing traveling the course roadmap to the next chapter:  Chapter 5 Real-World Consequences.", "variant": "landscape", "caption": "", "mode": "scale", "blockId": 640464, "isBlockImage": true}, "id": "f31c6686-fa46-4ce1-8cd8-a424b6e669f1"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "67abcab9-c68e-452e-afbe-56a40afe08e2"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 04 Done Andrew-04a47a6e-8e34-48e9-80b5-43a75c25e0cf.mp3", "transcript": " "}, "id": "81f1cb51-2809-47d5-a56f-c5eb72201abc"}], "parentHash": "02eefa08-c5f8-4560-8c1e-0a2bbbdd4cf1", "order": 12, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27300}, {"id": 640469, "hashId": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "learningObjectId": 27301, "title": "Chapter 5: Real-World Consequences", "synopsis": null, "templateBlock": true, "sectionId": null, "block": null, "blockType": "SECTION-BLOCK", "components": null, "parentHash": "ff628d4b-4648-4d68-bfd5-66031dc71902", "order": 6, "layoutType": null, "alignContent": null, "learningobject_id": 27301}, {"id": 640470, "hashId": "5fdf654b-331d-4747-a7df-de2aadd313e1", "learningObjectId": 27301, "title": "Chapter 5 Introduction", "synopsis": "Introduction to Chapter 5 Real-World Consequences.", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640470, "content": "<h2 class=\"font-style--h2\"><strong style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1em\">CHAPTER 5 — REAL-WORLD CONSEQUENCES</strong></h2>", "textType": "HEADING"}, "id": "2c15ea8b-02ca-4421-b3e8-17999ede86ae"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">This chapter connects the previous four to the parts of daily life where vaping actually shows up: the school record, the athletic roster, the bank account, the work schedule, the lease, and the court order.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Consequences are not only health statistics. They are the invisible daily costs of a habit, the relationships affected by concealment, and the program requirements that affect what comes next.</span></p>", "blockId": 640470, "textType": "RichText"}, "id": "7ba5b766-48de-4d3a-b737-289066c55ca4"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 05 The Real Consequences Cartoon-d417a1c8-258e-43a5-9bd1-7d56e48e4ace.jpeg", "alt": "4 Square grid image of teenaged boy. He is holding a report card with bad grades in the upper left hand corner square. He is hold a court order in the upper right hand corner square. He is passing by the team roster board with no name listed on the board in the bottom left square. He is holding a bank statement showing an overdrawn account in the lower right square.", "variant": "square", "blockId": 640470, "caption": {"text": ""}, "mode": "scale"}, "id": "8e3c2fb4-71a9-4686-854d-35827f665abc"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "9504d94e-7503-43a4-82dd-d9db57876321"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Introduction en-US-Andrew-20260718-01f4b7ff-afbe-4258-8b2a-4a8d0ccb8a13.mp3", "transcript": " "}, "id": "24ff6a71-7b0f-4ca6-9f7c-dcf759b628bb"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 1, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27301}, {"id": 640471, "hashId": "f8e1df7d-5a46-4f50-a1f1-32149666f7be", "learningObjectId": 27301, "title": "The Federal Age of Sale ", "synopsis": "The laws regarding the age restrictions for the sale of nicotine and vaping products.", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640471, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">The Federal Age of Sale</strong></h1>", "textType": "HEADING"}, "id": "7bca4080-7755-478d-b8f6-0502e61dd6d0"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">In December 2019, the federal minimum age to purchase any tobacco product — including e-cigarettes and all vaping devices — was raised to 21 in the United States. This is federal law. It applies in every state.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">A retailer who sells a vaping product to anyone under 21 is violating federal law. Anyone who purchases a vaping product for someone under 21 is also breaking the law.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">For people in court supervision, probation, or diversion programs, program rules around tobacco and nicotine products often extend beyond what federal law requires.</span></p>", "blockId": 640471, "textType": "RichText"}, "id": "2e3a828c-5b93-458b-b38b-3985241f4627"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 05 Tobacco & Vaping Age Law (US) (1)-7dfe7358-3df9-41e0-be1b-453ceefa2bee.gif", "alt": "Animated infographic of tobacco & vaping age law in the U.S. The infographic animates in 3 red bullet points which include: Federal Minimum Age, which is 21 nationwide, Illegal Sales & Purchases, selling or purchasing to or by anyone under 21 is prohibited by federal law, and Program-Specific Rules for probation, diversion and supervision programs may enforce stricter age restrictions beyond federal minimums.", "variant": "square", "blockId": 640471, "caption": {"text": ""}}, "id": "b1805a20-b384-4717-ab2b-fc82cc494bf8"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "2535c184-8b6f-40c3-8c91-71fd86a7cc6d"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Federal Age of Sale en-US-Andrew-20260718-1243d008-c895-4fd5-ab06-675768d71100.mp3", "transcript": " "}, "id": "d0811aad-40e6-444e-a740-ebd44e48850c"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 2, "layoutType": "ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "alignContent": null, "learningobject_id": 27301}, {"id": 640472, "hashId": "391fb020-4dc3-4936-ad83-acca9e8858a7", "learningObjectId": 27301, "title": "Note on Local Rules", "synopsis": "Explains that this course offers broad rules not local ones.", "templateBlock": false, "sectionId": null, "block": "TEXT-CENTERED", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640472, "content": "<h1 class=\"font-style--h1\"><span style=\"font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\">🚭A NOTE ON LOCAL RULES</span></h1>", "textType": "HEADING"}, "id": "23fdebc4-5621-4270-b220-8bb3143b76ce"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">Federal age-of-sale law is one consistent national rule. School discipline policies, campus housing rules, workplace policies, public-space vaping restrictions, and court or probation terms all vary by jurisdiction and program.</span></p><p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.3125em\">This course gives broad U.S. guidance, not local legal advice. There is no jurisdiction in the United States where vaping is consequence-free for minors.</span></p>", "blockId": 640472, "textType": "RichText"}, "id": "2e2a2b7c-d0d2-4e14-b327-71edf219be7e"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "626eebd9-eedf-4b6a-ab57-31d31ebe7276"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Note on Local Rules en-US-Andrew-20260718-f4a3834d-95f8-4e28-ac29-7cd2436bd27a.mp3", "transcript": " "}, "id": "0b078c50-66c4-4993-b037-b48cb1117203"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 3, "layoutType": null, "alignContent": null, "learningobject_id": 27301}, {"id": 640473, "hashId": "e1e7ab98-06a9-4bab-af89-b1d85379ec3e", "learningObjectId": 27301, "title": "Justice System Overview", "synopsis": "Introduction to what consequences look like in the justice system process.", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640473, "content": "<h2 class=\"font-style--h2\"><strong style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Justice System — Overview</strong></h2>", "textType": "HEADING"}, "id": "72e80b6a-2835-4ae1-aa09-509bb96a1510"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">For learners completing this course through a court program, juvenile justice system, probation, pretrial supervision, or diversion agreement, the consequences of vaping extend well beyond health.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">This section is direct about what those consequences look like at each stage of the justice process.</span></p>", "blockId": 640473, "textType": "RichText"}, "id": "b884a031-7f14-41a4-a5cc-b9ce14ffb542"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 05 Justice System Overview Cartoon-d7af7fd1-93d8-4c34-a2b2-9b5b0b364d1b.jpeg", "alt": "Image of Justice Scales in foreground  with courtroom  items around the and other court room items  around the justice scales and faded courtroom chair desk and pillars in the background.", "variant": "square", "blockId": 640473, "caption": {"text": ""}, "mode": "fit"}, "id": "4abe55e1-7b51-4535-ab05-0335533aec2c"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "97eb3db2-7024-493c-818b-6910f10f5c98"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Justice System Overview en-US-Andrew-20260718-e5f8fe1b-78ff-412a-b9aa-fb531b4b16a2.mp3", "transcript": " "}, "id": "7b637a47-2387-43d6-907c-fcfcee67a184"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 4, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27301}, {"id": 640474, "hashId": "4fa119e7-d95e-498e-89b4-a8d5c6c25425", "learningObjectId": 27301, "title": "Juvenile Justice System", "synopsis": "Information about how the juvenile justice system relates to vaping.", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640474, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Juvenile Justice</strong></h1>", "textType": "HEADING"}, "id": "5b66b248-a3bc-4afe-b64a-a62608798b71"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Juvenile justice involvement related to vaping can arise from: a citation for possession of tobacco products by a minor, a school referral that escalates, or a supervision condition being violated when a youth is found with a device.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Consequences may include: diversion to an educational program (which this course satisfies in many programs), formal probation, community service, mandatory counseling, placement conditions restricting peer association, or — for repeated violations — a probation violation hearing.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">If a court order includes abstinence from nicotine or tobacco products, using a vaping device is a supervision violation — regardless of whether you believe it was nicotine-free. Unverified 'nicotine-free' claims are not a reliable defense in a probation context.</span></p>", "blockId": 640474, "textType": "RichText"}, "id": "cc288ea4-9b84-4a87-9838-ee090a4282be"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 05 Juvenile Justice Cartoon-67aadf33-b55f-4b52-8c5b-0df41642866c.jpeg", "alt": "Image of a young teenaged boy with scales of justice in the background.", "variant": "square", "blockId": 640474, "caption": {"text": ""}}, "id": "7b2ce5ec-daec-4323-b29a-cef1c1179084"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "2dba233f-4d54-4876-acfe-8d5649fc8d7a"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Juvenile Justice en-US-Andrew-20260722-5da5af79-9363-4aef-9b70-c35fdb2c2057.mp3", "transcript": " "}, "id": "476f5963-4975-490e-93fe-991515f7dd91"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 5, "layoutType": "ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "alignContent": null, "learningobject_id": 27301}, {"id": 640475, "hashId": "101e0da6-7409-47b8-ba03-f6b0be4f46f2", "learningObjectId": 27301, "title": " Youth in Justice Programs ", "synopsis": "Information for those completing this course as part of a court order.", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640475, "content": "<h2 class=\"font-style--h2\"><span style=\"font-size:1em;color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif\">FOR YOUTH IN JUSTICE PROGRAMS</span></h2>", "textType": "HEADING"}, "id": "447c6b7c-5a4d-49d3-acd1-4b15758d0eba"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.1875em\">If you are completing this course as part of a court order, diversion agreement, or probation condition, your completion certificate is your documentation of compliance.</span></p><p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.1875em\">Download it when the course is complete and deliver it to your probation officer, program coordinator, or attorney as directed. Do not wait to be asked. Prompt documentation of compliance is always in your interest.</span></p>", "blockId": 640475, "textType": "RichText"}, "id": "826eb995-8952-4fc1-b3e2-8c021b8c9e74"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 05 Certificate of Completion Orange Background-77e58f51-b2b9-41f2-8220-3753aea7bba7.png", "alt": "Image of a blank certificate of completion on an orange background.", "variant": "square", "blockId": 640475, "caption": {"text": ""}, "mode": "fit"}, "id": "56c543c7-ef42-4b41-9462-171b2784eda1"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "2035d8ac-4845-4517-bdb8-e13a68070b1d"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Youth in Justice Programs en-US-Andrew-20260722-c5a8f555-4793-49a4-aa28-2d7a57fad5ce.mp3", "transcript": " "}, "id": "41b1f147-54ba-4c39-a2d3-5b3c2286eb91"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 6, "layoutType": "ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "alignContent": null, "learningobject_id": 27301}, {"id": 640476, "hashId": "62ca7121-66ea-428b-886f-a76440a3dfe0", "learningObjectId": 27301, "title": "Adult Probation and Supervised Release", "synopsis": "Information about probation and release programs prohibiting nicotine and vaping.", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640476, "content": "<h2 class=\"font-style--h2\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Adult Probation and Supervised Release</strong></h2>", "textType": "HEADING"}, "id": "1dfbc6ee-7d73-4ca3-a107-3907cb68f737"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Many standard conditions of supervision require abstinence from controlled substances and increasingly, from tobacco products when the underlying offense is substance-related.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Even when conditions don't mention nicotine by name, practical conflicts arise: some residential treatment programs and transitional housing facilities prohibit vaping products, making possession a program violation independent of any drug test.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">There is also a behavioral argument. Research on co-occurring substance use finds that nicotine dependence and other substance use disorders share overlapping neural pathways and trigger patterns. Managing nicotine effectively is, for many people in recovery, part of reducing relapse risk across substances.</span></p>", "blockId": 640476, "textType": "RichText"}, "id": "69ae43dd-305b-4765-b0b6-95f3bb8b5328"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 05 Nicotine and Vaping Prohibited Cartoon-bb79bc24-1216-42e6-8cb1-b7b321109484.jpeg", "alt": "Image of a woman sitting at a  recovery program workstation with no smoking and no vaping signs on the wall behind her.", "variant": "square", "blockId": 640476, "caption": {"text": ""}}, "id": "e8200e11-3a84-4e8c-a32c-f2e7fd3d06af"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "45c47515-9045-474d-9816-88a3df587651"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Adult Probation and Supervised Release en-US-Andrew-20260722-ad0c2527-10cf-4559-8648-4b4f56b1e07b.mp3", "transcript": " "}, "id": "0df2fe3b-4929-4e1d-846b-0cdfea66b84e"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 7, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27301}, {"id": 640477, "hashId": "ba84126a-c03a-4ff2-ac2a-350e548371ea", "learningObjectId": 27301, "title": "For Adults in Supervision ProgramsFor", "synopsis": "Information for those completing this course as part of  an adult supervision. program.", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640477, "content": "<h2 class=\"font-style--h2\"><strong style=\"font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\">For Adults in Supervision Programs</strong></h2>", "textType": "HEADING"}, "id": "60185e32-c55e-4244-8194-24ad86feb584"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">If your probation officer, pretrial supervisor, or court coordinator assigned this course, your completion certificate is available immediately after passing the final exam.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">The certificate includes your name, completion date, exam score, and the Procivica course verification code. Download it and bring a printed or digital copy to your next scheduled check-in.</span></p>", "blockId": 640477, "textType": "RichText"}, "id": "26380311-838f-4215-a54b-6c3ca57e55a5"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 05 Certificate of Completion Orange Background-77e58f51-b2b9-41f2-8220-3753aea7bba7.png", "alt": "Image of a blank certificate of completion on an orange background.", "variant": "square", "blockId": 640477, "caption": {"text": ""}}, "id": "4c71041a-98ad-448a-ac0f-8a2fba35f0c9"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "976bec7a-4166-4c53-b9c6-f5ea08dbd44d"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Adults in Supervision Programs en-US-Andrew-20260722-3874c249-a5f6-4f07-98e7-fdf71c996f40.mp3", "transcript": " "}, "id": "9061d809-cffe-40ed-96f6-5f2122007356"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 8, "layoutType": "ONE-ROW-TWO-THIRDS-AND-ONE-THIRDS-COL", "alignContent": null, "learningobject_id": 27301}, {"id": 640478, "hashId": "eceb12f1-81f9-4c75-89fd-d0998964555f", "learningObjectId": 27301, "title": "Pretrial Supervision and Diversion", "synopsis": "Information on completing this course as part of a pretrial supervision and diversion.", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640478, "content": "<h2 class=\"font-style--h2\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Pretrial Supervision and Diversion</strong></h2>", "textType": "HEADING"}, "id": "29a2939e-187a-4bc9-8cb5-a3ac91c42b45"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Pretrial diversion programs use educational courses like this one as structured alternatives to prosecution. Completing this course as a diversion requirement means successful completion — all chapters plus passing the final exam within the timeframe in your diversion agreement — is part of demonstrating compliance to the court.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Complete the course well before your deadline. Do not start in the final days. A failed first exam attempt or a technical issue could push completion past the required date.</span></p>", "blockId": 640478, "textType": "RichText"}, "id": "ffa508f6-886c-453c-a837-bc5c43cdd80a"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 05 Complete Course Deadline Cartoon-801776b9-0582-4a33-85cf-f6b49ed02609.jpeg", "alt": "Image of a young man showing a clipboard with chapters 1 through 4 checked off and chapters 5 and 6 left to complete.", "variant": "square", "blockId": 640478, "caption": {"text": ""}, "mode": "scale"}, "id": "076bbdab-5500-4696-b3f6-ba23149d3a4f"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "fafee430-1cae-4fec-9d5e-f71383615a42"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Pretrial Supervision and Diversion en-US-Andrew-20260722-23ac56ad-0794-46c9-bace-f141721d8bda.mp3", "transcript": " "}, "id": "baa1e646-f962-4c5a-b4dc-c2d2524dcae5"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 9, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27301}, {"id": 640479, "hashId": "f3680e18-5827-4c84-ae19-b8db272a18a5", "learningObjectId": 27301, "title": "Drug Courts and Specialty Courts", "synopsis": "Information about this course as a course requirement for drug and specialty courts.", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640479, "content": "<h2 class=\"font-style--h2\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Drug Courts and Specialty Courts</strong></h2>", "textType": "HEADING"}, "id": "76f1de53-01b0-4056-880d-61d0213542e9"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Drug courts, mental health courts, family courts, and other specialty court programs that incorporate educational requirements often use Clear Choice as the tobacco and nicotine education component of a broader treatment plan.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">This course is not a replacement for clinical treatment, medication-assisted treatment, or counseling. It is a structured educational module. Chapter 6 includes direct referrals to cessation resources and behavioral health support lines appropriate for specialty court participants.</span></p>", "blockId": 640479, "textType": "RichText"}, "id": "cfcf9858-fb1c-400a-ac7c-ec67c616f717"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 05 About This Course Cartoon-c62a5b55-82a5-416d-825c-147a1b27d96d.jpeg", "alt": "Image of a woman at a whiteboard showing Clear Choice Specialty Court Education Module Information to a group of men and women sitting at a table taking notes.", "variant": "square", "blockId": 640479, "caption": {"text": ""}, "mode": "fit"}, "id": "180d07cc-529c-4c23-94f4-ebd2ad0bd97c"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "781f729b-dfde-4a5b-94e6-602509081898"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Drug Courts and Specialty Courts en-US-Andrew-20260722-34e1241b-8021-40c0-8ca1-03e0668b596e.mp3", "transcript": " "}, "id": "32f1e191-1495-4c05-a16d-00f52c8f488e"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 10, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27301}, {"id": 640480, "hashId": "342c0227-9950-4f0a-adb7-af3a3c084fcf", "learningObjectId": 27301, "title": "School Consequences", "synopsis": "Information regarding actions schools take as consequences.", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640480, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">School Consequences</strong></h1>", "textType": "HEADING"}, "id": "a0b80deb-d570-4ea1-b406-2bc09e81f625"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Schools treat vaping as a serious disciplinary matter. Vape detectors are installed in bathrooms and common areas in a growing number of schools. Consequences commonly include: confiscation, parent/guardian notification, suspension, exclusion from sports or activities, mandatory program referral, and in some cases law enforcement referral.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Research shows the most effective school responses combine consequence with education and support — exactly the approach this course takes.</span></p>", "blockId": 640480, "textType": "RichText"}, "id": "2e1be0e7-9903-4f29-972c-a57ab111bf38"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 05 Consequences at School Cartoon-8b8141f4-477f-4a49-927f-c6f42ac5be60.jpeg", "alt": "Image of a teenaged boy looking sad in the foreground. A woman is sitting at a desk in the background with a sign showing the consequences for vaping in the background on the left. There are 2 women and a man sitting and talking in the background on the right side. Above them is a sign that shows the most effective responses to vaping: consequence + education + support.", "variant": "square", "blockId": 640480, "caption": {"text": ""}}, "id": "6eded49e-e40b-4d52-8247-b732f83d21fc"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "1490a968-3ff0-4286-957b-e02c63c18029"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 School Consequences en-US-Andrew-20260722-5100ffe6-d4df-45ef-a2b0-c3a3bee859fb.mp3", "transcript": " "}, "id": "7c1c8214-5d90-4d78-8f7d-850757915ffc"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 11, "layoutType": null, "alignContent": null, "learningobject_id": 27301}, {"id": 640481, "hashId": "be79d563-1554-4234-bc8a-467961299e20", "learningObjectId": 27301, "title": "Age-Relevant Consequences", "synopsis": "Consequences based on age groups.", "templateBlock": false, "sectionId": null, "block": "HOT-SPOT-IMAGE-TEXT-BUTTON-CENTERED", "blockType": "CONTENT-BLOCK", "components": [{"component": "HOT-SPOT-IMAGE-TEXT-BUTTON", "config": {"buttons": [{"heading": {"text": "", "content": "<p><span style=\"font-size:1.0625em\">Click if this is your age range</span></p>", "textType": "RichText"}, "image": {"src": "/resources/0e73c124-18c3-4cdc-9690-7758b8331913.png", "alt": "Image that says Ages 12-14 on  a blue background.", "variant": "square", "disableZoom": true}, "content": {"heading": {"text": "", "content": "<h1 class=\"font-style--h1\"><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">AGES 12–14:</span></h1>", "textType": "RichText"}, "richText": {"content": "<p><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\"> Sports teams, class participation, and parental notification. Being removed from a team or having parents called is often the consequence that matters most.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/CC Chapter 05 Ages 12-14 Consequences Cartoon-336e893a-9d99-48a3-8318-aea5a21b6690.jpeg", "alt": "Image of a teenaged boy looking sad in the foreground with a grid of 4 images in the background. The top left grid shows a sports team and their coach. The top right grid shows a girl raising her hand in class. The bottom left grid shows a no sports sign. The bottom right grid shows a woman on the phone holding a paper that says school notification.", "variant": "square", "caption": {"text": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "layout": "LAYOUT_LEFT", "mediaType": "IMAGE", "modalSize": "md"}, "isActive": false, "id": "6afc1443-c87e-4c54-ba6c-c395be95c989", "isModalOpen": false}, {"heading": {"text": "", "content": "<p><span style=\"font-size:1.0625em\">Click if this is your age range</span></p>", "textType": "RichText"}, "image": {"src": "/resources/8bf888a3-cbd0-4a61-8c2c-f81a1ad15fb8.png", "alt": "Image that says Ages 15-17 on an orange background.", "variant": "square", "disableZoom": true}, "content": {"heading": {"text": "", "content": "<h1 class=\"font-style--h1\"><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">AGES 15–17:</span></h1>", "textType": "RichText"}, "richText": {"content": "<p><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\"> Driving privileges, college application records, after-school jobs, and athletics. A suspension record can affect college applications. For youth in a juvenile justice program, a vaping violation during supervision can trigger a probation violation hearing.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/CC Chapter 05 Ages 15-17 Consequences Cartoon-8e4e452a-78d6-4512-a795-9993ea42f3dd.jpeg", "alt": "Image shows a teenaged boy in the foreground with a contemplative look and a sign in front of him that says, a suspention record can affect college applications. The background is a 5 grid image. The top left grid shows a  teenaged boy in a car with a supended driver license in front of the car. The top right grid shows a college and a college application with suspension stamped on it. The middle grid on the left shows a teenaged boy working as a clerk at a store. The image in the middle grid on the right shows sports gear with ineligible stamped across the gear. The bottom right grid shows a juvenile justice sign with paper on a clipboard that says probation conditions, vaping violation, probation violation hearing.", "variant": "square", "caption": {"text": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "layout": "LAYOUT_LEFT", "mediaType": "IMAGE", "modalSize": "md"}, "isActive": false, "id": "84ad4c1c-3d57-4986-b10f-dd6e3549a920", "isModalOpen": false}, {"heading": {"text": "", "content": "<p><span style=\"font-size:1.0625em\">Click if this is your age range</span></p>", "textType": "RichText"}, "image": {"src": "/resources/23681646-e898-401d-ac3f-f66c50093668.png", "alt": "Image that says Ages 18-25 on a green background.", "variant": "square", "disableZoom": true}, "content": {"heading": {"text": "", "content": "<h1 class=\"font-style--h1\"><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">AGES 18–25:</span></h1>", "textType": "RichText"}, "richText": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.3125em\"> Workplace policies, campus housing agreements, probation or pretrial supervision terms, drug court requirements, and professional licensing applications. Many healthcare, education, and public safety programs have strict tobacco standards that begin during the application process.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/CC Chapter 05 Ages 18-25 Consequences Cartoon-9f009a66-5468-4da8-86e8-27c139f66546.jpeg", "alt": "Image of young man sitting at a table holding a professional licensing application. A stack of books and a laptop are on the table. There are 4 grids of images behind him. The top left image shows an employee conduct standards sign and  a woman sitting at a table. The upper right hand image shows a dorm room  and a campus housing agreement sign on the door.  The bottom left image shows a judge  and a sign on the wall that shows probation terms. The lower right hand  image  is of a sign that shows drug court requirements.", "variant": "square", "caption": {"text": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "layout": "LAYOUT_LEFT", "mediaType": "IMAGE", "modalSize": "md"}, "isActive": false, "id": "8abdb1ae-111a-4b06-8fd4-2d11e5196f3c", "isModalOpen": false}], "blockId": 640481}, "id": "9e5d4878-3b3a-41c1-bcc6-f0a29acb9e38"}, {"component": "HEADING", "config": {"text": "", "blockId": 640481, "content": "<h1 class=\"ql-align-center font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Age-Relevant Consequences</strong></h1>", "textType": "HEADING"}, "id": "a0604db0-124a-43f8-a749-93f7b999794d"}, {"component": "RICH-TEXT", "config": {"content": "<p class=\"ql-align-center\"><strong style=\"font-size:1.3125em\">Choose the box below that corresponds to your age.</strong></p>", "blockId": 640481, "textType": "RichText"}, "id": "7b7c7314-3605-4faf-8f0f-8ba7ebd0e792"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "4c0f07e7-dbcf-48cd-8be7-d625a020c2ad"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Age Range Consequences en-US-Andrew-20260722-03384555-a3cb-4e24-a5f2-89ff1b203208.mp3", "transcript": " "}, "id": "0c650ebb-1672-41af-8fb2-cd3c8cd2fe78"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 12, "layoutType": null, "alignContent": null, "learningobject_id": 27301}, {"id": 640482, "hashId": "6cea3a96-3fef-4625-b8d3-62deb3ee44bb", "learningObjectId": 27301, "title": "Athletic Performance", "synopsis": "Tobacco and vaping effects on athletic performance.", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640482, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Athletic Performance</strong></h1>", "textType": "HEADING"}, "id": "efa4cad6-227e-4c72-863f-4a75fafc6887"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">For anyone in competitive or recreational sports:</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">• Reduced lung capacity → less efficient oxygen delivery during sustained effort.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">• Airway inflammation → increased respiratory resistance, breathing difficulties.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">• Cardiovascular strain from nicotine → additional load on an already-working system.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">• Sleep disruption from dependence → reduced recovery across all athletic domains.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">• Many competitive programs have explicit tobacco/vaping policies — suspension or loss of eligibility.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Teen athletes who quit vaping consistently report improvements in endurance, breathing, and recovery within weeks.</span></p>", "blockId": 640482, "textType": "RichText"}, "id": "53f90bab-6787-412d-996f-f90a5ab8b177"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 05 Athletic Consequences from Vaping Cartoon-52319628-2474-4c01-9ae7-d9efaad4ad5d.jpeg", "alt": "Image of an athlete with hazards of vaping shown on his left side and the benefits of quitting vaping on the right side.", "variant": "square", "blockId": 640482, "caption": {"text": ""}}, "id": "a4b4ac06-4963-429d-ae35-d6ef3042dd00"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "c0dbd166-9756-4f9f-912e-5f5ed28f4920"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Athletic Performance en-US-Andrew-20260722-d6ef1392-e272-43ca-a284-48ab3c5c370b.mp3", "transcript": " "}, "id": "0929f22f-2aa0-4f81-818b-f305a69ea2d5"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 13, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27301}, {"id": 640483, "hashId": "ee5ffd14-91c7-4cc3-9065-0f39473b96cf", "learningObjectId": 27301, "title": "Financial Reality", "synopsis": "Vaping effects on finances.", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640483, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">The Financial Reality</strong></h1>", "textType": "HEADING"}, "id": "e8907c3e-a70c-48cf-ac52-852001885872"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Nicotine addiction is expensive. A moderately heavy vaper using disposables might go through a $15–20 device every two days: $2,700–$3,600 per year.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">For 18–25 year olds managing independent finances alongside rent, tuition, food, and transportation — that is hundreds or thousands of dollars a year on a drug that is simultaneously harming health and funding an industry that deliberately marketed to them as minors.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Quitting is, among other things, a financially rational decision.</span></p>", "blockId": 640483, "textType": "RichText"}, "id": "56ea350d-0d98-45a3-8bc3-8ca7dd61eaea"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 05 Financial Reality Cartoon-ca190a87-84f8-4235-9743-58b9dc6481f3.jpeg", "alt": "image of a teenage boy with a table showing where money goes when you vape. The left side of the image shows the real cost of vaping and the right side shows the money gained when you quit vaping.", "variant": "square", "blockId": 640483, "caption": {"text": ""}}, "id": "5fd07948-2b22-45fd-8f3d-91706f658b37"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "72566c01-fcc9-48ee-9c3f-c6c2ba0227ba"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Financial Reality en-US-Andrew-20260722-2cea70cb-e874-44c8-aa42-5300957bbd43.mp3", "transcript": " "}, "id": "3b2f46b1-1d27-4a62-bad2-a107246b030b"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 14, "layoutType": null, "alignContent": null, "learningobject_id": 27301}, {"id": 640484, "hashId": "64e7805c-bf77-4a7d-8dbb-ce5dde3d58f7", "learningObjectId": 27301, "title": "Trust Relationships & The Cost of Hiding", "synopsis": "Vaping effects on relationships and the costs of hiding.", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640484, "content": "<h2 class=\"font-style--h2\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Trust, Relationships, and the Cost of Hiding</strong></h2>", "textType": "HEADING"}, "id": "acd36fa0-235f-48a9-95ce-b2a24e275da5"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">One of the most consistent themes in qualitative research with young people who vape is the cognitive and emotional load of managing the secret: hiding devices, finding opportunities to use, monitoring nicotine levels so withdrawal doesn't show.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Parents who discover a child has been vaping often report feeling deceived — not only about the vaping itself but about months or years of concealment.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">For people in recovery from other substance issues, nicotine use can complicate program participation and create tensions with support systems built around sobriety.</span></p>", "blockId": 640484, "textType": "RichText"}, "id": "2b9abfae-9e58-42ab-90ad-1bff0bf26e2d"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 05 Trust Relationships and Hiding Cartoon-bd242664-6fc4-4ca4-a679-e4cb14f339f2.jpeg", "alt": "Image of a teenaged boy looking distressed. There are 3 grids with images in the background. The top left image shows the boy hiding a device in his backpack. The top right image shows the boy being confronted by his parents with a broken heart symbol beneath them and the words: the pain of betrayal. The bottom right image shows the boy with a girl and a man with his hand on his shoulder to show support. The sign on the wall in the image says: Recovery Support Strength Together.", "variant": "square", "blockId": 640484, "caption": {"text": ""}}, "id": "910f8abf-5bd1-49cc-b8fd-445870a675d4"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "687cfc5c-7492-4afd-b693-bc974467c5d4"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Trust Relationships and Cost of Hiding en-US-Andrew-20260722-c980f4e9-6950-4bb3-9353-0a011ede1a82.mp3", "transcript": " "}, "id": "83ddbc3a-4e56-4473-a322-9b929580ab8d"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 15, "layoutType": null, "alignContent": null, "learningobject_id": 27301}, {"id": 640485, "hashId": "efe7422d-199c-4ef4-a473-a9ec948983b0", "learningObjectId": 27301, "title": "Decision Scenario", "synopsis": null, "templateBlock": false, "sectionId": null, "block": "MENU-CENTERED", "blockType": "MULTI-SPLIT-BRANCH-MENU", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640485, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Decision Scenario</strong></h1>", "textType": "HEADING"}, "id": "e7921d81-3c12-4349-a0b7-f87315d3545f"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">You're in a car with a younger sibling. A friend in the back seat pulls out a vape and says 'Just take one hit.'</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">What do you do?</span></p>", "blockId": 640485, "textType": "RichText"}, "id": "eb5410ec-73a9-41b1-affa-dadd9e004116"}, {"component": "MULTI-SPLIT", "config": {"menuItems": [{"heading": {"text": "Branch Title", "branchHashId": "8565a3fa-8933-4d6d-9142-343cb2e3f441", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">A. Take one hit — one puff in a car doesn't really affect anyone.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/CC Chapter 05 Decision Scenario Take a Hit Cartoon-b840b0aa-e224-4163-a5ef-0713f6c385da.jpeg", "alt": "Image of a teenaged boy and girl sitting in a vehicle. The girl is holding a vaping device contemplating whether she should take one hit.", "caption": "", "variant": "square"}, "content": {"heading": {"text": "button top left"}, "richText": {"content": "That branch has been loosened by the storm and could fall at any moment. Cass will need to bring in a clearing team in to ensure that nobody gets hurt."}, "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Alt Text"}, "layout": "LAYOUT_LEFT"}}, {"heading": {"text": "Branch Title", "branchHashId": "334b8f88-5a95-477a-a84b-ed4c8774d3c9", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">B. Decline and explain you don't want aerosol in the car with your sibling.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/CC Chapter 05 Decision Scenario Decline it Cartoon-417400b8-701b-4cfb-8fd2-30816f3d6989.jpeg", "alt": "Image of a teenaged boy and girl sitting in a vehicle. The boy is offering the girl a vaping device and she is declining.", "caption": "", "variant": "square"}, "content": {"heading": {"text": "button top right"}, "richText": {"content": "That branch has been loosened by the storm and could fall at any moment. Cass will need to bring in a clearing team in to ensure that nobody gets hurt."}, "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Alt Text"}, "layout": "LAYOUT_RIGHT"}}, {"heading": {"text": "Branch Title", "branchHashId": "17d61356-240c-45fd-af09-78e2ae182673", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">C. Hold it for your friend without vaping.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/CC Chapter 05 Decision Scenario Hold it Cartoon-ea12b0c9-07b0-498d-9fb0-4735cf0c4900.jpeg", "alt": "Image of a teenaged boy and girl sitting in a vehicle. The girl is holding a vaping device.", "variant": "square", "caption": {"text": ""}}, "content": {"heading": {"text": ""}, "richText": {"content": ""}, "image": {"src": "assets/placeholder2.png", "alt": "Image description"}, "layout": "LAYOUT_LEFT"}}, {"heading": {"text": "Branch Title", "branchHashId": "aec8151e-4365-4c9a-8603-99470ee9773a", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">D. Take a hit and promise it's the last time.</span></p>", "textType": "RichText"}, "image": {"src": "/resources/CC Chapter 05 Decision Scenario Try it or Hold it Cartoon-cf7f3121-0bb9-422b-bf1d-d8706b4d67d5.jpeg", "alt": "Image of a teenaged boy and girl in a vehicle. The boy is offering the girl a vaping device.", "variant": "square", "caption": {"text": ""}}, "content": {"heading": {"text": ""}, "richText": {"content": ""}, "image": {"src": "assets/placeholder2.png", "alt": "Image description"}, "layout": "LAYOUT_LEFT"}}], "blockId": 640485}, "id": "e8302b9f-0a46-4c7e-bf2e-a1ba7b5b9f24"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "layout": "FULL_PAGE", "key": "0.5510949958746425", "isActive": true, "color": "#FFFFFF", "opacity": 100}, "id": "d602d90f-7023-4a91-ab43-20d2e24c9117"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Decision Scenario en-US-Andrew-20260722-c5124436-6415-4002-bdc3-4bf2db1ec7c3.mp3", "transcript": " "}, "id": "6e229ef1-9d96-4e49-bfe1-bdcac3604eaf"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 16, "layoutType": "TWO-ROW-ONE-COL", "alignContent": "Center", "learningobject_id": 27301}, {"id": 640486, "hashId": "3885373b-6819-418b-aac8-a83619c7a0b7", "learningObjectId": 27301, "title": "Branch Title", "synopsis": null, "templateBlock": false, "sectionId": null, "block": null, "blockType": "BRANCH-SECTION-BLOCK", "components": null, "parentHash": "efe7422d-199c-4ef4-a473-a9ec948983b0", "order": 1, "layoutType": null, "alignContent": null, "learningobject_id": 27301}, {"id": 640487, "hashId": "a359df16-c3a0-44ed-afb1-c4b651756751", "learningObjectId": 27301, "title": "Outcome A", "synopsis": "Taking one hit outcome.", "templateBlock": false, "sectionId": null, "block": "VIDEO-ONLY__ONE-ROW-TWO-THIRD", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640487, "content": "<h1 class=\"font-style--h1\"><span style=\"font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\">A outcome:</span></h1>", "textType": "HEADING"}, "id": "89a10bda-6d25-4d43-80f6-c1be11cb26fd"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgba(0, 0, 0, 0.918);font-family:Calibri, sans-serif;font-size:1.1875em\">Actually, a single puff in a closed car creates measurable secondhand aerosol exposure for your sibling. This choice has consequences beyond just you.</span></p>", "blockId": 640487, "textType": "RichText"}, "id": "15059e87-0af9-442e-935b-648349108144"}, {"component": "VIDEO", "config": {"src": "/resources/CC Chapter 05 Puff in car exposes sibling-a0971124-01e1-45b2-a81a-1fcf3c6587a9.mp4", "trackUrl": "/resources/2019-11-26T00-19-23.925Z-siren.vt }, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "c835e043-1654-486d-81a5-1db6af2e8acc", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">C. Vaping rules are the same everywhere in the United States.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "correct": false, "id": "d8583d1e-2504-483a-b9a7-6051f43ca299", "index": 3, "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">D. Only medical staff are qualified to explain local vaping rules.</span></p>", "textType": "RichText"}], "blockId": 640494}, "id": "2799e303-51b2-4987-a64c-f17715b557e2"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Correct.</h1>", "textType": "RichText"}, "content": "<p><span style=\"color:rgb(255, 255, 255);font-family:Calibri, sans-serif;font-size:1.1875em\">Right. The course gives broad U.S. guidance — your local rules may be stricter.</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect.", "content": "<h1 class=\"font-style--h1\">Incorrect.</h1>", "textType": "RichText"}, "content": "<p><span style=\"color:rgb(255, 255, 255);font-family:Calibri, sans-serif;font-size:1.1875em\">Review the local rules callout block.</span></p>", "textType": "RichText"}, "blockId":
