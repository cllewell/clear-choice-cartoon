yond the health effects?</span></p>", "blockId": 640495, "textType": "RichText"}, "id": "c8696308-708c-4ae5-9764-c40240e2ed74"}, {"component": "TEXT-ENTRY", "config": {"question": {"text": "", "content": "<p><span style=\"font-size:1.1875em;color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Type your responses below. This is not scored. It will be saved to your account.</span></p>", "textType": "RichText"}, "placeholder": {"text": "Enter your response here"}, "blockId": 640495}, "id": "4f759594-9455-4449-a4a7-3985bc26933e"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Thanks.</h1>", "textType": "RichText"}, "content": "<p><span style=\"color:rgb(255, 255, 255);font-family:Calibri, sans-serif;font-size:1.3125em\">Your answers are saved to your account and are not graded.</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect."}, "content": {"text": "Incorrect."}}, "blockId": 640495}, "id": "044d9e2a-40f4-4fad-92bb-b9d85e709ac7"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "44d50fd6-b682-450c-8df3-7b8a64519ed4"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Reflection 5 en-US-Andrew-20260722-4523e6e1-16da-476f-872b-d6f746278124.mp3", "transcript": " "}, "id": "11786750-bd31-4c7a-a15b-8d4f4f3d5291"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 18, "layoutType": null, "alignContent": null, "learningobject_id": 27301}, {"id": 640496, "hashId": "e64eac0f-3e67-440f-8cc6-f768dcbeb8a0", "learningObjectId": 27301, "title": "Chapter 5 Summary", "synopsis": "End of Chapter 5", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT__ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "id": "9f2acc25-19a4-436b-9c11-b358a36ba252", "config": {"text": "Summary", "blockId": 640496, "content": "<h1 class=\"font-style--h1\">Awesome Job!</h1><p class=\"font-style--h1\">Chapter 5 done.</p>", "textType": "HEADING"}}, {"component": "RICH-TEXT", "id": "c82b49b0-d190-4224-9e90-1616920ff43f", "config": {"content": "<p><strong style=\"font-size:1.1875em\">Next...Chapter 6 - Quitting and Recovery</strong></p>", "blockId": 640496, "textType": "RichText"}}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 5 Travels Course Roadmap to Chapter 6 (1)-7491b991-0651-4181-a4dc-e1361f14c8cd.gif", "alt": "Animated image of traveling the course roadmap to the next chapter: Chapter 6 - Quitting and Recovery.", "variant": "landscape", "caption": "", "mode": "scale", "blockId": 640496}, "id": "f31c6686-fa46-4ce1-8cd8-a424b6e669f1"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "67abcab9-c68e-452e-afbe-56a40afe08e2"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 05 Done en-US-Andrew-20260722-21c6a93f-3879-467f-a76a-48d7aa60656d.mp3", "transcript": " "}, "id": "81f1cb51-2809-47d5-a56f-c5eb72201abc"}], "parentHash": "541cb699-de5d-4625-b0a0-7e4cfad1382a", "order": 19, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27301}, {"id": 640661, "hashId": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "learningObjectId": 27306, "title": "Chapter 6: Quitting and Recovery", "synopsis": null, "templateBlock": true, "sectionId": null, "block": null, "blockType": "SECTION-BLOCK", "components": null, "parentHash": "ff628d4b-4648-4d68-bfd5-66031dc71902", "order": 7, "layoutType": null, "alignContent": null, "learningobject_id": 27306}, {"id": 640662, "hashId": "6049bd27-86ec-4bad-b4c1-2acef8b40ebe", "learningObjectId": 27306, "title": "Chapter 6 - Introduction", "synopsis": "Introduction to chapter 6.", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640662, "content": "<h2 class=\"font-style--h2\"><strong style=\"font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\">CHAPTER 6</strong><strong style=\"font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\"> </strong><strong style=\"font-family:Calibri, sans-serif;color:rgba(0, 0, 0, 0.918)\"> — QUITTING AND RECOVERY</strong></h2>", "textType": "HEADING"}, "id": "4b91556c-d3ec-4938-b7cf-0380af59b3f0"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">This chapter exists because most people who vape want to stop. Research consistently finds that a majority of young e-cigarette users have tried to quit and found it harder than expected.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Not because they lack willpower. Because they are trying to overcome a genuine physiological dependence with no plan, during the period when withdrawal is most intense, without support, and without a clear understanding of what to expect.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">This chapter is a practical guide.</span></p>", "blockId": 640662, "textType": "RichText"}, "id": "52721a3f-fa5b-4564-97a0-9586a4eb8a57"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 06 The Steps of Recovery Cartoon-b0c00625-bfc5-48a5-a0c2-a15c80d5deec.jpeg", "alt": "Image shows a teenage girl sitting in a chair on the left with a woman smiling and gesturing toward him from a chair on the right. On the wall behind them there is a framed sign that says, Steps of recovery. Then it has steps going upward. The bottom step says, Awareness; the next step says, Commitment; the next step says, Support; the next step says, Growth and at the top there is a picture of a sun and an arrow pointing up. There is a notebook and pen on the table along with a box of tissues and a plant. ", "variant": "square", "blockId": 640662, "caption": {"text": ""}, "mode": "scale"}, "id": "da85237f-a1af-418c-a641-5f20497d5040"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "17de7ff4-c074-4216-bfdc-ab2789136f16"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/Chapter 06 Quitting and Recovery en-US-Andrew-20260728-36b74fcd-818e-4a93-a2a6-3e6d3b55dae6.mp3", "transcript": " "}, "id": "39c10bf1-a0cf-48f7-8f7c-9429d2dfed8c"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 1, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": "Center", "learningobject_id": 27306}, {"id": 640663, "hashId": "a4416f3e-8172-4208-8c16-ffe8816d87ed", "learningObjectId": 27306, "title": "Why Quitting Feels Hard", "synopsis": "Information about quitting and why a slip is not failure.", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640663, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Why Quitting Feels Hard</strong></h1>", "textType": "HEADING"}, "id": "93070b22-481e-4986-a704-64065ad7f95b"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Withdrawal from nicotine is genuinely uncomfortable. Pretending otherwise would be patronizing. Knowing what to expect, however, changes the experience significantly — because the most common reason people return to vaping during a quit attempt is that withdrawal symptoms feel unexpected and permanent, when in fact they are predictable and temporary.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">A slip is not a failure. Most people who eventually quit successfully do so after multiple attempts. Each attempt provides information about what triggers are hardest and what support would help most.</span></p>", "blockId": 640663, "textType": "RichText"}, "id": "d175cd9f-13af-4467-8acd-63ac61e08da3"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 06 Slip and Try Again Cartoon-5bc8d2cb-befc-4ab8-8e40-3ae8ea565893.jpeg", "alt": "Image has title at the top that says, Slip? Try Again and a subtitle that says, Learn & Adapt. The image is split in two with a zig zag line. On the left side of the image a teenaged girl  in sitting on a chair with her head down looking sad and tired. The caption on the floor by her feet says, cravings fatigue. The right side of the image shows the girl  sitting in a group with other young people. The caption at the bottom says, Resilence  Support.", "variant": "square", "blockId": 640663, "caption": {"text": ""}, "mode": "fit"}, "id": "0c416cb2-acaa-4dde-9de6-eeff4bfc2072"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "de92a9ba-31ba-4985-a543-9bcaf6ffbb16"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 06 Why Quitting Feels Hard en-US-Andrew-20260728-9f59653f-6991-4f2e-b034-f6f9fa3d8117.mp3", "transcript": " "}, "id": "465f27fb-a786-47a2-9fc1-6b2f78bd25b3"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 2, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27306}, {"id": 640664, "hashId": "accc0ce2-93de-4093-a6d0-50642032c0be", "learningObjectId": 27306, "title": "Withdrawal What to Expect", "synopsis": "The symtoms of withdrawal explained.", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640664, "content": "<h2 class=\"font-style--h2\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Withdrawal — What to Expect</strong></h2>", "textType": "HEADING"}, "id": "6e04cc05-f3e5-45be-b01d-74b6d1dfa763"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Typical nicotine withdrawal symptoms:</span></p><p><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Cravings for nicotine — intense but brief; most peak within 3–5 minutes</span></p><ol><li data-list=\"bullet\"><span></span><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\"> Irritability, frustration</span></li><li data-list=\"bullet\"><span></span><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Anxiety and restlessness </span></li><li data-list=\"bullet\"><span></span><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Difficulty concentrating</span></li><li data-list=\"bullet\"><span></span><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Low mood</span></li><li data-list=\"bullet\"><span></span><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Sleep disturbance</span></li><li data-list=\"bullet\"><span></span><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Increased appetite</span></li></ol><p><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Timeline:</span></p><ol><li data-list=\"bullet\"><span></span><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Days 1–3: Most intense. Peak withdrawal.</span></li><li data-list=\"bullet\"><span></span><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">End of week 1: Meaningful improvement for most people.</span></li><li data-list=\"bullet\"><span></span><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">End of week 2: Acute withdrawal largely over.</span></li><li data-list=\"bullet\"><span></span><span style=\"font-size:1.0625em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Weeks 3–4 onward: Situational cravings diminish in frequency and intensity.</span></li></ol>", "blockId": 640664, "textType": "RichText"}, "id": "6b4d40b9-d0e9-41a0-b8f8-f9d966b1c2bb"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 06 Withdrawal Symtoms and Recovery Cartoon-cd0734d7-f1f5-4e12-9636-a3d81a95d572.jpeg", "alt": "A 4 grid image showing a young woman in all  4 grids. At the top she is sitting down with her head down the caption above her says, 1. Nicotine Withdrawal. In the top right grid, he is holding her head and there is a calendar on the wall behind her with 3 days marked off with x's. The caption above her says, 2. Days 1-3 Peak Withdrawal. In the bottom left grid, she is shown sitting at a desk, smiling with a pen and a book. The caption above her says, 3. End of Week. 1-2: Improvement. In the bottom right grid, she is shown sitting outside and smiling. The caption above her says, 4. Weeks 3-4 Onward: Recovery.", "variant": "square", "blockId": 640664, "caption": {"text": ""}}, "id": "d45068eb-aef9-44d1-8aec-81adcae2446d"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "b23d266d-1378-41d7-9d01-e635cca56f00"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 06 Withdrawal What to Expect en-US-Andrew-20260728-553d7137-a09d-46d8-b68a-b2ca71249f54.mp3", "transcript": " "}, "id": "b6e8fae3-b90a-49e2-aa59-17b3125cb370"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 3, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27306}, {"id": 640665, "hashId": "8c369d2c-da61-42ec-af14-21b12e92d48f", "learningObjectId": 27306, "title": "The Craving Curve", "synopsis": "Explains the craving curve and how cravings work.", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640665, "content": "<h1 class=\"font-style--h1\"><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1em\">T﻿HE CRAVING CURVE</span></h1>", "textType": "HEADING"}, "id": "1960f7a1-6539-46f0-87d2-6fd925f82018"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">A craving is not a permanent state. It rises, peaks — usually within 3–5 minutes — and then diminishes, whether you act on it or not.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Every craving you wait out weakens the learned association slightly. Having something to do during those 3–5 minutes — a text to send, a walk to take, water to drink, a breathing exercise — is one of the most practical quit tools there is.</span></p>", "blockId": 640665, "textType": "RichText"}, "id": "084cd5da-2b20-4a33-92fb-bda9958d8b22"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 06 The Craving Curve and Peak Cartoon-7dde2394-6b5d-4307-9c16-9d2016129452.jpeg", "alt": "Image of a teenaged boy sitting on the left side of the image looking at his phone. There are 2 arrows pointing up and away from him. It says, craving rises next to the arrows and they are pointing to the top of a curve that says, peak 3-5 minutes at the top. There are 2 arrows pointing down from the top of the curve to the right toward the boy who is walking toward the left. The words next to the arrows say, diminishes naturally.  At the bottom, in the middle of the image, it says, Each craving you wait out weakens the learned association and underneath it says, use practical tools and shown underneath is a speech buble with the word, text under it; a shoe with the word, walk under it; a water bottle with the word water under it and an image of a person figure with the word breathe underneath.", "variant": "square", "blockId": 640665, "caption": {"text": ""}}, "id": "ffd02eae-9ac2-4c11-a885-a81067c8488e"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "7838085d-ed0e-467c-bf2f-107be7c463ad"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 06 The Craving Curve en-US-Andrew-20260728-72460a36-19cc-4c2d-8501-81661c4b54e0.mp3", "transcript": " "}, "id": "2f37a079-8aa8-4e6e-8576-1b044c472579"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 4, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27306}, {"id": 640666, "hashId": "075b920f-eca7-4d04-8e77-1565d1ea0474", "learningObjectId": 27306, "title": "Recovery and Justice Programs", "synopsis": "Information about treatment in recovery and justice programs.", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640666, "content": "<h2 class=\"font-style--h2\"><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">FOR LEARNERS IN RECOVERY OR JUSTICE PROGRAMS</span></h2>", "textType": "HEADING"}, "id": "f4285fc4-235c-46ff-9340-3e6bd29f7807"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">If you are also managing recovery from alcohol, cannabis, or other substances, nicotine deserves specific attention in your recovery plan. Nicotine dependence activates many of the same neural pathways and high-risk situations — stress, social triggers, reward-seeking — relevant to other substance use.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Treating nicotine as a lower-priority issue is a common mistake. Share your if-then coping plan from this chapter with your counselor, treatment provider, or drug court case manager so nicotine management is integrated with your broader recovery work.</span></p>", "blockId": 640666, "textType": "RichText"}, "id": "e791bb16-e2bc-4e04-8ddc-05e0d4710840"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 06 Recovery and Support Cartoon-036f8897-5d94-4ae6-aba5-1e1bd9f42cbf.jpeg", "alt": "Image shows a teenage boy sitting with a woman who has a clipboard in her hand. The writing on the paper clipped to the board says, My If-Then Plan. There is a book on the table in front of them that says, one day at a time and a mug that says, better choices, better future. There is a sign on the wall behind them that says, Recovery, Support and Stronger together. Underneath the sign there is a book case with a plant and a framed sign that says, Focus Plan Grow.", "variant": "square", "blockId": 640666, "caption": {"text": ""}}, "id": "c60c3547-1610-4e51-acea-9205c09f96fa"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "28da2efa-8ff1-44ec-9ba8-f47288d8828b"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 06 Learners in Recovery or Justice Programs en-US-Andrew-20260728-eb5161de-a445-4c91-838b-4ab53904463f.mp3", "transcript": " "}, "id": "459b6f42-2dd9-4b13-8436-4fb8c4713a37"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 5, "layoutType": null, "alignContent": null, "learningobject_id": 27306}, {"id": 640667, "hashId": "19adb523-7c58-4175-8eba-2bb984684e9f", "learningObjectId": 27306, "title": "Quit Plan has 5 Steps", "synopsis": "Provides 5 steps for quitting.", "templateBlock": false, "sectionId": null, "block": "IMAGE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640667, "content": "<h2 class=\"font-style--h2\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.1875em\">Your Quit Plan — Five Steps</strong></h2>", "textType": "HEADING"}, "id": "f7d2a7ef-84fd-4ce1-b762-db7626b67233"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">A quit plan that works has five components. They don't need to be elaborate. Each one matters.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">1. PICK A QUIT DATE — specific, within 1–2 weeks, somewhere you'll see it, told to at least one person.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">2. MAP YOUR TRIGGERS — stress, boredom, meals, car rides, social settings, late night. Written down.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">3. REMOVE ACCESS — devices and accessories out of your room, bag, car, locker. Not 'just in case' access.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">4. NAME ONE SUPPORT PERSON — someone who knows, supports it, and is available to text during a craving.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">5. WRITE YOUR IF-THEN PLAN — for each top trigger, a specific response ready in advance.</span></p>", "blockId": 640667, "textType": "RichText"}, "id": "1adc6ddf-32ee-4615-9e60-a088244539cd"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 06 A Quit Plan that Works Cartoon-d77d353c-01d4-4299-aee8-3a45163df448.jpeg", "alt": "Image with a title at the top that says, a quit plan that works and a subtitle that says, five components, each one matters. Under the subtitle there are two rows of items shown. In the first row, a calendar is shown on the top left with the caption 1 Pick a Quit Date, underneath it. Next to the calendar,  there is a notebook showing triggers with the caption underneath that says, 2 Map Your Triggers. Next to the notebook there is a box with a picture of a lock on the front with vaping devices inside. The caption underneath says, 3 Remove Access.  In the second row on the bottom left there is a cell phone with the word support on the screen and a graphic of a person  figure. The caption next to the phone says, 4 Name One Support Person. Next to the caption there is a notebook that has IF - Then Plan written at the top. The caption next to it says, 5 Write Your If-Then Plan. The bottom of the image says, Plan Ahead. Stay Prepared. You Can Do This.", "variant": "square", "blockId": 640667, "caption": {"text": ""}, "mode": "fit"}, "id": "38302608-52ca-4f2a-8f09-a3ca967a26a0"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "fa8378fc-71b3-41e3-a799-4f37d3c1bebe"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 06 Your Quit Plan - 5 Steps en-US-Andrew-20260728-d83e9036-d9c5-499a-b6a2-a2720c095203.mp3", "transcript": " "}, "id": "21c5987e-74f6-437b-ba8d-5d216f16f423"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 6, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27306}, {"id": 640668, "hashId": "069e30af-8216-4f19-9b43-302add2bfde4", "learningObjectId": 27306, "title": "Build Your Quit Plan", "synopsis": "Provides a template for building a quit plan.", "templateBlock": false, "sectionId": null, "block": "TEXT-ENTRY-TEXT-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640668, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Build Your Quit Plan</strong></h1>", "textType": "HEADING"}, "id": "a25027a4-e4df-423f-8cc5-5ea09e90068a"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\"> Complete your personal quit plan. Copy the template below and paste it in the text entry box on the right.</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">[ My quit date: ____________ ]</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">[ My top 3 triggers:</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\"> 1. ____________</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\"> 2. ____________</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\"> 3. ____________ ]</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">[ My support person: ____________ ]</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">[ If I want to vape when ____________, then I will ____________. ]</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">[ If someone offers me a vape, then I will ____________. ]</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">[ If I slip once, then I will ____________. ]</span></p>", "blockId": 640668, "textType": "RichText"}, "id": "53339dc0-7e04-4d0f-beb8-974bbc733e85"}, {"component": "TEXT-ENTRY", "config": {"question": {"text": "", "content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Replace the blanks with your answers by typing your answers in the template that you pasted below. Your answers are saved to your account.</span></p>", "textType": "RichText"}, "placeholder": {"text": "Enter your response here"}, "blockId": 640668}, "id": "199d42bd-7986-4e07-8d95-4f9360846536"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Correct.</h1>", "textType": "RichText"}, "content": "<p>Correct.</p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect."}, "content": {"text": "Incorrect."}}, "blockId": 640668}, "id": "7fea1942-5e64-4ff2-ae5f-7a9c6f0efd4b"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "d2660e93-ef30-4115-8dad-05e99374b0f0"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 06 Build Your Quit Plan en-US-Andrew-20260728-51ef3487-36aa-4469-b7a5-7904e7aef121.mp3", "transcript": " "}, "id": "b033cc7c-078f-42cb-ac7c-ed235dfc4c1e"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 7, "layoutType": null, "alignContent": null, "learningobject_id": 27306}, {"id": 640669, "hashId": "7c9af058-c031-4c32-8f3b-e95e6382ab7a", "learningObjectId": 27306, "title": "Coping Skills That Work", "synopsis": "Provides coping skills that help when quitting.", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640669, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Coping Skills That Work</strong></h1>", "textType": "HEADING"}, "id": "533e2165-d7a0-4ccf-860d-a04efac1fe52"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Replacing a habit requires having something to replace it with.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">• FOR STRESS: Aerobic exercise (even 15 min raises endorphins measurably). Diaphragmatic breathing: 4 sec in, hold 4 sec, 6 sec out. Both are free and immediate.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">• FOR BOREDOM / ORAL FIXATION: Water, sugar-free gum, sunflower seeds, carrot sticks.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">• FOR SOCIAL SITUATIONS: Have something in your hand. Move to a part of the space where others aren't vaping.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">• FOR MORNING CRAVINGS: A consistent competing routine — exercise, breakfast, a short walk.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">• FOR NIGHTTIME: Short exercise, hands-busy activity (drawing, puzzle, phone call), screen-free wind-down.</span></p>", "blockId": 640669, "textType": "RichText"}, "id": "ca298e54-6af5-480a-94c2-d662024394b8"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 06 Coping Skills That Work Cartoon-eff93574-77d4-4ee6-9f42-6c0c519b45aa.jpeg", "alt": "An image with 5 grids with a teenaged boy in the middle with his hand on his chin depicting him thinking. The top left grid shows him running and the caption at the top says, for stress. There is a graphic of a heart and of lungs representing aerobic exercise and diaphragmatic breathing. The top right grid  shows a bottle of water, sunflower seed, sugar-free gum and carrots. The caption says for boredom/ oral fixation. The middle left grid shows the teenaged boy with a bottle of water  and 3 teens are in the background to the left. The caption says, for social situations. There is a graphic of a hand of of a group of people figures depicting to have something in your hand and move to a space where others aren't vaping. The  middle right grid shows the teenaged boy. The caption at the top says, for morning cravings with a graphic of a person running representing exercise; a bowl of cereal representing breakfast and a pair of shoes representing walking underneath the caption. The grid at the bottom of the image spans across the bottom of the image. The caption on the left says for nighttime. It has a graphic of a barbell representing short exercise; a pen representing hands-busy activities like drawing;  a phone representing a phone call and a moon and stars representing screen free wind-down. On the right side of the grid the teenaged boy is sitting at the table with pen and paper. There is a lamp with a soft glow of light behind him.", "variant": "square", "blockId": 640669, "caption": {"text": ""}, "mode": "scale"}, "id": "555548e2-1a32-4869-9ddd-55ebd82b8dcd"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "fd71597c-1d25-4415-a548-65ddafa32c8b"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 06 Coping Skills That Work en-US-Andrew-20260728-813d7582-d60c-4992-be73-fca7716ee7a6.mp3", "transcript": " "}, "id": "11d14e03-1f20-4222-bd4e-be667ef8f36c"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 8, "layoutType": null, "alignContent": null, "learningobject_id": 27306}, {"id": 640670, "hashId": "0bee5f0e-88e3-47c9-9eb2-c13d0c1c9104", "learningObjectId": 27306, "title": "Free National Resources", "synopsis": "List of free national resources is provided.", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640670, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Free National Resources</strong></h1>", "textType": "HEADING"}, "id": "6446a6b6-7574-4806-8f97-14cdc84cfa2f"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">You don't have to quit alone. </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">These resources are free</strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\"> and available right now:</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">• </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">Smokefree Teen —</strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\"> </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\"><a href=\"https://www.teen.smokefree.gov\" target=\"_blank\">teen.smokefree.gov</a></strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">: Quit plans, apps, and tools for young people.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">• </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">This is Quitting — Text DITCHVAPE to 88709:</strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\"> Free text-message quit program for young vapers.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">• </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\"><a href=\"tel:+18007848669\" target=\"_blank\" aria-label=\"+ 1 8 0 0 7 8 4 8 6 6 9\">1-800-QUIT-NOW</a></strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">: National quitline. Free, confidential. Spanish: </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\"><a href=\"tel:+1-8553353569\" target=\"_blank\" aria-label=\"+ 1 - 8 5 5 3 3 5 3 5 6 9\">1-855-DÉJELO-YA</a></strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">• </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\"><a href=\"https://www.smokefree.gov\" target=\"_blank\">Smokefree.gov</a></strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">: Broader federal cessation site including tools </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">for adults 18+</strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">• </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\"><a href=\"tel:+988\" target=\"_blank\" aria-label=\"+ 9 8 8\">988</a> (call or text)</strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">: Mental health, substance use, or crisis support — </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">24/7</strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">• </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">SAMHSA:</strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\"> </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\"><a href=\"tel:+18006624357\" target=\"_blank\" aria-label=\"+ 1 8 0 0 6 6 2 4 3 5 7\">1-800-662-4357</a></strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">: Treatment referral for substance-use and mental health disorders.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">• </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">Poison Help: <a href=\"tel:+18002221222\" target=\"_blank\" aria-label=\"+ 1 8 0 0 2 2 2 1 2 2 2\">1-800-222-1222</a></strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">: For any </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">e-liquid exposure</strong><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">. </span><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.0625em\">Call immediately.</strong></p>", "blockId": 640670, "textType": "RichText"}, "id": "33167495-523d-46af-8fbe-a3ec059af590"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 06 Free National Resources and Support Info Cartoon-0ecbf822-8f26-4acc-b209-5114f9b9ac27.jpeg", "alt": "Image of a teenaged boy looking at his cell phone. Next to him there is a large image of his cell phone screen which shows the free national resources for quitting vaping. They are the same resources shown in the text on the screen next to the image. There is a sign on the wall behind him that says, you got this. There are 2 books and a notebook and a pen on the table that he is sitting at and also a plant.", "variant": "square", "blockId": 640670, "caption": {"text": ""}}, "id": "4394be49-5c18-4cbf-bc13-e35eb32e0fb2"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "5b901e1b-8f00-4bdb-bf8e-42270da13f4f"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 06 Free National Resources en-US-Andrew-2026072-4ad8730f-2eb9-49c4-807d-e85203f6aab0.mp3", "transcript": " "}, "id": "00475afe-577d-4a67-a27d-5d1af14733ae"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 9, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27306}, {"id": 640671, "hashId": "43961254-2fae-413e-91f0-9f3eec546ca1", "learningObjectId": 27306, "title": "Helping Someone Else Quit", "synopsis": "Tips for helping someone else quit are provided.", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640671, "content": "<h2 class=\"font-style--h2\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Helping Someone Else Quit</strong></h2>", "textType": "HEADING"}, "id": "1a2fef4a-466d-4cb1-ac69-46dd75980b40"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">If a friend, partner, sibling, or child is trying to quit:</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">• Ask what kind of support would help most — people need different things.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">• Don't nag or shame. Shame increases stress, and stress is a major trigger for relapse.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">• Don't celebrate in ways that emphasize how hard it is. Keep it matter-of-fact.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">• Be available during the first week — when withdrawal is steepest.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">• If there is a slip, respond to it as information, not failure. Ask what triggered it.</span></p>", "blockId": 640671, "textType": "RichText"}, "id": "822196f8-cf15-40e8-94df-34d4dcaf1386"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 06 Helping Someone Quit Cartoon-aad4f1ee-cb82-431a-a6f9-f84c6c06f55d.jpeg", "alt": "Image of a man and a teenaged boy sitting on a sofa. A sign on the wall behind them says,  you don't have to do this alone. There is a bookcase with books behind them on the left.  A table in front of them has a mug that says, progress, not perfection and a notebook that says small steps today, stronger tomorrow and a heart. There is a plant on the table between the mug and the notebook.", "variant": "square", "blockId": 640671, "caption": {"text": ""}}, "id": "6a661fc2-808f-4f4d-bc2d-7f0b593739d1"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "ff48e234-56df-4eb6-b840-c6df5edd84d4"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 06 Helping Someone Else Quit en-US-Andrew-20260728-ef69b71e-a88d-4579-be16-c30eadabb212.mp3", "transcript": " "}, "id": "cd843052-d5bc-450d-a170-d524d1efcdee"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 10, "layoutType": null, "alignContent": null, "learningobject_id": 27306}, {"id": 640672, "hashId": "318ad59d-af68-445e-a7c9-0154660f4fb5", "learningObjectId": 27306, "title": "For Families and Caregivers", "synopsis": "Tips for families and caregivers who are providng support.", "templateBlock": false, "sectionId": null, "block": "IMAGE-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640672, "content": "<h2 class=\"font-style--h2\"><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">FOR FAMILIES AND CAREGIVERS</span></h2>", "textType": "HEADING"}, "id": "60a2a771-a19b-465b-8d79-da07198ff7bd"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Research on effective parental response to youth vaping points toward supportive, non-punitive engagement over confrontation and punishment.</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Expressing genuine concern rather than anger, listening before responding, and helping a young person access quit resources are more effective than taking a device away without a conversation. Removal of access matters — but it works better paired with support than as a standalone consequence.</span></p>", "blockId": 640672, "textType": "RichText"}, "id": "ececce0c-21df-487e-82b6-5df71ea1a1de"}, {"component": "IMAGE", "config": {"src": "/resources/CC Chapter 06 Tips for Cargivers and Families Cartoon-ba80f14b-48da-49f6-acc0-4ec1a2d712f7.jpeg", "alt": "Image for families and caregivers showing mother and son with an 3 infographic messages on the right side. The top one shows a graphic of an upward palm with a heart above it and next to it , it says, expressing genuine concern rather than anger. The middle one shows an ear graphic and next to it, it says,  listening before responding. The bottom one shows a graphic of 2 people figures with a speech bubble and next to it, it says, helping a young person access quit resources. There is an infographic at the bottom of the image. It has a graphic of a cell phone on the left which says quit resources on the screen. The text in the midde says, removal of access matters - but it works better paired with support than as a standalone consequences. Next to the text there is a graphic of a plus sign and a box with a picture of a lock on the front and vaping devices inside. Next to the box there is a graphic of two people figures and a heart in a speech bubbl", "variant": "square", "blockId": 640672, "caption": {"text": ""}}, "id": "8cd158f2-601a-4f46-8d32-024d41d48186"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "95586fe3-52fd-4d83-a0a7-b3e469eae69e"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 06 Family Support en-US-Andrew-20260729-8652592d-aab1-4457-b357-fb17450afe8e.mp3", "transcript": " "}, "id": "a789d8d7-1253-48e7-a8d3-ea05dfe3d5d6"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 11, "layoutType": null, "alignContent": null, "learningobject_id": 27306}, {"id": 640673, "hashId": "2521b213-03fe-4b10-a6e5-0149cf5285ba", "learningObjectId": 27306, "title": "What to Expect After Quitting", "synopsis": "Video gives information on what to expect in the different timeframes of quitting.", "templateBlock": false, "sectionId": null, "block": "VIDEO-ONLY__ONE-ROW-TWO-THIRD", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640673, "content": "<h1 class=\"font-style--h1 ql-align-center\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">What to Expect After Quitting</strong></h1>", "textType": "HEADING"}, "id": "272aa889-81d1-474c-84a3-0dfba92bc01e"}, {"component": "RICH-TEXT", "config": {"content": "<p class=\"ql-align-center\"><span style=\"font-size:1.1875em\">Click to watch the video below.</span></p>", "blockId": 640673, "textType": "RichText"}, "id": "1ad1b23b-5456-4520-b146-162d8686caf7"}, {"component": "VIDEO", "config": {"src": "/resources/CC Chapter 06 What to Expect When Quitting Over Time-d4b2ec1b-7088-4704-91a5-42f7687fc7d7.mp4", "trackUrl": "/resources/2019-11-26T00-19-23.925Z-siren.vtt", "posterUrl": "", "blockId": 640673, "showTranscriptButton": false, "transcript": {"content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Days 1–3: The hardest. Get through 72 hours nicotine-free and your body has cleared most nicotine; acute withdrawal has peaked.</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Weeks 1–2: Sharpest decline in withdrawal intensity. Sleep improves. Concentration returns.</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Weeks 3–4: Still strong situational cravings — first party, first stressful test, first time seeing a close friend vape. Shorter-lived and more manageable with the if-then plans you built.</span></p><p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Beyond month 1: Continued improvement with occasional cravings that diminish in frequency and intensity. A craving months later is not proof quitting has failed. It is evidence the brain still remembers the association — an association that fades with time and non-reinforcement.</span></p>", "textType": "RichText"}}, "id": "87163837-9cd4-436c-88c8-6f636a6b90fa"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "f394e592-2444-4993-9cc8-adc4229aba98"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 06 What to Expect After Quitting en-US-Andrew-20260728-64a9a5aa-55dc-4535-ad42-98abfce76f9e.mp3", "transcript": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Days 1–3: The hardest. Get through 72 hours nicotine-free and your body has cleared most nicotine; acute withdrawal has peaked.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Weeks 1–2: Sharpest decline in withdrawal intensity. Sleep improves. Concentration returns.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Weeks 3–4: Still strong situational cravings — first party, first stressful test, first time seeing a close friend vape. Shorter-lived and more manageable with the if-then plans you built.</span></p><p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Beyond month 1: Continued improvement with occasional cravings that diminish in frequency and intensity. A craving months later is not proof quitting has failed. It is evidence the brain still remembers the association — an association that fades with time and non-reinforcement.</span></p>"}, "id": "1254da7b-81a5-4e61-bb98-2f14f2799301"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 12, "layoutType": "ONE-ROW-TWO-THIRD", "alignContent": "Center", "learningobject_id": 27306}, {"id": 640674, "hashId": "b30d3d5d-8419-4557-a272-14775f8ac657", "learningObjectId": 27306, "title": "Knowledge Check 6", "synopsis": "Multiple Choice Question", "templateBlock": false, "sectionId": null, "block": "MULTIPLE-CHOICE-RIGHT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640674, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Knowledge Check 6</strong></h1>", "textType": "HEADING"}, "id": "eca8c78c-845d-409c-95d9-b5ee987c527b"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.3125em\">Which 'if-then' quit plan is the strongest?</span></p>", "blockId": 640674, "textType": "RichText"}, "id": "8e68fb7a-56b7-4b5a-908a-66305f5f4ee0"}, {"component": "MULTIPLE-CHOICE", "config": {"randomize": false, "select": 4, "allowMultiple": false, "question": {"text": "", "content": "<p><strong style=\"color:rgba(0, 0, 0, 0.918);font-size:1.1875em\">Choose the best answer.</strong></p>", "textType": "RichText"}, "multipleChoiceType": "default", "answerType": "TEXT", "answers": [{"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": false, "selected": false, "index": 0, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "31ff94ea-1110-46af-a4d2-483c237207a7", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">A. 'If I want to vape after school, then I'll see what happens.'</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": true, "selected": false, "index": 1, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "1eb0672f-fc19-4ea8-ba6c-8cf68e5b8b72", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">B. 'If a craving hits after work, then I will text my support person, drink water, and take a 10-minute walk.'</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": false, "selected": false, "index": 2, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "8526c56b-6234-425a-afc5-eae7945bb7bd", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">C. 'If someone offers me a vape, then I'll hold it for them.'</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "correct": false, "id": "532d51be-e36d-4e93-823a-bc5bca3e006d", "index": 3, "content": "<p><span style=\"font-size:1.1875em;color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">D. 'If I get stressed, then vaping is the only thing that works.'</span></p>", "textType": "RichText"}], "blockId": 640674}, "id": "ba91734c-c3b9-41f4-b0f1-a5d367959767"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Correct.</h1>", "textType": "RichText"}, "content": "<p><span style=\"color:rgb(255, 255, 255);font-family:Calibri, sans-serif;font-size:1.1875em\">Exactly. Option B is specific, immediate, tied to support, and substitutes a competing behavior.</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect.", "content": "<h1 class=\"font-style--h1\">Incorrect.</h1>", "textType": "RichText"}, "content": "<p><span style=\"color:rgb(255, 255, 255);font-family:Calibri, sans-serif;font-size:1.1875em\">Review the if-then plan section. The strongest plan is specific, names a real action, and includes a support step.</span></p>", "textType": "RichText"}, "blockId": 640674}, "id": "9455be0f-dca9-4f74-96f6-879c536abfa4"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 PM-1b073d4c-9fe0-4db8-8c32-3aa084455097.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "a1a1d909-13fe-4d6d-ba62-ee3db1868d1c"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 06 Knowledge Check 6 en-US-Andrew-20260728-a823ded6-7c87-467c-9ce6-0315f2111d90.mp3", "transcript": " "}, "id": "5ef5a50f-1d4c-42a2-bf56-adad467b3ac5"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 13, "layoutType": null, "alignContent": null, "learningobject_id": 27306}, {"id": 640675, "hashId": "ca49e236-7b3e-489b-ae58-db611706b98d", "learningObjectId": 27306, "title": "Reflection — Chapter 6", "synopsis": "Chapter 6 reflection.", "templateBlock": false, "sectionId": null, "block": "TEXT-ENTRY-TEXT-LEFT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640675, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">Reflection — Chapter 6</strong></h1>", "textType": "HEADING"}, "id": "0ab3a874-1323-48a2-857c-54f83fc1a09d"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">1. What are your three highest-risk triggers — the situations most associated with wanting to vape? What is your specific if-then response to each one?</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">2. Who is the one person you would tell about a quit attempt? What makes that person the right choice?</span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">3. What would you do differently during the next quit attempt if a previous one ended in relapse?</span></p>", "blockId": 640675, "textType": "RichText"}, "id": "54f34946-47ee-4ba8-b848-82a2f9ae479e"}, {"component": "TEXT-ENTRY", "config": {"question": {"text": "", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">Type your responses below. This is not scored. It will be saved to your account.</span></p>", "textType": "RichText"}, "placeholder": {"text": "Enter your response here"}, "blockId": 640675}, "id": "be7a26d5-a42c-4ee5-a3c6-3ed60dda46a1"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Correct.</h1>", "textType": "RichText"}, "content": "<p>Correct.</p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect."}, "content": {"text": "Incorrect."}}, "blockId": 640675}, "id": "0 png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "67abcab9-c68e-452e-afbe-56a40afe08e2"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Chapter 06 End of Chapter en-US-Andrew-20260728-ca22b79e-af38-4af3-91cb-ce15ad96456b.mp3", "transcript": " "}, "id": "81f1cb51-2809-47d5-a56f-c5eb72201abc"}], "parentHash": "f8e87767-e1cf-4fdc-8d04-40df910399dc", "order": 15, "layoutType": "ONE-ROW-ONE-THIRDS-AND-TWO-THIRDS-COL", "alignContent": null, "learningobject_id": 27306}, {"id": 641621, "hashId": "3d9616d1-f487-4343-9340-6d6ae3b81835", "learningObjectId": 27341, "title": "Final Exam", "synopsis": null, "templateBlock": null, "sectionId": null, "block": null, "blockType": "ASSESSMENT-SECTION-BLOCK", "components": null, "parentHash": "ff628d4b-4648-4d68-bfd5-66031dc71902", "order": 8, "layoutType": null, "alignContent": null, "learningobject_id": 27341}, {"id": 641620, "hashId": "c928dc20-cfce-42fa-b786-d602c8127e42", "learningObjectId": 27341, "title": "Introduction", "synopsis": null, "templateBlock": true, "sectionId": null, "block": null, "blockType": "SECTION-BLOCK", "components": null, "parentHash": "544f9e07-dbbc-4989-bea5-afc0f29cc06e", "order": 1, "layoutType": null, "alignContent": null, "learningobject_id": 27341}, {"id": 641622, "hashId": "83f65496-35a8-4aec-9cf0-ed116e1ef33d", "learningObjectId": 27341, "title": "Assessment Intro", "synopsis": null, "templateBlock": true, "sectionId": null, "block": "ASSESSMENT-INTRO-TEXT-LEFT", "blockType": "ASSESSMENT-INTRO-BLOCK", "components": [{"component": "HEADING", "config": {"text": "Assessment", "blockId": 641622, "content": "<h1 class=\"font-style--h1\">Assessment</h1>", "textType": "HEADING"}, "id": "f1c2c1b2-db95-4e96-a921-9667908e4279"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(0, 0, 0)\">The following twenty questions cover material from all six chapters in the online course. Questions are presented one at a time and may appear in randomized order. </span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(0, 0, 0)\">Read each question carefully and select the best answer. A score of 80 percent or higher — 16 out of 20 correct — passes the exam and triggers automatic generation of your certificate of completion. </span></p><p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(0, 0, 0)\">For any question answered incorrectly, the rationale shown after the exam points you back to the relevant chapter. If you do not pass on the first attempt, the course will direct you to review specific chapters before retaking. </span></p><p><strong>Good luck!</strong></p>", "blockId": 641622, "textType": "RichText"}, "id": "1ae139e2-7985-45bd-abce-9b3034f0d5cd"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "layout": "FULL_PAGE", "isActive": true, "color": "#FFFFFF", "opacity": 100}, "id": "e77a7a02-348e-43d3-89e1-c43726e5a56e"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Assessment en-US-Andrew-2026081-7737d - 108d19c9.mp3", "transcript": " "}, "id": "355861a4-1f27-495d-acd4-784c05770f73"}, {"component": "IMAGE", "config": {"src": "/resources/CC Final Exam Introduction - c870c6a3.jpeg", "alt": "Image of a teenaged boy sitting at a desk with a notebook and pen. An infographic beside him on the left is titled, Assessment Time and subtitled Let's check what you know.  Under the subtitle it says, this assessment will help you review key ideas from the course and see how much you've leaned about vaping, nicotine, and making healthy choices. Under that paragraph there are 3 more lines of information. The first one says think back, use what you've learned. The next one says, do your best, there are no trick questions and the last one says, your choices matter, keep building a healthier future for you. There is a rectangled text box on the table with a star in it and it says, You've got this! Let's get started. A poster is on the wall behind the teenager that says, know more, choose better.", "variant": "square", "blockId": 641622, "caption": {"text": ""}}, "id": "65f9c094-875b-4f11-8220-34e1f254e4af"}], "parentHash": "3d9616d1-f487-4343-9340-6d6ae3b81835", "order": 1, "layoutType": null, "alignContent": null, "learningobject_id": 27341}, {"id": 641623, "hashId": "cfc074fa-4d5f-49d3-a117-5918ea793856", "learningObjectId": 27341, "title": "CC_EXAM_01", "synopsis": "Pool A - Brain Multiple Choice Question.", "templateBlock": false, "sectionId": null, "block": "MULTIPLE-CHOICE-RIGHT", "blockType": "QUESTION-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 641623, "content": "<h1 class=\"font-style--h1\"><strong style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">Pool A — Brain</strong></h1>", "textType": "HEADING"}, "id": "ba2bc880-1cf1-485c-9002-ffebb126ca98"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.3125em\">Which statement is most accurate about nicotine and young people?</span></p>", "blockId": 641623, "textType": "RichText"}, "id": "f0af7989-afdc-46e6-904c-584187cc53b9"}, {"component": "MULTIPLE-CHOICE", "config": {"randomize": false, "select": 4, "allowMultiple": false, "question": {"text": "", "content": "<p><strong style=\"font-size:1.3125em\">Choose the best answer below.</strong></p>", "textType": "RichText"}, "multipleChoiceType": "default", "answerType": "TEXT", "answers": [{"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": false, "selected": false, "index": 0, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "abbcf499-2a18-4e53-a826-61e74768eb19", "content": "<p><span style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34);font-size:1.1875em\">A. Nicotine is mainly a flavoring and only affects the lungs.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": true, "selected": false, "index": 1, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "14a145c8-707e-463c-ae2f-71dca4eff0ef", "content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">B. Nicotine is highly addictive and can affect attention, learning, mood, and impulse control while the brain is still developing.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "correct": false, "selected": false, "index": 2, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "id": "e8c1d7d7-62e6-4e04-81bb-f1c2b8ed4835", "content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">C. Nicotine is only a problem if someone also smokes cigarettes.</span></p>", "textType": "RichText"}, {"text": "", "image": {"src": "/resources/2019-10-08T03-16-56.907Z-placeholder.png", "alt": "Image description", "variant": "square"}, "video": {"src": "/resources/2019-11-13T01-26-36.988Z-Aerial Shot Of City.mp4", "trackUrl": "", "posterUrl": ""}, "audio": {"src": "/resources/2019-10-25T03-45-25.995Z-Arkham_mixdown.mp3", "transcript": {"content": ""}}, "correct": false, "id": "21139c0e-a92e-4e34-af35-cdff1258cb89", "index": 3, "content": "<p><span style=\"font-size:1.1875em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">D. Nicotine doesn't create withdrawal unless used for many years.</span></p>", "textType": "RichText"}], "blockId": 641623}, "id": "3d982f9b-e8dd-4783-b561-81bff5ee0ace"}, {"component": "FEEDBACK", "config": {"success": {"image": {"src": "/resources/2019-10-10T05-09-20.324Z-ico_correct.png", "alt": "success feedback icon"}, "heading": {"text": "Correct.", "content": "<h1 class=\"font-style--h1\">Correct.</h1>", "textType": "RichText"}, "content": "<p><span style=\"color:rgb(255, 255, 255);font-family:Calibri, sans-serif;font-size:1.3125em\">CDC: nicotine harms developing brain.</span></p>", "textType": "RichText"}, "failure": {"image": {"src": "/resources/2019-10-10T05-10-05.765Z-ico_incorrect.png", "alt": "success feedback icon"}, "heading": {"text": "Incorrect.", "content": "<h1 class=\"font-style--h1\">Incorrect.</h1>", "textType": "RichText"}, "content": "<p><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(255, 255, 255)\">﻿Remediation: Review Chapter 2</span></p>", "textType": "RichText"}, "blockId": 641623}, "id": "b8ac6292-e16d-4abf-82e8-176a1419796f"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "9e46d1cc-a032-4b89-a292-2befc767ad4c"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "", "transcript": " "}, "id": "25a8a7b0-152c-42e1-8c75-ad3c0feae10d"}], "parentHash": "3d9616d1-f487-4343-9340-6d6ae3b81835", "order": 2, "layoutType": null, "alignContent": null, "learningobject_id": 27341}, {"id": 641624, "hashId": "4df9227f-9b40-49b2-8f6e-a3c428dd5d87", "learningObjectId": 27341, "title": "CC_EXAM_02", "synopsis": "Pool A - Brain Multiple Choice Question.", "temp l, "blockType": "SECTION-BLOCK", "components": null, "parentHash": "ff628d4b-4648-4d68-bfd5-66031dc71902", "order": 9, "layoutType": null, "alignContent": null, "learningobject_id": 27308}, {"id": 640686, "hashId": "4b9e68d2-7b3f-47e0-ab8e-1dda0ba4e916", "learningObjectId": 27308, "title": "What to Remember", "synopsis": "Four key takeaways from the course.", "templateBlock": false, "sectionId": null, "block": "CAROUSEL-TEXT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "", "blockId": 640686, "content": "<h2 class=\"font-style--h2 ql-align-center\"><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif\">What to Remember</span></h2>", "textType": "HEADING"}, "id": "e7cebe26-ab5c-4703-b6e3-2f36f28c29f6"}, {"component": "TEXT", "config": {"text": "", "blockId": 640686, "content": "<p class=\"ql-align-center\"><strong style=\"font-size:1.0625em\">Click the slide number or the green next slide button below for Four Key Takeaways</strong></p>", "textType": "RichText"}, "id": "1bdcf8b5-68e8-4e9f-801b-97106a445228"}, {"component": "CAROUSEL", "config": {"type": "text", "frames": [{"image": {"src": "/resources/CC Course Complete Takeaway 1 - 05682769.jpeg", "alt": "Split image of a brain showing the developed adult half on the left and the youth brain that is vaping affected on the right.  Three parts of the brain are labeled on each side showing the function  of the adult brain on the left side of the image and how nicotine affects those area on the youth brain on the right side of the image. At the bottom of the image it says, vaping impacts brain development.", "variant": "square", "disableVariantConfig": true, "caption": {"text": ""}, "mode": "fill"}, "text": "", "content": "<p><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">1. NICOTINE CAN TRAIN THE DEVELOPING BRAIN TOWARD DEPENDENCE — and that development continues until about age 25.</span></p>", "textType": "RichText", "id": "73d82d41-dde8-471a-9acc-4a864864187e"}, {"image": {"src": "/resources/CC Course Complete Takeaway - 439969fd.jpeg", "alt": "Image shows 2 bottles of benzoic acid with fruit around it. The caption says fruit ≠ safe.", "variant": "square", "disableVariantConfig": true, "caption": {"text": ""}}, "text": "", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.3125em\">2. SWEET FLAVOR NAMES DO NOT MAKE PRODUCTS SAFE — flavor is a marketing tool, not a safety signal.</span></p>", "textType": "RichText", "id": "bc93cac2-959d-4e4d-9f35-d3cf5cdb5995"}, {"image": {"src": "/resources/CC Course Complete Key Things To - 9130d64a.jpeg", "alt": "Image shows 3 teenagers bothered by smoke from vaping aerosol in the air. The caption says,  aerosol from vaping affects those nearby.", "variant": "square", "disableVariantConfig": true, "caption": {"text": ""}}, "text": "", "content": "<p><span style=\"color:rgb(34, 34, 34);font-family:Calibri, sans-serif;font-size:1.3125em\">3. AEROSOL CAN AFFECT BOTH THE USER AND PEOPLE NEARBY — secondhand exposure is real.</span></p>", "textType": "RichText", "id": "e1e6a2cb-e8fe-4b02-b9a8-f4721f348548"}, {"image": {"src": "/resources/CC Course Complete Takeaway 4 - 4389c5b1.jpeg", "alt": "Image of teenaged boy walking toward 4 teenagers sitting down. The caption at the top says, Quitting is hard. Support makes it more likely to work. ", "variant": "square", "disableVariantConfig": true, "caption": {"text": ""}}, "text": "", "content": "<p><span style=\"font-size:1.3125em;font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">4. QUITTING IS HARD, BUT SUPPORT MAKES IT MORE LIKELY TO WORK — you do not have to do it alone.</span></p>", "textType": "RichText", "id": "da68ea02-664b-40ea-af12-9544c0359c17"}], "blockId": 640686}, "id": "a398a275-5bbb-4d76-a6c5-ace6fa8b9c7b"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "a6ec95f0-e7b1-4c4c-b878-48f3a18fdecd"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Closing of Sequence and Certificate - 68815940.mp3", "transcript": " "}, "id": "f3f68780-c808-4357-b206-660321ce798e"}], "parentHash": "a01ce1e4-2f7b-4403-b795-adb5b829b2f5", "order": 1, "layoutType": "TWO-ROW-ONE-COL", "alignContent": null, "learningobject_id": 27308}, {"id": 640687, "hashId": "6f642bdb-76e2-4897-9a09-830d7b774a0a", "learningObjectId": 27308, "title": "If You Need Help", "synopsis": "Resources to download and save for help and support.", "templateBlock": false, "sectionId": null, "block": "WEB-OBJECT-TEXT", "blockType": "CONTENT-BLOCK", "components": [{"component": "HEADING", "config": {"text": "Heading", "blockId": 640687, "content": "<h1 class=\"font-style--h1\"><strong style=\"font-family:Calibri, sans-serif;color:rgb(34, 34, 34)\">If You Need Help Now</strong></h1>", "textType": "HEADING"}, "id": "467bb0bd-d547-4c56-a1a6-5fa6b37dac11"}, {"component": "RICH-TEXT", "config": {"content": "<p><span style=\"font-size:1.3125em\">Download or print the PDF on the right to save the support information and phone numbers.</span></p>", "blockId": 640687, "textType": "RichText"}, "id": "1df0de6d-236a-4f23-933e-7d0dc3d2990d"}, {"component": "WEB-OBJECT", "config": {"src": "/resources/Support Information and Phone - 2f3146f1.pdf", "blockId": 640687}, "id": "44d1eaad-98e5-4cd5-a9fa-cc8a753749b3"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "caa58b8a-99a1-4a1a-9943-5c191a69bc9c"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC If You Need Help Now en-US-Andrew-202 - 85159a1a.mp3", "transcript": " "}, "id": "0d4bbf83-d5c4-4e78-8424-697b0f35c163"}], "parentHash": "a01ce1e4-2f7b-4403-b795-adb5b829b2f5", "order": 2, en sign that says, your future, your choice.  Keep going. At the bottom of the image there is a check mark in a green circle, the words next to is says, you have the power to live vape free. You've got this! Underneath it at the bottom of the image, it says, breathe deep. live well. be proud.", "variant": "square", "blockId": 640688, "caption": {"text": ""}}, "id": "2d3a7a3e-e0be-4cf5-b64b-81b7c08f2936"}, {"component": "BACKGROUND-IMAGE", "config": {"src": "/resources/ChatGPT Image Apr 29, 2026, 05_30_47 - 9b08ca80.png", "color": "#FFFFFF", "opacity": 100, "layout": "FULL_PAGE", "isActive": true}, "id": "1d9a908c-474b-40c8-a5bc-6b71e0a57370"}, {"component": "BACKGROUND-AUDIO", "config": {"src": "/resources/CC Course Complete en-US-Andrew-20260729 - 701f3051.mp3", "transcript": " "}, "id": "af073d18-9041-49cd-af5d-7e11b226001f"}], "parentHash": "a01ce1e4-2f7b-4403-b795-adb5b829b2f5", "order": 3, "layoutType": "ONE-ROW-HALF-HALF-COL", "alignContent": null, "learningobject_id": 27308}], "isArchivedTDTheme": false};window.packaged=true;
